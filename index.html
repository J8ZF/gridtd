  if (!heavy) {
    gun += R(-7, y - 1.7, 0.9, 3.4, "rubber") + P([-6.1, y - 1.7, -0.4, y - 1.1, -0.4, y + 1.1, -6.1, y + 1.7], WOOD) + L(-5.4, y - 0.5, -1.4, y - 0.2, WOOD_DARK, 0.4); // butt pad, stock
  }
  if (lv === 1) {
    gun += P(cut(-0.4, y - 2, 4.6, y + 2, 0.6), "steel") + R(0.4, y - 0.4, 2.2, 0.8, "steelHi"); // action, top lever
    gun += R(4.6, y - 2.3, 5.4, 4.6, WOOD); // fore-end under the barrels
    gun += R(4.6, y - 1.9, 12.4, 1.8, "steelHi") + R(4.6, y + 0.1, 12.4, 1.8, "steelHi") + R(4.6, y - 0.15, 12.4, 0.3, "steel") + R(16.2, y - 0.3, 0.6, 0.6, "gunHi"); // two barrels, rib, bead
  } else if (lv === 2) {
    gun += P(cut(-0.4, y - 1.9, 6.4, y + 1.9, 0.6), "steel") + R(2.2, y - 0.5, 2.6, 1, "hole"); // receiver, ejection port
    for (let k = 0; k < 4; k++) gun += R(0.6 + k * 1.3, y + 1.9, 1, 1.6, SHELL) + R(0.6 + k * 1.3, y + 3.1, 1, 0.5, "gun"); // shell saddle
    gun += R(6.4, y - 1.6, 12.8, 1.7, "steelHi") + R(6.4, y + 0.2, 10, 1.4, "steel"); // barrel, tube magazine
    gun += R(8.4, y - 2.1, 5.2, 4.2, WOOD); // slide
    for (const x of [9.4, 10.6, 11.8]) gun += R(x, y - 2.1, 0.5, 4.2, WOOD_DARK);
    gun += R(18.6, y - 1.8, 0.8, 2, "gun"); // muzzle
  } else {
    gun += R(-7, y - 1.6, 1, 3.2, "rubber") + P([-6, y - 1.8, 0, y - 2.1, 0, y + 2.1, -6, y + 1.8], "hull"); // stock
    gun += P(cut(0, y - 2.2, 8.4, y + 2.2, 0.8), "steel") + R(0.8, y - 0.4, 6.6, 0.8, "steelHi"); // receiver, top rail
    for (const x of [2, 3.6, 5.2]) gun += R(x, y - 0.4, 0.5, 0.8, "steel");
    gun += P(cut(1.8, y + 1.8, 7.8, y + 7.8, 1.4), "steel") + P(cut(2.8, y + 2.8, 6.8, y + 6.8, 1), "plate") + R(4.4, y + 4.4, 0.8, 0.8, "gun"); // drum
    gun += R(8.4, y - 1.4, 8, 2.8, "steelHi") + R(8.4, y - 1.9, 6.4, 3.8, "hull"); // barrel, perforated shield
    for (const x of [9.4, 11, 12.6]) gun += R(x, y - 0.5, 0.9, 1, "steel");
    gun += R(16.2, y - 2.3, 3, 4.6, "hull") + R(16.9, y - 2.3, 0.5, 4.6, "hole") + R(18, y - 2.3, 0.5, 4.6, "hole"); // brake
  }
  const torso = heavy ? "c-60" : "c-8", legs = heavy ? "c-72" : "c-38";
  let over = R(-8, -13, 1.6, 26, heavy ? "#2e2219" : LEATHER); // belt
  over += P(cut(-12.6, -12.6, -7.6, -4.4, 1), heavy ? "#3a2c21" : "#6b4e35") + L(-10.2, -12.6, -10.2, -4.4, LEATHER, 0.6) + R(-8.8, -9.2, 1, 1.6, "steel"); // game bag
  over += bandolier(3.4, -11, -7, 10.4);
  if (heavy) {
    over += bandolier(3.4, 11, -7, -10.4);
    for (const s of [-1, 1]) over += P(cut(-4.4, s > 0 ? 9.8 : -14.6, 3.8, s > 0 ? 14.6 : -9.8, 1.4), FUR_DARK) + L(-2.6, s * 12.2, 2, s * 12.2, "#4d4338", 0.5); // fur on the shoulders
  }
  over += nub(1.2);
  if (lv >= 2) over += ushanka(heavy);
  return { base: pad(2, 2), turret: outline() + gun + body({ torso, legs }) + over };
};

// 커맨더 (remake #9), an admiral in the tower's yellow: a long yellow coat with cream trim that flares out to the
// sides as it goes down, open at the back so the legs show in the middle; a big cream star on the back and a
// collar; long sleeves down the sides, wider than the hands, about two thirds coat with a cream cuff, the square
// hands in front; plain dark gray shoulder boards on the outer sides of the torso; a flag on a pole at the
// left: gold cloth with a fold, a ragged fly edge and a dark star, a gold finial. Lv2 전투 훈련: a sabre at the
// right hip. Lv3 콜 투 암즈: a deeper yellow coat with a second trim, a bigger flag, two stripes on the cuffs,
// darker trousers, a megaphone in hand and the white peaked cap (black band with a gold star, black peak) set on
// the back, a little to the left and turned a little anticlockwise, looking off to the front-left.
// the coat in saturated yellow (the dark tones of the tower color turn khaki); cream trim
const COAT = { coat: "#efc75a", edge: "#b8952f", deep: "#d2a83c", deepEdge: "#8f701c", trim: "#fff2c8", legs: "#6a5018", board: "#5e5e5e", boardEdge: "#454545", gold: "#f3c54a" };
// a five-pointed star, one point toward the front (+x), inner radius 0.382 of the outer
function star5(cx, cy, r, fill) {
  const pts = [];
  for (let k = 0; k < 10; k++) {
    const a = (k * Math.PI) / 5, rr = k % 2 ? r * 0.382 : r;
    pts.push(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
  }
  return P(pts, fill);
}
TOWERS.commander = (lv) => {

// Lv3 스파이 플레인: a stout dark twin-engine monoplane with a camera window in the fuselage, tower-color wing tips
// and twin fins. Lv4 미사일 편대: a dark swept-wing jet with four missiles and twin exhausts.
// A half-transparent black edge round the whole aircraft, like the people's: the plane drawn again in black with a
// thick stroke, under itself, so only the outer half of the stroke shows (the exhaust glow left out)
function planeEdge(m) {
  const flat = m.replace(/<g id="exhaust"[^>]*>.*?<\/g>/g, "").replace(/ (fill|stroke|stroke-width|stroke-dasharray|stroke-linecap|opacity)="[^"]*"/g, "");
  return G("", flat.replace(/\/>/g, ' fill="#000000" stroke="#000000" stroke-width="2.4"/>'), ' opacity="0.5"');

// a blue end cap, two lit rings and a glass bulb with a glowing core and sparks; black straps over the shoulders
// and a headset. Lv2 고전압 코일: a bigger bulb, a coil on the handle and a battery pack on the back wired to the
// wand. From Lv3 a machine: a big round glass globe on a slightly octagonal base set on a cross, the slotted
// pedestal under the glass, the core and its ring inside; the person stands on the back of
// the globe with a controller. Lv3 전파 탐지: an antenna with a lit tip. Lv4 뇌전 폭풍: dark clamps gripping the
// globe, a dark cap with a white insulator on top and a lit ring floating over it, a pipe up to the person,
// lightning inside the glass and dark clothes.
const WAND = "#262b3a", WAND_CAP = "#3d6fd0", GLASS = "#ffffff";
// the person stands this far behind the globe's center (toward -y) on the machine
const TESLA_RIDER = 15;
function plasmaBulb(x, y, r) {
  let m = C(x, y, r + 2.6, "c!", ' opacity="0.22"') + C(x, y, r, GLASS, ' opacity="0.3"');
  m += C(x, y, r * 0.48, "c!") + C(x, y, r * 0.2, "#ffffff");
  for (const [a, b] of [[-0.5, 0.7], [2.2, 0.95], [3.9, 0.8]]) {
    const k = r * b;
    m += L(x + Math.cos(a) * r * 0.45, y + Math.sin(a) * r * 0.45, x + Math.cos(a + 0.35) * k * 0.75, y + Math.sin(a + 0.35) * k * 0.75, "c!", 0.5) +
      L(x + Math.cos(a + 0.35) * k * 0.75, y + Math.sin(a + 0.35) * k * 0.75, x + Math.cos(a) * k, y + Math.sin(a) * k, "c!", 0.5);
  }
  return m + C(x, y, r, "none", ' stroke="#ffffff" stroke-width="0.6" opacity="0.75"');
}

  for (const s of [-1, 1]) t += R(13.2, s * 6.2 - 1.9, 3.8, 3.8, "c+42", 0, ' stroke="c+12" stroke-width="0.8"');

// ---- 4.3.20: gauss as an industrial machine, laser as a railgun ---------------------------
// Square-cut shapes only (no rounded corners): corners are cut at 45° like the people tokens.

// rectangle x0..x1 × y0..y1 with its corners cut by k (front = +x side, back = -x side)
const cut = (x0, y0, x1, y1, kf, kb = kf) => [x0 + kb, y0, x1 - kf, y0, x1, y0 + kf, x1, y1 - kf, x1 - kf, y1, x0 + kb, y1, x0, y1 - kb, x0, y0 + kb];
// warning stripes (45°) laid on the band x0..x1 × y0..y1, clipped to it
function stripes(x0, y0, x1, y1, step, fill) {
  const h = y1 - y0;
  let out = "";
  for (let s = x0 - h; s < x1; s += step * 2) {
    let poly = [[s, y1], [s + step, y1], [s + step + h, y0], [s + h, y0]];
    for (const [ax, sign] of [[x0, 1], [x1, -1]]) {
      const res = [];
      for (let i = 0; i < poly.length; i++) {
        const p = poly[i], q = poly[(i + 1) % poly.length], ip = (p[0] - ax) * sign >= 0, iq = (q[0] - ax) * sign >= 0;
        if (ip) res.push(p);
        if (ip !== iq) res.push([ax, p[1] + ((q[1] - p[1]) * (ax - p[0])) / (q[0] - p[0])]);
      }
      poly = res;
      if (!poly.length) break;
    }
    if (poly.length >= 3) out += P(poly.flat(), fill);
  }
  return out;
}

// Gauss 3x3: an industrial shaker. A heavy plate (진동판) on a bolted skid; on it a
// housing with two exciter motors and the electromagnet between them that throws
// the pulse. Lv2 확장 진동판: the plate grows out over the skid with bolted wings.
// Lv3 산업용 진동로: the housing becomes a furnace with glowing vents and two stacks.
TOWERS.gauss = (lv) => {
  let b = pad(3, 3) + P(cut(-23, -23, 23, 23, 3), "floor");
  // anchor feet at the corners
  for (const sx of [-1, 1]) for (const sy of [-1, 1]) b += R(sx * 19.4 - 3.6, sy * 19.4 - 3.6, 7.2, 7.2, "steel") + R(sx * 19.4 - 1.5, sy * 19.4 - 1.5, 3, 3, "plate");
  // the plate (Lv2 wider, with bolted wings left and right)
  const pw = lv >= 2 ? 19.4 : 17;
  if (lv >= 2) for (const s of [-1, 1]) b += R(s * 21.6 - 2.4, -10, 4.8, 20, "c-46") + R(s * 21.6 - 1, -7.4, 2, 2, "c-14") + R(s * 21.6 - 1, 5.4, 2, 2, "c-14");
  b += R(-pw, -pw, pw * 2, pw * 2, "c-62") + R(-pw + 1.2, -pw + 1.2, pw * 2 - 2.4, pw * 2 - 2.4, "none", 0, ' stroke="c-42" stroke-width="1.2"');
  // warning stripes along the open ends of the plate
  for (const s of [-1, 1]) {
    const y0 = s < 0 ? -pw + 2.6 : pw - 6.4;
    b += R(-pw + 2.6, y0, pw * 2 - 5.2, 3.8, "c-76") + stripes(-pw + 2.6, y0, pw - 2.6, y0 + 3.8, 2.4, "c+30");
  }
  // spring mounts at the plate corners: the machine floats on them
  for (const sx of [-1, 1]) for (const sy of [-1, 1]) {
    const x = sx * (pw - 2.6), y = sy * (pw - 2.6);
    b += R(x - 3, y - 3, 6, 6, "steelHi");
    for (const k of [-1.6, 0, 1.6]) b += R(x - 3, y + k - 0.35, 6, 0.7, "steel");
  }
  if (lv < 3) {
    // housing
    b += P(cut(-14.4, -9.6, 14.4, 9.6, 2.6), "c-34") + P(cut(-12.8, -8, 12.8, 8, 1.8), "c-8");
    // exciter motors: finned bodies with a flywheel at the outer end
    for (const s of [-1, 1]) {
      const x0 = s < 0 ? -11.2 : 4.4;
      b += R(x0, -5.8, 6.8, 11.6, "c+18");
      for (let k = 1; k < 5; k++) b += R(x0 + (6.8 * k) / 5 - 0.4, -5.8, 0.8, 11.6, "c-14");
      b += R(s < 0 ? -13.6 : 11.6, -7, 2, 14, "steelHi");
    }
    // the electromagnet: a winding block with the pole face in the middle
    b += R(-3.2, -6.4, 6.4, 12.8, "c-54");
    for (const y of [-5, -2.6, 1.8, 4.2]) b += R(-2.4, y, 4.8, 0.8, "c-12");
    b += R(-1.8, -1.4, 3.6, 2.8, "c!");
  } else {
    // furnace: thick walls, glowing vents, stacks on one side
    b += P(cut(-15.6, -11, 15.6, 11, 3), "c-40") + P(cut(-13.8, -9.2, 13.8, 9.2, 2), "c-10") + P(cut(-10.4, -6.4, 7, 6.4, 1.4), "c+16");
    for (const y of [-4.4, -1.1, 2.2]) b += R(-8, y, 13, 2.2, "c-60") + R(-7.2, y + 0.5, 11.4, 1.2, "c!");
    b += R(8.4, -8.6, 7.4, 7.4, "steelHi") + R(9.9, -7.1, 4.4, 4.4, "hole") + R(9.2, 2, 5.6, 5.6, "steelHi") + R(10.4, 3.2, 3.2, 3.2, "hole");
    // heavy coolers on the plate wings
    for (const s of [-1, 1]) {
      b += R(s * 18 - 2.4, -9, 4.8, 18, "steel");
      for (let k = 1; k < 6; k++) b += R(s * 18 - 2.4, -9 + 3 * k - 0.4, 4.8, 0.8, "plate");
    }
  }
  return { base: b };
};

// Laser 3x3: a railgun turret. Capacitor bars across the back, an armoured body cut at
// 45°, two rails held by braces. Lv2 과출력 축전지: a second capacitor bar, Lv3 집속 렌즈:
// a lens at the muzzle, Lv4 죽음의 광선: long heavy rails, three braces and side armour,
// and the whole gun goes dark so only its lights carry the tower color.
TOWERS.laser = (lv) => {
  const base = pad(3, 3) + P(cut(-22, -22, 22, 22, 7), "floor") + P(cut(-20.4, -20.4, 20.4, 20.4, 6.4), "none", ' stroke="steel" stroke-width="1.4"');
  const dark = lv >= 4;
  // tones: [outline, body, top, brace edge, brace face, capacitor, slot/bore, rail, rail edge]
  const [kO, kB, kT, bO, bF, kC, kS, kR, kRh] = dark
    ? ["rubber", "hull", "steel", "rubber", "hull", "rubber", "hole", "plate", "steelHi"]
    : ["c-44", "c-16", "c+8", "c-30", "c+14", "c-52", "c-72", "steelHi", "gunHi"];
  let t = "";
  // capacitor bars laid across the back: terminals at both ends on a shared strap,
  // a lit charge strip down the middle of each
  const bars = lv >= 2 ? 2 : 1, bw = 4.6, x0 = -11.4 - bars * (bw + 0.6);
  for (const y of [-13, 11.2]) t += R(x0 - 0.4, y, bars * (bw + 0.6) + 0.6, 1.8, "steel");
  for (let k = 0; k < bars; k++) {
    const x = x0 + k * (bw + 0.6);
    t += R(x, -11.4, bw, 22.8, kC) + R(x + 1.3, -8.6, 2, 17.2, kS) + R(x + 1.7, -7.8, 1.2, 15.6, "c!");
  }
  // hull: the turret core, a squat block with its corners cut, a hatch on top
  const hx = dark ? 6 : 5;
  if (dark) for (const s of [-1, 1]) t += P(s < 0 ? [-9.4, -12, 2, -12, 0, -14.6, -7.4, -14.6] : [-9.4, 12, 2, 12, 0, 14.6, -7.4, 14.6], "hull");
  t += P(cut(-11, -12, hx, 12, 3.4, 2), kO) + P(cut(-9.4, -10.4, hx - 1.6, 10.4, 2.6, 1.4), kB) + P(cut(-7.4, -7, 0.6, 7, 1.4), kT);
  t += R(-6, -5.6, 3.6, 3.6, dark ? "rubber" : "c-30") + R(-5.2, -4.8, 2, 2, dark ? "c!" : "c+30");
  // rails, tips cut like blades, the bore between them
  const end = dark ? 34 : 28, rw = dark ? 4.2 : 3.6, gap = 2.2;
  t += R(hx - 1, -gap, end - hx - 2, gap * 2, kS);
  for (const s of [-1, 1]) {
    const yi = s * gap, yo = s * (gap + rw);
    t += P([hx - 1, yi, end, yi, end - rw * 1.2, yo, hx - 1, yo], kR) + P([hx - 1, s * (gap + 0.5), end - 1.4, s * (gap + 0.5), end - 2.4, s * (gap + 1.5), hx - 1, s * (gap + 1.5)], kRh);
  }
  // braces over the rails: a big one at the root, smaller ones further out;
  // on the dark gun each carries two small lights where it grips the rails
  const brace = (x, w, out) => {
    const h = gap + rw + out;
    let r = R(x, -h, w, h * 2, bO) + R(x + 0.7, -h + 0.8, w - 1.4, (h - 0.8) * 2, bF);
    if (dark) for (const s of [-1, 1]) r += R(x + w / 2 - 0.7, s * (h - 1.9) - 0.7, 1.4, 1.4, "c!");
    return r;
  };
  if (!dark) t += brace(hx + 1.6, 4, 1.6) + brace(hx + 11, 2.6, 0.8);
  else t += brace(hx + 1.6, 4.4, 2.2) + brace(hx + 9.4, 3.6, 1.8) + brace(hx + 16.4, 3, 1.4);
  // Lv3: a focusing lens at the muzzle, a frame wider than the rails around a lit pane;
  // before that the slug glows in the bore
  if (lv >= 3) {
    const lx = end - 9.4, ly = gap + rw + 2.4;
    t += P(cut(lx, -ly, lx + 5.4, ly, 1.4), kO) + P(cut(lx + 0.9, -ly + 0.9, lx + 4.5, ly - 0.9, 1), dark ? "hull" : "plate") + P(cut(lx + 1.5, -gap - 0.4, lx + 3.9, gap + 0.4, 0.6), "c!");
  } else t += R(end - 7, -1, 4, 2, "c!");
  return { base, turret: t };
};

// ---- 플래티넘 미니건 (6×3): a round turntable between two power units, a huge mounted
// rotary cannon worked by a platinum gunner in a wraparound visor and finned headgear.
// Lv2 GRIP: spade grips in both hands, a rangefinder, struts. Lv3 BFG469: thick barrels,
// a muzzle brake, twin drums, lit coils. Lv4 승천: bright trim, heat-sink wings, a halo
// (the rotating ring aura around the pad is drawn by the board).
TOWERS.platinum = (lv) => {
  // base: a long slab, a power unit at each end with a cable into the turntable, the round pad on top
  let base = R(-58.8, -14.6, 117.6, 29.2, "pad", 5);
  for (const s of [-1, 1]) {
    const x0 = s > 0 ? 35 : -58;
    base += R(x0 + (s > 0 ? -9 : 21), -3, 11, 6, "rubber", 1.5);
    base += R(x0, -12.4, 23, 24.8, "hull", 3) + R(x0 + 1.6, -10.8, 19.8, 21.6, "steel", 2);
    for (let k = 0; k < 4; k++) base += R(x0 + 3.6 + k * 4.4, -8.4, 2.2, 10.8, "rubber", 0.6);
    for (let k = 0; k < 3; k++) base += R(x0 + 4 + k * 5.8, 5.4, 3.4, 2.4, "c!", 0.6);
  }
  base += C(0, 0, 29.2, "pad") + C(0, 0, 27.4, "none", ' stroke="c" stroke-width="1.2"') + C(0, 0, 24.4, "floor");
  for (let k = 0; k < 12; k++) {
    const a = (k / 12) * Math.PI * 2;
    base += C(Math.cos(a) * 21.6, Math.sin(a) * 21.6, 1, "steel");
  }
  const big = lv >= 3, top = lv >= 4;
  // turret: the turntable ring, then the gun, then the gunner over it
  let t = C(0, 0, 16.4, "c-62") + C(0, 0, 14.2, "c-38") + C(0, 0, 10.6, "c-52");
  // Lv4: heat-sink wings swept back from the receiver, lit at the tips
  if (top) for (const s of [-1, 1]) {
    t += P([-1, s * 10, 12, s * 10, 4, s * 25, -12, s * 28.6], "c-50") + P([1, s * 11.4, 9.6, s * 11.4, 2.6, s * 22.4, -8.4, s * 25.2], "c+14");
    for (const k of [0, 1, 2]) t += L(2.4 - k * 3.6, s * (13 + k * 1.2), -2.6 - k * 3.6, s * (21.4 + k * 1.4), "c-30", 1.1);
    t += P([-12, s * 28.6, -8.4, s * 25.2, -6.2, s * 27.2], "c!");
  }
  // Lv3+: twin ammo drums on the receiver's sides, a lit core in each
  if (big) for (const s of [-1, 1]) {
    t += R(0, s * 11 - (s > 0 ? 0 : 3), 6, 3, "c-50");
    t += C(3, s * 17, 7.4, "c-62") + C(3, s * 17, 6, "c-24") + C(3, s * 17, 3.4, "c-55") + C(3, s * 17, 1.8, "c!");
  }
  // barrels: five visible tubes of the six, light steel so the aim reads; held by shroud bands
  const end = lv >= 4 ? 58 : big ? 55 : lv >= 2 ? 50 : 46, bw = big ? 2 : 1.6, ys = big ? [-5.2, -2.6, 0, 2.6, 5.2] : [-4.4, -2.2, 0, 2.2, 4.4];
  const hy = big ? 11.4 : 9.8;
  t += R(17, -(ys[4] + 1.8), end - 17, (ys[4] + 1.8) * 2, "c-62", 1.6);
  ys.forEach((y, k) => (t += L(18, y, end - 1, y, k % 2 ? "gun" : "gunHi", bw, ROUND)));
  const bands = big ? [24, 33, 42] : [26, end - 9];
  for (const x of bands) t += R(x, -(ys[4] + 2.4), 2.4, (ys[4] + 2.4) * 2, top ? "c+30" : "c-18", 0.8);
  if (big) for (const x of [28.6, 37.6]) t += R(x, -(ys[4] + 1.6), 1.6, (ys[4] + 1.6) * 2, "c!");
  // muzzle: a cap, or at Lv3+ a slotted brake wider than the barrels
  if (big) t += P(cut(end - 3, -9.6, end + 4.6, 9.6, 2.4), "c-55") + P(cut(end - 2, -8.4, end + 3.4, 8.4, 1.8), top ? "c+22" : "c-22") + R(end - 0.6, -6.4, 1.2, 4.2, "hole") + R(end - 0.6, 2.2, 1.2, 4.2, "hole") + R(end + 1.6, -6.4, 1.2, 4.2, "hole") + R(end + 1.6, 2.2, 1.2, 4.2, "hole");
  else t += R(end - 2, -(ys[4] + 1.6), 3, (ys[4] + 1.6) * 2, "steel", 1);
  // receiver: a long cut block, lighter top plate, a lit sight window; Lv4 gets lit seams
  t += P(cut(-5, -hy, 19, hy, 3.6), "c-44") + P(cut(-3.4, -hy + 1.6, 17.4, hy - 1.6, 2.6), top ? "c+30" : "c+4") + P(cut(1, -hy + 4.4, 13, hy - 4.4, 1.6), top ? "c+46" : "c+20");
  t += R(9, -1.6, 5, 3.2, "c-62", 0.6) + R(10, -0.8, 3, 1.6, "c!");
  if (top) for (const s of [-1, 1]) t += L(-2.6, s * (hy - 0.9), 16.6, s * (hy - 0.9), "c!", 0.7);
  // Lv1: one ammo box on the left with its belt; Lv2+: the rangefinder on top instead
  if (!big) t += R(-4, -20.4, 13, 8, "c-55", 1.4) + R(-2.6, -19, 3, 5.2, "c-30", 0.5) + L(4, -12.4, 5.4, -hy, "c+28", 1.8, ' stroke-dasharray="1.2 0.8"');
  if (lv >= 2) t += R(4, -hy - 4.4, 15, 3.6, "c-62", 1) + R(5, -hy - 3.6, 11, 2, "c-30", 0.6) + R(18.2, -hy - 4, 2, 2.8, "c!", 0.5);
  // Lv2+: struts from the turntable to the receiver, and spade grips back to the hands
  for (const s of [-1, 1]) {
    if (lv >= 2) t += L(-9, s * 12, 2, s * (hy - 0.4), "steel", 2.2, ROUND) + L(-5, s * 6.6, -8.6, s * 6.6, "steelHi", 2.4) + R(-10.6, s * 6.6 - 2.8, 2.6, 5.6, "rubber", 0.8);
    else t += L(-5, s * 6.6, -8.4, s * 6.6, "steel", 1.6);
  }
  // gunner: an eraser token behind the gun, both hands forward on the grips
  const gx = -24;
  let p = outline() + body({ head: "c+46", torso: "c-6", legs: "c-40" });
  // shoulder plates
  for (const s of [-1, 1]) p += P([-6, s * 13, 3, s * 13, 2, s * 15.4, -5, s * 15.4], "c+18");
  // finned headgear: a ridge over the crown and two fins swept back past the shoulders
  for (const s of [-1, 1]) p += P([12, s * 12.4, 5, s * 13, -2, s * 18.6, 2.6, s * 13.2], top ? "c+40" : "c+20") + P([10.4, s * 12.6, 5.4, s * 13.1, 0.6, s * 16.6], "c-36");
  p += R(-1, -1.6, 13, 3.2, top ? "c+50" : "c+24", 1) + R(0, -0.6, 11, 1.2, "c-30");
  // wraparound visor across the face: dark shield, a lit slit
  p += P([8.8, -13, 12.4, -11.4, 13.4, -6, 13.4, 6, 12.4, 11.4, 8.8, 13, 7.6, 9, 7.6, -9], "c-76") + P([10.6, -10.6, 12.2, -9.4, 12.2, 9.4, 10.6, 10.6, 9.8, 7.6, 9.8, -7.6], "c!");
  // hands on the grips
  for (const s of [-1, 1]) p += R(13.2, s * 6.6 - 2.1, 4.2, 4.2, "c+46", 0, ' stroke="c+12" stroke-width="0.8"');
  // Lv4: the halo floating over the head, a soft glow under a bright core
  if (top) p += C(8.5, 0, 15.6, "none", ' stroke="c!" stroke-width="5" opacity="0.28"') + C(8.5, 0, 15.6, "none", ' stroke="c!" stroke-width="1.9"') + C(8.5, 0, 15.6, "none", ' stroke="#ffffff" stroke-width="0.6" opacity="0.85"');
  t += G("", p, ` transform="translate(${gx} 0)"`);
  return { base, turret: t };
};

// ---- the spawner's car ---------------------------------------------------------
// Lv1 an open jeep: square body with its front corners cut, a flat hood with a grille and two lit
// headlights, a bumper wider than the body, the windshield frame and no roof; one seat in the middle
// with one of our people at the wheel (helmet, our visor). Lv2 a spiked plate on the bumper, Lv3 an
// explosive crate with warning stripes in the back and a bundle of plastic explosive strapped outside
// each side, between the wheels. Lv4 an armored car with six wheels
// and a machine-gun turret (turns to its target).
// the jeep's driver: a person token holding the steering wheel in front of the face, drawn at 0.52
function driver() {
  let p = outline();
  for (const s of [-1, 1]) p += R(1, s > 0 ? 12.4 : -15.6, 13.4, 3.2, "c-8"); // arms reaching forward past the head
  p += R(15.2, -13.6, 1.8, 27.2, "rubber"); // steering wheel
  p += body() + militaryMark(-1.2, 0, 1, "c-8", "c-36");
  p += P([3, -13.8, 10, -13.8, 11.4, -12.4, 11.4, -10.4, 5.6, -10.4, 5.6, 10.4, 11.4, 10.4, 11.4, 12.4, 10, 13.8, 3, 13.8], "c-52") + R(3.8, -13.8, 0.8, 27.6, "c-64"); // helmet
  p += goggles();
  for (const s of [-1, 1]) p += R(13.4, s * 12 - 1.9, 3.8, 3.8, "c+42", 0, ' stroke="c+12" stroke-width="0.8"'); // hands on the wheel
  return p;
}
// periscope and sight lenses on the armored car and the tank glow a soft yellow; the tank's main gun
// is a little darker than gunHi
const LENS = "#ffdf6b", BARREL = "#b2b2b2";
function carUnit(lv, crewed = true) {
  let p = "";
  if (lv < 4) {
    for (const x of [-13, 13]) for (const s of [-1, 1]) {
      p += R(x - 5, s > 0 ? 9.4 : -15, 10, 5.6, "rubber");
      for (const tx of [-3.6, -1.2, 1.2, 3.6]) p += R(x + tx - 0.5, s > 0 ? 12.2 : -14.4, 1, 2.2, "hull"); // tread
    }
    p += R(-26.6, -4.8, 4.6, 9.6, "rubber"); // spare tire on the tailgate, edge on
    for (const y of [-3, -1, 1, 3]) p += R(-26.6, y - 0.4, 1.6, 0.8, "hull");
    p += P(cut(-22, -11.4, 21, 11.4, 3, 1.6), "c-30"); // body
    p += R(-20.2, -9.6, 22.2, 19.2, "c-56"); // open top: the floor shows
    p += R(2, -9.6, 1.8, 19.2, "c-44"); // dashboard
    p += R(3.8, -11.8, 1.8, 23.6, "c-62"); // windshield frame
    p += P(cut(5.6, -11.4, 21, 11.4, 3, 0), "c"); // hood
    p += L(8.4, -6.4, 17.4, -6.4, "c-16", 0.8) + L(8.4, 6.4, 17.4, 6.4, "c-16", 0.8);
    p += R(19.2, -4.6, 1.8, 9.2, "c-20"); // grille, four slots
    for (const y of [-3.3, -1.1, 1.1, 3.3]) p += R(19.2, y - 0.6, 1.8, 1.2, "c-70");
    p += R(21, -13, 2.4, 26, "c-66"); // bumper
    for (const s of [-1, 1]) p += R(18.4, s * 7.2 - 2.4, 4.4, 4.8, "#fff1b8", 0, ' opacity="0.28"') + R(19.2, s * 7.2 - 1.3, 1.8, 2.6, "#fff1b8"); // headlights
    if (lv >= 2) {
      p += R(22, -12.4, 2.6, 24.8, "steel");
      for (const y of [-9, -3, 3, 9]) p += P([24.6, y - 2.2, 29.4, y, 24.6, y + 2.2], "gunHi");
    }
    if (lv >= 3) {
      p += R(-22, -9.6, 8.8, 19.2, "c-55"); // explosive crate with warning stripes
      for (let k = 0; k < 3; k++) p += R(-21.2 + k * 3.2, -8.2, 1.6, 16.4, "c+35");
      for (const s of [-1, 1]) { // two blocks of plastic explosive bound by a strap round the middle
        const y0 = s > 0 ? 10.6 : -16.2;
        p += P(cut(-7.6, y0, 7.6, y0 + 5.6, 1.4), "c+16") + L(-6.8, y0 + 2.8, 6.8, y0 + 2.8, "c-24", 0.6);
        p += R(-1.3, y0 - 0.5, 2.6, 6.6, "c-66") + R(-0.6, y0 + 1.9, 1.2, 1.8, "steel");
      }
    }
    p += P(cut(-14, -6, -2, 6, 0, 1), "c-70"); // the one seat, in the middle
    p += crewed ? G("", driver(), ' transform="translate(-5.5 0) scale(0.52)"') : R(2.4, -3.4, 0.9, 6.8, "rubber"); // parked: no driver, the steering wheel shows
    return p;
  }
  if (lv >= 5) {
    // Lv5 tank: tracks, sloped hull with spare track links, lights and the driver's hatch on the nose,
    // engine grille and exhausts at the back, a tow cable on the left; a wide turret with a stowage
    // basket, smoke launchers, the commander's cupola, a hatch, an antenna and a long gun with a
    // bore evacuator and a slotted brake
    let ta = "", tb = "";
    for (const s of [-1, 1]) {
      const y0 = s > 0 ? 10.6 : -17.8;
      p += P(cut(-27, y0, 27, y0 + 7.2, 2.4), "rubber");
      for (let x = -23; x <= 23.01; x += 4.6) ta += L(x, y0 + 1, x, y0 + 6.2, "steel", 1.2);
      for (let x = -20.7; x <= 20.71; x += 4.6) tb += L(x, y0 + 1, x, y0 + 6.2, "steel", 1.2);
    }
    p += G("treadA", ta) + G("treadB", tb, ' data-off="1"');
    p += P([-25, -11, 19, -11, 26, -5.4, 26, 5.4, 19, 11, -25, 11], "c-30");
    p += P([-21, -8, 15, -8, 20.4, -3.6, 20.4, 3.6, 15, 8, -21, 8], "c-12");
    for (const y of [-2.6, 0, 2.6]) p += R(21.6, y - 1.1, 2.8, 2.2, "rubber") + L(21.6, y, 24.4, y, "steel", 0.5); // spare track links
    for (const s of [-1, 1]) {
      p += R(25.6, s * 4.6 - 0.8, 2, 1.6, "steel"); // tow hook
      p += R(19.4, s * 7.6 - 1.4, 2.4, 2.8, "hull") + R(19.8, s * 7.6 - 1, 1.6, 2, "#fff1b8"); // headlight in its guard
      p += R(-26, s * 7.6 - 1.4, 2.4, 2.8, "hull") + R(-26, s * 7.6 - 0.6, 1, 1.2, "hole"); // exhaust
    }
    p += P(cut(12, -7, 17, -2.6, 1), "c-24") + R(16.4, -6.2, 0.8, 1.2, LENS) + R(16.4, -4.4, 0.8, 1.2, LENS); // driver's hatch, periscopes
    p += R(-22.4, -6.6, 7.4, 13.2, "c-30"); // engine grille
    for (const x of [-21.6, -19.6, -17.6]) p += R(x, -5.8, 1, 11.6, "c-50");
    p += L(-19, -9.6, 7, -9.6, "steel", 0.9) + R(-20.4, -10.4, 1.6, 1.6, "steel") + R(6.6, -10.4, 1.6, 1.6, "steel"); // tow cable
    // side machine gun: a round sponson on the right edge of the hull, its own small turret (mg)
    p += C(12, 9.6, 4.6, "c-40");
    p += G("mg", C(12, 9.6, 3.4, "c-12") + R(12, 8.8, 10.4, 1.6, "hull") +
      R(15.6, 8.3, 5.6, 2.6, "steel") + R(16.6, 9.2, 0.8, 0.8, "hole") + R(18.4, 9.2, 0.8, 0.8, "hole") + // barrel jacket
      R(14.4, 6.6, 1.4, 6, "c-30") + R(22.4, 7.9, 2.8, 3.4, "rubber") + // shield, flash hider
      R(9.8, 8.8, 1.6, 1.6, "hull") + R(10.8, 9.1, 0.6, 1, LENS), ' data-pivot="12,9.6"'); // sight
    let t = C(-2, 0, 9.4, "c-40") + P(cut(-14.4, -6.4, -10.6, 6.4, 0, 1), "c-50"); // ring, stowage basket
    for (const y of [-3.6, 0, 3.6]) t += R(-14, y - 0.4, 3.4, 0.8, "c-30");
    t += P([-11, -7.4, 4, -8.4, 9.6, -4.4, 9.6, 4.4, 4, 8.4, -11, 7.4], "c") + P([-9, -5.6, 3, -6.4, 7.4, -3.4, 7.4, 3.4, 3, 6.4, -9, 5.6], "c+8");
    for (const s of [-1, 1]) for (let k = 0; k < 3; k++) t += R(-0.8 + k * 1.8, s > 0 ? 7.8 : -9.4, 1.4, 1.6, "hull"); // smoke launchers
    t += R(7.6, -3.4, 4, 6.8, "c-40"); // mantlet
    t += R(11.6, -1.5, 20.4, 3, BARREL) + R(19, -2.2, 5, 4.4, "gun") + R(32, -2.5, 4, 5, "steel") + R(33, -2.5, 0.6, 5, "hole") + R(34.4, -2.5, 0.6, 5, "hole");
    t += C(-5.4, -3.6, 3.4, "c-30") + C(-5.4, -3.6, 2.4, "c-8") + R(-2.8, -4.4, 0.8, 1.6, LENS); // commander's cupola
    t += P(cut(-8.4, 1.4, -3.6, 5.6, 0.8), "c-20") + R(-8.4, 2.6, 0.6, 1.8, "steel"); // hatch
    t += R(-10.8, 5.8, 1.6, 1.6, "steel") + L(-10, 6.6, -18, 10.4, "gun", 0.6) + C(-18, 10.4, 0.7, "steelHi"); // antenna
    p += G("turret", t, ' data-pivot="-2,0"');
    return p;
  }
  // Lv4 armored car: six wheels, lights in guards on the nose, tow hooks, the driver's hatch, an
  // engine grille, a spare wheel on the back and an antenna; the turret has a gun shield, a
  // hatch with a periscope and a machine gun with a cooling jacket
  for (const x of [-16, 0, 16]) for (const s of [-1, 1]) {
    p += R(x - 4.6, s > 0 ? 11 : -16.6, 9.2, 5.6, "rubber");
    for (const tx of [-3.3, -1.1, 1.1, 3.3]) p += R(x + tx - 0.5, s > 0 ? 13.6 : -15.8, 1, 2.2, "hull"); // tread
  }
  p += R(-27.6, -4.4, 4.2, 8.8, "rubber"); // spare wheel, edge on
  for (const y of [-2.7, -0.9, 0.9, 2.7]) p += R(-27.6, y - 0.4, 1.4, 0.8, "hull");
  p += P([-24, -12, 18, -12, 26, -5, 26, 5, 18, 12, -24, 12], "c-30");
  p += P([-20, -9, 15, -9, 21, -4, 21, 4, 15, 9, -20, 9], "c-12");
  p += R(17, -6, 2, 4, "hole") + R(17, 2, 2, 4, "hole"); // vision slits
  for (const s of [-1, 1]) {
    p += R(25.4, s * 3.4 - 0.8, 2, 1.6, "steel"); // tow hook
    p += R(20.8, s * 7.4 - 1.4, 2.4, 2.8, "hull") + R(21.2, s * 7.4 - 1, 1.6, 2, "#fff1b8"); // headlight in its guard
  }
  for (const [x, y] of [[-20, -9], [-20, 9], [-4, -9], [-4, 9], [12, -9], [12, 9]]) p += C(x, y, 0.9, "c+20");
  p += P(cut(7.6, -7.2, 13.4, -2.4, 1), "c-24") + R(8, -6.6, 0.6, 3.6, "steel"); // driver's hatch
  for (const x of [-19, -17, -15]) p += L(x, -6.4, x, 6.4, "c-40", 1); // engine grille
  p += R(-22, -10.8, 1.6, 1.6, "steel") + L(-21.2, -10, -29, -12.6, "gun", 0.6) + C(-29, -12.6, 0.7, "steelHi"); // antenna
  let t = C(-3, 0, 7.6, "c-40") + C(-3, 0, 6, "c");
  t += P(cut(-8, -4.6, -3.4, -0.4, 0.8), "c-20") + R(-8, -3.4, 0.6, 1.8, "steel") + R(-2.6, -4, 1.4, 2.4, "hull") + R(-1.6, -3.6, 0.6, 1.6, LENS); // hatch, periscope
  t += P([2.4, -4.6, 4.6, -4.6, 5.8, -3.4, 5.8, 3.4, 4.6, 4.6, 2.4, 4.6], "c-30"); // gun shield
  t += R(3.4, -1.9, 6, 3.8, "steel") + R(9.4, -1.5, 7, 3, "steelHi"); // receiver, cooling jacket
  for (const x of [10.6, 12.6, 14.6]) t += R(x, -0.4, 0.8, 0.8, "hole");
  t += R(16.4, -0.8, 4, 1.6, "gunHi") + R(20.2, -1.2, 1.8, 2.4, "gun"); // barrel, flash hider
  p += G("turret", t, ' data-pivot="-3,0"');
  return p;
}

// ---- 해골 공장's skeleton ------------------------------------------------------------
// A person token in bone: a skull for a head (blurred like the smiley), ribs over a dark
// chest sweeping back from the spine, longest and brightest in front, and a pelvis band
// for legs. Empty hands at the sides swap front and back with every step.
function skeletonUnit() {
  let p = band(-13, "c-30") + band(TX, "c-55");
  p += R(-7, -1.3, 11.2, 2.6, "c-12"); // spine
  for (const [x, w, t, tone] of [[2.4, 11, 2, "c"], [-0.8, 10.2, 1.8, "c-8"], [-4, 8.8, 1.6, "c-18"]]) {
    const sw = 1.8; // sweep toward the back at the sides
    p += P2([x + t / 2, 1.3, x - sw + t / 2, w, x - sw - t / 2, w, x - t / 2, 1.3], tone);
  }
  p += band(HX, "c") + G("", `<image href="skull" x="-11" y="-4.3" width="22" height="8.6"/>`, ` transform="translate(8.5 0) rotate(-90)"`);
  const hand = (x, side) => R(x, side > 0 ? 11.8 : -15.6, 3.8, 3.8, "c", 0, ' stroke="c-30" stroke-width="0.8"');
  p += G("handA", hand(3, 1) + hand(-5, -1)) + G("handB", hand(-5, 1) + hand(3, -1), ' data-off="1"');
  return p;
}
// The roster's last step, the skeleton knight: the same token in ghost teal under a steel
// breastplate and shoulder plates, the skeleton's face drawn bright, and a ghost sword in the right
// hand that turns to its target and swings through each cut.
function knightUnit() {
  let p = band(-13, "c-45") + band(TX, "c-62");

  p += P([-6.6, -10.4, 3.6, -11.4, 3.6, 11.4, -6.6, 10.4], "c-58") + R(-6.6, -1.2, 10.2, 2.4, "c-30") + L(-4.8, -8.2, -4.8, 8.2, "c!", 0.9);
  for (const s of [-1, 1]) p += R(-4.8, s > 0 ? 9.4 : -14.6, 7.8, 5.2, "c-30", 1.6) + R(-3.6, s > 0 ? 10.6 : -13.4, 5.4, 2.8, "c-58", 1); // shoulder plates
  p += band(HX, "c") + G("", `<image href="skullB" x="-11" y="-4.3" width="22" height="8.6"/>`, ` transform="translate(8.5 0) rotate(-90)"`);
  const y = GY;
  const sword = R(-3.4, y - 0.9, 6.6, 1.8, "steel", 0.6) + R(2.6, y - 3.4, 1.8, 6.8, "steelHi", 0.6) +
    P([4.4, y - 1.7, 23, y - 1.2, 26.4, y, 23, y + 1.2, 4.4, y + 1.7], "c!") + L(5.2, y, 22.6, y, "c+75", 0.7);
  p += R(-1.4, -15.6, 3.8, 3.8, "c+42", 0, ' stroke="c+12" stroke-width="0.8"'); // empty left hand
  p += G("turret", sword + R(-1.6, 11.8, 3.8, 3.8, "c+42", 0, ' stroke="c+12" stroke-width="0.8"'));
  return p;
}

// ---- ICU 전선 (4.4): a silver-white forward base and its units ----------------------------------
// Everything is square-cut (45° corners), light silver steps of the tower color, and only the lights
// glow (c!). Units face +x like the other units; the base's gate is on the top edge like the garages.

// Chaos Trooper: an armored eraser token with a visored helmet; minigun in the right hand, grenade
// launcher in the left. Mk II (Lv.2) gets shoulder plates and a wide lit visor (it sees hidden
// enemies); from Lv.3 the armor turns dark.
function icuTrooper(lv) {
  const dark = lv >= 3, mk2 = lv >= 2, y = GY;
  const legs = dark ? "c-70" : "c-42", torso = dark ? "c-58" : "c-16", head = dark ? "c-40" : "c+22";
  // weapons sit outside the token and under it
  let p = outline() + R(-3.4, y - 2.6, 9.4, 5.2, "steelHi") + R(-1.6, y - 3.4, 3.6, 6.8, "steel");
  for (const d of [-1.4, 0, 1.4]) p += L(6, y + d, 19.6, y + d, "gunHi", 1);
  p += R(15.4, y - 2.4, 1.6, 4.8, "gun");
  p += R(-2.6, -y - 2.2, 7.4, 4.4, "steel") + R(4.8, -y - 2.9, 9.4, 5.8, "plate") + R(14.2, -y - 2.1, 1.4, 4.2, "hole");
  p += band(-13, legs) + band(TX, torso) + band(HX, head);
  // chest plate and belt
  p += P(cut(-5.6, -9.4, 2.4, 9.4, 1.8), dark ? "c-44" : "c+4") + R(-7.4, -11.6, 1.2, 23.2, dark ? "c-78" : "c-46");
  // helmet: a raised crest and the visor across the front
  p += R(4.8, -1, 3.6, 2, dark ? "c-28" : "c+46");
  p += P([8.4, -11.6, 10.6, -11.6, 12.4, -9.8, 12.4, 9.8, 10.6, 11.6, 8.4, 11.6], "c-76");
  p += mk2 ? R(9.6, -9, 1.8, 18, "c!") : R(9.8, -5.6, 1.2, 11.2, "c!");
  if (mk2) for (const s of [-1, 1]) p += P(cut(-4.8, s > 0 ? 9.8 : -14.6, 3.4, s > 0 ? 14.6 : -9.8, 1.4), dark ? "c-64" : "c-34");
  const hand = (x, s) => R(x, s > 0 ? 11.8 : -15.6, 3.8, 3.8, dark ? "c-30" : "c+22", 0, ' stroke="c-50" stroke-width="0.8"');
  return p + hand(4.6, 1) + hand(2.6, -1);
}

// Rocket truck: a six-wheeled carrier with a four-tube launcher that turns to its target.
// Mk II (Lv.3+): an armored wedge cab, side skirts, a radar panel and a heavier launcher.
function icuTruck(lv) {
  const mk2 = lv >= 3;
  let p = "";
  const axles = mk2 ? [-17, -6.4, 4.2, 15.6] : [-15, -3.4, 15];
  for (const x of axles) for (const s of [-1, 1]) p += R(x - 4.2, s > 0 ? 10.4 : -16, 8.4, 5.6, "rubber");
  if (!mk2) {
    p += R(-22, -11.6, 46, 23.2, "c-46");
    p += P(cut(11.6, -10.6, 24.4, 10.6, 3.6, 0.8), "c-10") + R(19.4, -8.4, 2.4, 16.8, "c-74") + R(13.4, -9, 4.8, 18, "c+16");
    p += R(-21, -10.6, 31, 21.2, "c-32");
    for (const yy of [-7.4, 7.4]) p += R(-19.6, yy - 0.6, 28, 1.2, "c-52");
  } else {
    p += P(cut(-25, -12.6, 28, 12.6, 2, 1), "c-50");
    for (const s of [-1, 1]) {
      const y0 = s > 0 ? 12.6 : -16.6;
      p += P(cut(-23, y0, 14, y0 + 4, 1.2), "c-30");
      for (const x of [-18, -4, 9]) p += R(x - 0.8, y0 + 1.2, 1.6, 1.6, "c+20");
    }
    p += P([12, -11.6, 22, -11.6, 30, -4, 30, 4, 22, 11.6, 12, 11.6], "c-14") + P([22.6, -8.4, 27.6, -3.4, 27.6, 3.4, 22.6, 8.4], "c-76") + R(13.6, -10, 5.6, 20, "c+18");
    p += R(14.6, -4, 3.6, 8, "steel") + R(15.4, -3.2, 2, 6.4, "c!"); // radar panel on the cab roof
    p += R(-24, -11.4, 34.6, 22.8, "c-34");
  }
  // launcher: a box of four tubes seen from above, a lit cap on each missile
  const w = mk2 ? 22 : 18, h = mk2 ? 19.6 : 16.8, x0 = -5 - w / 2, cell = mk2 ? 7.4 : 6.2, gap = mk2 ? 1.8 : 1.4;
  let t = P(cut(x0, -h / 2, x0 + w, h / 2, 2), "c-60") + P(cut(x0 + 1.2, -h / 2 + 1.2, x0 + w - 1.2, h / 2 - 1.2, 1.4), "c-6");
  for (const sx of [-1, 1]) for (const sy of [-1, 1]) {
    const cx = -5 + sx * (cell / 2 + gap / 2), cy = sy * (cell / 2 + gap / 2);
    t += R(cx - cell / 2, cy - cell / 2, cell, cell, "c-76") + P([cx - cell * .28, cy - cell * .28, cx + cell * .12, cy - cell * .28, cx + cell * .3, cy, cx + cell * .12, cy + cell * .28, cx - cell * .28, cy + cell * .28], "c+30") + R(cx + cell * .02, cy - .7, 1.4, 1.4, "c!");
  }
  if (mk2) t += R(x0 + w - 1, -h / 2 - 1.4, 3.2, h + 2.8, "c-40");
  // a neon outline around the whole truck so it reads on the dark road
  p += P(mk2 ? cut(-26.4, -17.4, 31.4, 17.4, 3) : cut(-23.4, -17, 25.8, 17, 3), "none", NEON(.9));
  return p + G("turret", t, ' data-pivot="-5,0"');
}

// Striker (after the reference): a dark, faceted heavy tank. Wide tracks with pale pads on the
// outer edge, a wedge glacis, louvers on the rear deck, a row of lights along each side skirt,
// a faceted turret with an octagonal hatch, three slats on its flank and a banded barrel.
// Dark steps of the tower color only; the lights and the outline are the neon.
const NEON = (w) => ` stroke="c!" stroke-width="${w}" stroke-linejoin="miter"`;
function icuTank() {
  let hull = "", a = "", b = "";
  for (const s of [-1, 1]) {
    const y0 = s > 0 ? 13 : -25, edge = s > 0 ? y0 + 9 : y0 + .4;
    hull += P(cut(-29, y0, 29, y0 + 12, 3.4), "c-86");
    for (let x = -22; x <= 22.01; x += 8.8) a += P(cut(x - 3, edge, x + 3, edge + 2.6, 1), "c-46");
    for (let x = -17.6; x <= 17.61; x += 8.8) b += P(cut(x - 3, edge, x + 3, edge + 2.6, 1), "c-46");
  }
  let low = P(cut(-28, -15.4, 27, 15.4, 9, 3), "c-78", NEON(.7));
  low += P([12, -13.6, 26.4, -6, 26.4, 6, 12, 13.6], "c-68"); // glacis
  for (let k = 0; k < 6; k++) low += R(-25 + k * 2.6, -7.6, 1.2, 15.2, "c-46"); // rear louvers
  for (const s of [-1, 1]) {
    low += P(cut(-22, s > 0 ? 10.6 : -14.2, 10, s > 0 ? 14.2 : -10.6, 1), "c-72");
    for (const x of [-18.6, -13, -7.4, -1.8, 3.8]) low += R(x, s * 12.4 - .6, 2.4, 1.2, "c!");
  }
  // turret, turning about (-4, 0): faceted, an octagonal hatch, three slats on the front flank, a banded barrel
  let t = R(6, -2.2, 34, 4.4, "c-54", 0, NEON(.6));
  for (const x of [14, 20, 26]) t += R(x, -2.7, 2.2, 5.4, "c-86");
  t += R(37, -2.8, 4, 5.6, "c-62", 0, NEON(.5));
  t += P([-19, -8.4, -13.4, -12.4, 3, -12.4, 9, -6.6, 9, 6.6, 3, 12.4, -13.4, 12.4, -19, 8.4], "c-70", NEON(.7));
  t += P([-15.4, -6.6, -11.4, -9.6, 1.4, -9.6, 5.8, -5.2, 5.8, 5.2, 1.4, 9.6, -11.4, 9.6, -15.4, 6.6], "c-62");
  for (const x of [-.6, 1.8, 4.2]) t += P([x, -12, x + 1.6, -12, x + 3, -9.4, x + 1.4, -9.4], "c-88");
  t += P([-11.4, -3, -9.2, -5.2, -5.6, -5.2, -3.4, -3, -3.4, 3, -5.6, 5.2, -9.2, 5.2, -11.4, 3], "c-44") + L(-9.2, 5.2, -5.6, 5.2, "c!", .9);
  t += R(-16.6, 7.4, 6, 1, "c!") + R(-1, 9, 5, 1, "c!");
  // a neon outline around tracks and hull: the dark tank has to read on the dark road
  low += P(cut(-30, -26, 30, 26, 4), "none", NEON(1.1));
  return hull + G("treadA", a) + G("treadB", b, ' data-off="1"') + low + G("turret", t, ' data-pivot="-4,0"');
}

// 리콘 정비선 (after Bliss of Finality, seen from above), built the way this game builds things:
// a white body, brighter raised plates on it, black seams on the plates and neon running between
// the black seams. A wide stern with three thrusters and two pairs of swept wings; the hull
// narrows into a long spine with prongs at the nose. Its weapons are turrets that turn to what
// they shoot: two heavy machine guns on the waist, the flash cannon on the stern, the railgun on
// the spine (groups mgL, mgR, flash, rail; o gives their angles relative to the hull).
// About 130 units long; the board draws it 6.8× (about 44 cells).
function icuShip() {
  const N = NEON(.7);
  let p = "";
  // black seam pair with a neon line between them, along a straight run
  const seam = (x1, y1, x2, y2, gap, w = .8) => {
    const dx = x2 - x1, dy = y2 - y1, l = Math.hypot(dx, dy), nx = -dy / l * gap, ny = dx / l * gap;
    return L(x1 + nx, y1 + ny, x2 + nx, y2 + ny, "c-86", w) + L(x1 - nx, y1 - ny, x2 - nx, y2 - ny, "c-86", w) + L(x1, y1, x2, y2, "c!", w * .8);
  };
  for (const s of [-1, 1]) {
    const W = (pts) => pts.map((v, i) => (i % 2 ? v * s : v)), y = (v) => v * s;
    // big rear wings: body, a raised plate, a black panel split by a neon line, the lit tip
    p += P(W([-32.6, 14, -42.6, 39, -51.4, 39, -47.6, 14]), "c+12", N);
    p += P(W([-35.4, 16, -43.4, 36, -49, 36, -45.8, 16]), "c+36");
    p += P(W([-38.6, 20.4, -42.8, 31, -46.2, 31, -44.6, 20.4]), "c-86") + L(-41.6, y(20.4), -44.5, y(31), "c!", .8);
    p += R(-50.8, s > 0 ? 36.8 : -38.4, 8, 1.6, "c!") + L(-50.4, y(35.4), -43, y(35.4), "c-86", .7);
    // small forward wings
    p += P(W([-19.4, 14, -23.6, 26, -29.6, 26, -28.6, 14]), "c+12", N);
    p += P(W([-21.4, 15.6, -24.4, 23.8, -28.2, 23.8, -27.4, 15.6]), "c+36");
    p += P(W([-23, 17.4, -24.8, 22, -26.8, 22, -26.2, 17.4]), "c-86") + R(-29, s > 0 ? 24.6 : -26, 5.6, 1.4, "c!");
    // engine housings at the stern corners
    p += P(W([-64, 7, -52, 7, -50, 9, -50, 16, -64, 16]), "c+12", N) + P(W([-62.4, 8.6, -53, 8.6, -51.6, 10, -51.6, 14.4, -62.4, 14.4]), "c+36");
    p += L(-60, y(11.5), -54, y(11.5), "c-86", .8) + R(-66, s > 0 ? 9 : -15, 2, 6, "c!");
  }
  // stern block: two raised plates with seams, a black channel with a neon core between them
  p += P(cut(-62, -15.6, -26, 15.6, 2, 3), "c+12", N);
  for (const s of [-1, 1]) {
    p += P(cut(-59.4, s > 0 ? 4 : -13.4, -29, s > 0 ? 13.4 : -4, 1.6), "c+36");
    for (const x of [-52, -43, -34]) p += L(x, s * 5, x, s * 12.4, "c-86", .8);
    for (const x of [-57.6, -55.2]) p += R(x, s > 0 ? 6 : -11.4, 1.2, 5.4, "c-86");
  }
  p += R(-61, -2.8, 32, 5.6, "c-86") + R(-59, -.5, 28, 1, "c!");
  for (const y of [-9, 0, 9]) p += R(-64.4, y - 2, 2.4, 4, "c-60") + R(-65.6, y - 1.4, 1.2, 2.8, "c!"); // thrusters
  // waist: narrows into the spine; seams follow both slopes
  p += P([-27, -15.6, -14, -15.6, -3.6, -5, -3.6, 5, -14, 15.6, -27, 15.6], "c+12", N) + P([-25, -13.4, -15, -13.4, -6.6, -5, -6.6, 5, -15, 13.4, -25, 13.4], "c+36");
  for (const s of [-1, 1]) p += seam(-14.6, s * 11.6, -8, s * 5, 1);
  p += R(-24.6, -.4, 14, .8, "c-86");
  // spine: a raised plate, the long black channel with its neon core, a black keel at the nose
  p += P([-8, -4.6, 54, -4.6, 57, -1.8, 57, 2.2, 54, 5, -8, 5], "c+12", N) + P(cut(-5.6, -3.4, 52, 3.6, 1.6), "c+36");
  p += seam(-4, .1, 50, .1, 1.5, .9);
  for (const x of [8, 26, 44]) p += L(x, -3.4, x, -2.2, "c-86", .8) + L(x, 2.4, x, 3.6, "c-86", .8);
  for (const [yy, len] of [[-2.4, 12], [-.8, 16.5], [.8, 16.5], [2.4, 12]]) p += R(57, yy - .3, len, .6, "c+40") + R(57 + len - 1.6, yy - .3, 1.6, .6, "c!");
  // turrets: dark so the weapons stand out on the white hull, a neon rim on each
  const mg = (side) => G(side > 0 ? "mgR" : "mgL", P(cut(-3.4, -3, 3.4, 3, 1.2), "c-80", NEON(.5)) + R(2.4, -1.6, 9, .9, "c-86") + R(2.4, .7, 9, .9, "c-86") + R(10.4, -.5, 1.2, 1, "c!"),

"navigation.js":function(require,exports){
// Guard entries in this page's own history turn browser Back into an app action.
// Explicit exit releases the guard. Reloads reuse it instead of adding entries.
const MARK='grid-defense-back-v1';
function installBackNavigation(onBack,win=window,hold=()=>true){
 const history=win.history,DEPTH=4;let leaving=false,dropping=0,want=false,stale=false,pending=0;
 const state=()=>history.state?.[MARK];
 // guard entries are numbered 1..DEPTH above the page's own entry (0); older saves' single guard counts as 1
 const depth=()=>{const e=state();return !e?-1:e.position==='guard'?(e.depth??1):0;};
 let at=-1;
 const active=()=>win.navigator?.userActivation?.isActive??true;
 function base(){let entry=state();if(!entry){entry={position:'base',hasPrevious:history.length>1};history.replaceState({...history.state,[MARK]:entry},'',win.location.href);}return entry;}
 // Chrome's Back button skips every entry of a page that added entries without a tap or key press made
 // after its last Back (one from before the Back no longer counts). So after a Back the used guards
 // come back only with the next tap; until then the ones left above the page catch further Backs.
 function fill(){if(leaving||!hold())return;const entry=base();let d=Math.max(0,depth());
  while(d<DEPTH){d++;history.pushState({...history.state,[MARK]:{position:'guard',depth:d,hasPrevious:entry.hasPrevious}},'',win.location.href);}
  at=d;want=false;}
 function drop(){const d=depth();if(d>0){dropping=Date.now();history.go(-d);}}
 // after every screen or dialog change: arm the guards when Back should be caught, drop them when not
 function sync(){if(pending)return;
  pending=setTimeout(()=>{pending=0;if(leaving||dropping)return;
   try{if(!hold())drop();else if(depth()<DEPTH){if(!stale&&active())fill();else want=true;}}catch{}},0);}
 function pop(){if(leaving)return;const d=depth();
  if(dropping&&Date.now()-dropping<800){dropping=0;at=d;return;}
  dropping=0;const back=d<at;at=d;if(!back)return;
  want=stale=true;onBack();}
 // the first tap or key after a Back puts the used guards back
 const refill=()=>{if(!active())return;stale=false;if(want&&!leaving&&!dropping)try{fill();}catch{}};
 for(const type of ['pointerup','pointerdown','touchend','keydown','click'])win.addEventListener(type,refill,{capture:true,passive:true});
 function exit(){if(leaving)return;leaving=true;const entry=state();
  if(entry?.hasPrevious)history.go(-(Math.max(0,depth())+1));
  else if(win.self===win.top)win.location.replace('about:blank');
  else leaving=false;}
 try{base();if(hold())fill();else at=depth();}catch{return {exit(){},sync(){}};}
 win.addEventListener('popstate',pop);
 win.addEventListener('pageshow',e=>{if(e.persisted){leaving=false;at=depth();want=stale=true;}});
 return {exit,sync};
}

function preventTextSelection(doc=document,win=window){
 const clearSelection=()=>{const selection=win.getSelection?.();if(selection?.rangeCount&&!selection.isCollapsed)selection.removeAllRanges();};
 const editable=t=>!!t?.closest?.('textarea,input');
 const block=e=>{if(editable(e.target))return;e.preventDefault();clearSelection();};
 for(const type of ['contextmenu','selectstart','dragstart','dblclick'])doc.addEventListener(type,block,{capture:true,passive:false});
 doc.addEventListener('selectionchange',()=>{if(!editable(doc.activeElement))clearSelection();});
}

function installBattleShortcuts({state,action,back},doc=document){
 const LETTERS={KeyN:'next-wave',KeyR:'rotate',KeyQ:'hotkey-skill',KeyT:'cycle-target',KeyF:'fold-panel'};
 doc.addEventListener('keydown',e=>{
  if(e.isComposing||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.shiftKey&&e.key!=='+')return;
  const tag=e.target?.tagName?.toLowerCase();
  if(['input','textarea','select'].includes(tag)||e.target?.isContentEditable)return;
  if(e.key==='Escape'){e.preventDefault();if(!e.repeat)back();return;}
  if((e.code==='KeyY'||e.code==='KeyN')&&doc.querySelector('.dialog.msgbox')){e.preventDefault();if(!e.repeat)doc.querySelector(e.code==='KeyY'?'.dialog .xp-yes':'.dialog .xp-no')?.click();return;}
  const s=state();if(s.screen!=='battle'||s.dialog||!s.game||s.game.ended)return;
  let command=null,id;
  if(/^[1-9]$/.test(e.key)){command='build';id=s.game.loadout[Number(e.key)-1];if(!id)return;}
  else if(e.key==='Enter')command=s.pendingTile?'confirm-place':'upgrade';
  else if(e.key==='Backspace'||e.key==='Delete')command='sell';
  else if(LETTERS[e.code])command=LETTERS[e.code];
  else if(e.key===' '||e.code==='Space')command='speed';
  else if(e.key==='+'||e.key==='='||e.code==='NumpadAdd')command='zoom-in';
  else if(e.key==='-'||e.code==='NumpadSubtract')command='zoom-out';
  else if(e.key==='0')command='zoom-fit';
  if(!command)return;e.preventDefault();if(e.repeat&&!command.startsWith('zoom'))return;action(command,id);
 });
}

Object.defineProperty(exports,"installBackNavigation",{enumerable:true,get:()=>installBackNavigation});
Object.defineProperty(exports,"installBattleShortcuts",{enumerable:true,get:()=>installBattleShortcuts});
Object.defineProperty(exports,"preventTextSelection",{enumerable:true,get:()=>preventTextSelection});
},
"pacing.js":function(require,exports){
const {WAVE_SCRIPTS,DIFFICULTIES,enemyMoveSpeed}=require("data.js");

const PACING_VERSION=7;
// Seconds after the last spawn before an unfinished wave can roll over.
const MIN_TAIL=6;
// Mode tempo: scripts keep their shape; TEMPO scales every gap and pause, HOLD_SCALE every hold.
// 3.0: about 20 minutes on normal (25 waves) and 30 minutes on hard (30 waves).
const TEMPO={normal:0.7,hard:0.7,doom:0.88},HOLD_SCALE={normal:0.2,hard:0.25,doom:0.25};
function scriptGroups(difficulty,wave){
 const script=WAVE_SCRIPTS[difficulty][wave-1];
 if(script.final)return script.g.map(([kind,count,gap,at])=>({kind,count,gap,start:at,end:at+(count-1)*gap}));
 const k=TEMPO[difficulty]??1;let t=0,first=true;return script.g.map(([kind,count,gap,pause])=>{if(!first)t+=pause*k;first=false;const start=t;t+=(count-1)*gap*k;return {kind,count,gap:gap*k,start,end:t};});
}
function waveQueue(difficulty,wave){
 const queue=[];for(const g of scriptGroups(difficulty,wave))for(let i=0;i<g.count;i++)queue.push({kind:g.kind,at:g.start+i*g.gap});
 return queue.sort((a,b)=>a.at-b.at);
}
// Rollover time for an uncleared wave on a path of `length` cells.
function waveTimeout(difficulty,wave,length){
 const script=WAVE_SCRIPTS[difficulty][wave-1];if(script.final)return DIFFICULTIES[difficulty].finalDuration;
 const groups=scriptGroups(difficulty,wave),last=Math.max(...groups.map(g=>g.end));
 return Math.max(last+MIN_TAIL,...groups.map(g=>g.end+script.hold*(HOLD_SCALE[difficulty]??1)*length/enemyMoveSpeed(g.kind)));
}
// The time a wave normally takes to play out; farms slow down when a wave is dragged on past it.
function wavePar(difficulty,wave,length=339){const groups=scriptGroups(difficulty,wave);return Math.max(30,...groups.map(g=>g.end+.5*length/enemyMoveSpeed(g.kind)));}

// These are game-specific tuning values, not copied Tower Battles statistics.
// Repeated attacks have a minimum interval, an encounter cap and target grace.
// guardian: TB's axe - one ground tower next to the road can't attack, use abilities or upgrade for about 20 s.
const BOSS_ATTACKS=Object.freeze({
 guardian:{entryDelay:6,windup:1.2,entryStun:0,stun:20,minInterval:14,maxInterval:18,maxRepeats:8,range:.8,cluster:0,maxTargets:1,grace:6},
 siege:{entryDelay:1.5,windup:1.5,entryStun:2,stun:2,minInterval:26,maxInterval:34,maxRepeats:3,range:3.4,cluster:1.5,maxTargets:2,grace:6},
 overlord:{entryDelay:1.5,windup:1.5,entryStun:7,stun:7,minInterval:28,maxInterval:38,maxRepeats:4,range:3.8,cluster:1.8,maxTargets:3,grace:6},
 doombringer:{entryDelay:2,windup:1.5,entryStun:6,stun:6,minInterval:26,maxInterval:34,maxRepeats:5,range:4,cluster:2,maxTargets:3,grace:6}
});

Object.defineProperty(exports,"BOSS_ATTACKS",{enumerable:true,get:()=>BOSS_ATTACKS});
Object.defineProperty(exports,"PACING_VERSION",{enumerable:true,get:()=>PACING_VERSION});
Object.defineProperty(exports,"wavePar",{enumerable:true,get:()=>wavePar});
Object.defineProperty(exports,"waveQueue",{enumerable:true,get:()=>waveQueue});
Object.defineProperty(exports,"waveTimeout",{enumerable:true,get:()=>waveTimeout});
}
};

require("app.js");
})();
</script>
