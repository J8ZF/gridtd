};

// Tesla 3x3: coil seen from above (windings as rings) under a bright sphere.
// Lv2 insulator posts, Lv3 a small radar dish (hidden detection), Lv4 three
// satellite coils joined by a ring.
TOWERS.tesla = (lv) => {
  let b = pad(3, 3) + P([-10, -24, 10, -24, 24, -10, 24, 10, 10, 24, -10, 24, -24, 10, -24, -10], "floor");
  if (lv >= 2) for (const [x, y] of [[-16, -16], [16, -16], [-16, 16], [16, 16]]) b += C(x, y, 3.4, "steel") + C(x, y, 1.5, "c+30");
  if (lv >= 4) {
    b += C(0, 0, 21, "none", ' stroke="c-20" stroke-width="1.4"');
    for (const a of [-90, 30, 150]) {
      const x = 21 * Math.cos((a * Math.PI) / 180), y = 21 * Math.sin((a * Math.PI) / 180);
      b += C(x, y, 5.2, "c-45") + C(x, y, 2.6, "c+25");
    }
  }
  b += C(0, 0, 16, "c-58");
  for (const r of [14, 11, 8]) b += C(0, 0, r, "none", ' stroke="c-18" stroke-width="1.6"');
  b += C(0, 0, 6.4, "c") + C(0, 0, 2.8, "c+45");
  if (lv >= 3) b += C(-20, 20, 5.4, "plate") + C(-20, 20, 3.6, "steel") + L(-20, 20, -16.4, 16.4, "gunHi", 1.2) + C(-20, 20, 1.2, "c+40");
  return { base: b };
};

// Gauss 3x3: heavy plate that shakes the ground; ribs radiate from a hub.
// Lv2 a wider plate with more ribs, Lv3 a glowing reactor core and cooling fins.
TOWERS.gauss = (lv) => {
  let b = pad(3, 3) + R(-22, -22, 44, 44, "floor", 4);
  for (const [x, y] of [[-16, -16], [16, -16], [-16, 16], [16, 16]]) b += C(x, y, 3.2, "steel") + C(x, y, 1.3, "plate");
  if (lv >= 3)
    for (const [x, y, w, h] of [[-27, -8, 5, 16], [22, -8, 5, 16], [-8, -27, 16, 5], [-8, 22, 16, 5]]) {
      b += R(x, y, w, h, "steel", 1);
      for (let k = 1; k < 4; k++) b += w < h ? L(x, y + (h * k) / 4, x + w, y + (h * k) / 4, "plate", 0.8) : L(x + (w * k) / 4, y, x + (w * k) / 4, y + h, "plate", 0.8);
    }
  const r = lv >= 2 ? 19 : 16, n = lv >= 2 ? 12 : 8;
  b += C(0, 0, r, "c-52") + C(0, 0, r - 1, "none", ' stroke="c-25" stroke-width="1.4"');
  for (let k = 0; k < n; k++) {
    const a = (k / n) * Math.PI * 2;
    b += L(Math.cos(a) * 7, Math.sin(a) * 7, Math.cos(a) * (r - 2.4), Math.sin(a) * (r - 2.4), "c-28", 1.4);
  }
  b += lv >= 3 ? C(0, 0, 8, "c-68") + C(0, 0, 6, "c!") + C(0, 0, 2.6, "c+60") : C(0, 0, 6.2, "c") + C(0, 0, 2.6, "c+40");
  return { base: b };
};

// Laser 3x3: round turret with a lens barrel and capacitor cells on the back.
// Lv2 a bigger battery, Lv3 a large focusing lens, Lv4 a long barrel ringed
// with coils and two prongs at the muzzle.
TOWERS.laser = (lv) => {
  const base = pad(3, 3) + C(0, 0, 21, "floor") + C(0, 0, 20, "none", ' stroke="steel" stroke-width="1.4"');
  let t = "";
  // capacitor cells behind the body
  const cols = lv >= 2 ? 2 : 1;
  for (let c2 = 0; c2 < cols; c2++)
    for (const y of [-8, -2.6, 2.8]) t += R(-19 + c2 * 4.6, y, 4, 4.6, "c-60", 0.8) + R(-18.2 + c2 * 4.6, y + 0.8, 2.4, 3, "c+40", 0.5);
  t += R(-14, -11, 22, 22, "c-45", 4) + R(-11, -8, 15, 16, "c", 3);
  const len = lv >= 4 ? 30 : 23;
  t += R(6, -3.4, len - 6, 6.8, "steelHi", 1.6) + R(6, -1.4, len - 6, 2.8, "gunHi", 1);
  if (lv >= 4) for (const x of [12, 17, 22]) t += R(x, -4.6, 2.2, 9.2, "c+18", 0.8);
  if (lv >= 4) t += R(len - 1, -5, 4, 2, "gun") + R(len - 1, 3, 4, 2, "gun");
  if (lv >= 3) t += C(9, 0, 6.4, "plate") + C(9, 0, 4.4, "c-40") + C(9, 0, 3, "c!");
  t += C(len, 0, 3.4, "c-35") + C(len, 0, 2, "c!");
  return { base, turret: t };
};

// ---- the spawner's car ---------------------------------------------------------
// Lv1 jeep, Lv2 spiked bumper, Lv3 explosive crates in the back, Lv4 an armored
// car with six wheels and a machine-gun turret (turns to its target).
function carUnit(lv) {
  let p = "";
  if (lv < 4) {
    for (const x of [-13, 13]) for (const s of [-1, 1]) p += R(x - 5, s > 0 ? 9.4 : -15, 10, 5.6, "rubber", 1.6);
    p += C(-23.6, 0, 4.4, "rubber") + C(-23.6, 0, 2, "steel"); // spare tire
    p += R(-22, -11.4, 44, 22.8, "c-38", 4); // tub
    p += R(6, -10.4, 15, 20.8, "c", 3) + L(9, -6, 18, -6, "c-20", 0.9) + L(9, 6, 18, 6, "c-20", 0.9); // hood
    p += R(3, -10.6, 2.8, 21.2, "paint", 1); // windshield
    if (lv < 3) p += R(-7, -8.6, 7.4, 7.4, "c-62", 1.6) + R(-7, 1.2, 7.4, 7.4, "c-62", 1.6) + R(-14, -9, 3, 18, "c-55", 1); // seats
    p += R(-10.4, -11.4, 2, 22.8, "steel"); // roll bar
    if (lv >= 2) {
      p += R(21.6, -12.4, 3, 24.8, "steel", 1);
      for (const y of [-9, -3, 3, 9]) p += P([24.6, y - 2.2, 29.4, y, 24.6, y + 2.2], "gunHi");
    }
    if (lv >= 3) {
      // explosive crate with warning stripes, two drums
      p += R(-21, -9.6, 14, 19.2, "c-55", 1.4);
      for (let k = 0; k < 4; k++) p += R(-19.4 + k * 3.2, -8.2, 1.6, 16.4, "c+35");
      p += C(-3, -5.4, 3.4, "c-30") + C(-3, -5.4, 1.4, "c+20") + C(-3, 5.4, 3.4, "c-30") + C(-3, 5.4, 1.4, "c+20");
    }
    return p;
  }
  // Lv4 armored car
  for (const x of [-16, 0, 16]) for (const s of [-1, 1]) p += R(x - 4.6, s > 0 ? 11 : -16.6, 9.2, 5.6, "rubber", 1.6);
  p += P([-24, -12, 18, -12, 26, -5, 26, 5, 18, 12, -24, 12], "c-30");
  p += P([-20, -9, 15, -9, 21, -4, 21, 4, 15, 9, -20, 9], "c-12");
  p += R(17, -6, 2, 4, "hole") + R(17, 2, 2, 4, "hole"); // vision slits
  for (const [x, y] of [[-20, -9], [-20, 9], [12, -9], [12, 9]]) p += C(x, y, 0.9, "c+20");
  p += G("turret", C(-3, 0, 7.6, "c-40") + C(-3, 0, 6, "c") + R(2, -1.3, 20, 2.6, "gunHi", 0.6) + R(14, -2, 2, 4, "gun") + C(-3, 0, 2.2, "c+40"));
  return p;
}

// Garage 3x5: same language as the robot factory; the car of the current

  let b = R(-30, -50, 60, 100, "hall") + R(-24, -26, 48, 70, "bay", 2);

function terrainGrid(map){let g=GRIDS.get(map);if(g)return g;g=new Uint8Array(COLS*ROWS);
 for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const cx=x+.5,cy=y+.5;let v=inPoly(cx,cy,map.ground)?0:1;if(!v)for(const f of map.features){if(f.circle?Math.hypot(cx-f.circle[0],cy-f.circle[1])<=f.circle[2]:inPoly(cx,cy,f.poly)){v=2;break;}}g[y*COLS+x]=v;}

"encounter-view.js":function(require,exports){
const {WAVES,ENEMIES}=require("data.js");
const {enemyIcon}=require("icons.js");
// Count scheduled + living enemies. Spawning moves one between the two sets;
// kills/leaks remove one, while summons and splits add their actual offspring.
function remainingEnemies(game){
 const counts=new Map(),add=(kind,n=1)=>counts.set(kind,(counts.get(kind)??0)+n);
 if(!game.started)for(const [kind,n] of WAVES[game.difficulty][0])add(kind,n);
 else {for(const e of game.queue.slice(game.spawnIndex))add(e.kind);for(const e of game.enemies)if(!e.dead&&e.hp>0)add(e.kind);}
 return Object.keys(ENEMIES).filter(k=>counts.get(k)>0).map(kind=>({kind,count:counts.get(kind)}));
}
function encounterHTML(game){return `<div class="enemy-strip">${remainingEnemies(game).map(({kind,count})=>`<span class="enemy-count" data-enemy="${kind}" title="${ENEMIES[kind].name}" aria-label="${ENEMIES[kind].name} 남은 ${count}">${enemyIcon(kind)}<b>${count}</b></span>`).join('')}</div>`;}
function bossStatusHTML(game){
 const boss=game.enemies.find(e=>!e.dead&&ENEMIES[e.kind].finalBoss);if(!boss)return '';
 const cast=boss.boss?.cast;return `<div class="boss-status"><div><strong>${ENEMIES[boss.kind].name}</strong><span>${cast?`${cast.type==='entry'?'충격파':'마비 공격'} ${Math.max(0,cast.remaining).toFixed(1)}초`:`${Math.ceil(boss.hp).toLocaleString()} / ${boss.maxHp.toLocaleString()}`}</span></div><div class="boss-health"><i style="width:${Math.max(0,boss.hp/boss.maxHp*100)}%"></i></div></div>`;
}
function bossWarnings(game,cell){
 return game.enemies.filter(e=>!e.dead&&e.boss?.cast).map(e=>{
  const targets=e.boss.cast.targets.map(id=>game.towers.find(t=>t.id===id)).filter(Boolean);
  return `<g stroke="#ff9b9f" fill="none" stroke-width="2"><circle cx="${e.x*cell}" cy="${e.y*cell}" r="27" stroke-dasharray="5 4"/>${targets.map(t=>`<rect x="${t.x*cell-22}" y="${t.y*cell-22}" width="44" height="44"/><path d="M${t.x*cell} ${t.y*cell-15}v17m0 5v3" stroke-width="3"/>`).join('')}</g>`;
 }).join('');
}

Object.defineProperty(exports,"bossStatusHTML",{enumerable:true,get:()=>bossStatusHTML});
Object.defineProperty(exports,"bossWarnings",{enumerable:true,get:()=>bossWarnings});
Object.defineProperty(exports,"encounterHTML",{enumerable:true,get:()=>encounterHTML});
Object.defineProperty(exports,"remainingEnemies",{enumerable:true,get:()=>remainingEnemies});
},

"navigation.js":function(require,exports){
// A bounded, same-document history pair turns browser Back into an app action.
// Explicit exit releases the guard. Reloads reuse it instead of adding entries.
const MARK='grid-defense-back-v1';
function installBackNavigation(onBack,win=window,hold=()=>true){
 const history=win.history;let leaving=false,dropping=0;
 const state=()=>history.state?.[MARK];
 function ensureGuard(){
  if(leaving)return;
  let entry=state();
  if(!entry){
   // Navigation.canGoBack omits cross-origin predecessors, so use session history.
   const hasPrevious=history.length>1;
   entry={position:'base',hasPrevious};
   history.replaceState({...history.state,[MARK]:entry},'',win.location.href);
  }
  if(entry.position==='base'&&hold())history.pushState({...history.state,[MARK]:{...entry,position:'guard'}},'',win.location.href);
 }
 // Called after every screen or dialog change: arm the guard when back should be
 // caught, drop it (one step back inside this page) when it should not.
 // Settled on the next tick so a dialog closing into a new screen counts once.
 let pending=0;
 function sync(){
  if(pending)return;
  pending=setTimeout(()=>{pending=0;if(leaving||dropping)return;
   try{const at=state()?.position;
    if(at!=='guard')ensureGuard();
    else if(!hold()){dropping=Date.now();history.back();}}catch{}},0);
 }
 function pop(){
  if(leaving)return;
  if(dropping&&Date.now()-dropping<800){dropping=0;try{ensureGuard();}catch{}return;}
  dropping=0;
  if(state()?.position==='base'){onBack();try{ensureGuard();}catch{}}
 }
 function exit(){
  if(leaving)return;
  leaving=true;
  const entry=state();
  if(entry?.hasPrevious)history.go(entry.position==='guard'?-2:-1);
  else if(win.self===win.top)win.location.replace('about:blank');
  else leaving=false;
 }
 try{ensureGuard();}catch{return {exit(){},sync(){}};}
 win.addEventListener('popstate',pop);
 win.addEventListener('pageshow',e=>{if(e.persisted){leaving=false;try{ensureGuard();}catch{}}});
 return {exit,sync};
}

function preventTextSelection(doc=document,win=window){
 const clearSelection=()=>{const selection=win.getSelection?.();if(selection?.rangeCount&&!selection.isCollapsed)selection.removeAllRanges();};
 const editable=t=>!!t?.closest?.('textarea,input');
 const block=e=>{if(editable(e.target))return;e.preventDefault();clearSelection();};
 for(const type of ['contextmenu','selectstart','dragstart','dblclick'])doc.addEventListener(type,block,{capture:true,passive:false});
 doc.addEventListener('selectionchange',()=>{if(!editable(doc.activeElement))clearSelection();});
}

function installBattleShortcuts({state,action,back},doc=document){
 const LETTERS={KeyN:'next-wave',KeyR:'rotate',KeyQ:'hotkey-skill',KeyT:'cycle-target',KeyF:'fold-panel'};
 doc.addEventListener('keydown',e=>{
  if(e.isComposing||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.shiftKey&&e.key!=='+')return;
  const tag=e.target?.tagName?.toLowerCase();
  if(['input','textarea','select'].includes(tag)||e.target?.isContentEditable)return;
  if(e.key==='Escape'){e.preventDefault();if(!e.repeat)back();return;}
  if((e.code==='KeyY'||e.code==='KeyN')&&doc.querySelector('.dialog.msgbox')){e.preventDefault();if(!e.repeat)doc.querySelector(e.code==='KeyY'?'.dialog .xp-yes':'.dialog .xp-no')?.click();return;}
  const s=state();if(s.screen!=='battle'||s.dialog||!s.game||s.game.ended)return;
  let command=null,id;
  if(/^[1-5]$/.test(e.key)){command='build';id=s.game.loadout[Number(e.key)-1];}
  else if(e.key==='Enter')command=s.pendingTile?'confirm-place':'upgrade';
  else if(e.key==='Backspace'||e.key==='Delete')command='sell';
  else if(LETTERS[e.code])command=LETTERS[e.code];
  else if(e.key===' '||e.code==='Space')command='speed';
  else if(e.key==='+'||e.key==='='||e.code==='NumpadAdd')command='zoom-in';
  else if(e.key==='-'||e.code==='NumpadSubtract')command='zoom-out';
  else if(e.key==='0')command='zoom-fit';
  if(!command)return;e.preventDefault();if(e.repeat&&!command.startsWith('zoom'))return;action(command,id);
 });
}

Object.defineProperty(exports,"installBackNavigation",{enumerable:true,get:()=>installBackNavigation});
Object.defineProperty(exports,"installBattleShortcuts",{enumerable:true,get:()=>installBattleShortcuts});
Object.defineProperty(exports,"preventTextSelection",{enumerable:true,get:()=>preventTextSelection});
},
"pacing.js":function(require,exports){
const {WAVE_SCRIPTS,DIFFICULTIES,enemyMoveSpeed}=require("data.js");

const PACING_VERSION=7;
// Seconds after the last spawn before an unfinished wave can roll over.
const MIN_TAIL=6;
// Mode tempo: scripts keep their shape; TEMPO scales every gap and pause, HOLD_SCALE every hold.
// 3.0: about 20 minutes on normal (25 waves) and 30 minutes on hard (30 waves).
const TEMPO={normal:0.7,hard:0.7},HOLD_SCALE={normal:0.2,hard:0.25};
function scriptGroups(difficulty,wave){
 const script=WAVE_SCRIPTS[difficulty][wave-1];
 if(script.final)return script.g.map(([kind,count,gap,at])=>({kind,count,gap,start:at,end:at+(count-1)*gap}));
 const k=TEMPO[difficulty]??1;let t=0,first=true;return script.g.map(([kind,count,gap,pause])=>{if(!first)t+=pause*k;first=false;const start=t;t+=(count-1)*gap*k;return {kind,count,gap:gap*k,start,end:t};});
}
function waveQueue(difficulty,wave){
 const queue=[];for(const g of scriptGroups(difficulty,wave))for(let i=0;i<g.count;i++)queue.push({kind:g.kind,at:g.start+i*g.gap});
 return queue.sort((a,b)=>a.at-b.at);
}
// Rollover time for an uncleared wave on a path of `length` cells.
function waveTimeout(difficulty,wave,length){
 const script=WAVE_SCRIPTS[difficulty][wave-1];if(script.final)return DIFFICULTIES[difficulty].finalDuration;
 const groups=scriptGroups(difficulty,wave),last=Math.max(...groups.map(g=>g.end));
 return Math.max(last+MIN_TAIL,...groups.map(g=>g.end+script.hold*(HOLD_SCALE[difficulty]??1)*length/enemyMoveSpeed(g.kind)));
}
// The time a wave normally takes to play out; farms slow down when a wave is dragged on past it.
function wavePar(difficulty,wave,length=339){const groups=scriptGroups(difficulty,wave);return Math.max(30,...groups.map(g=>g.end+.5*length/enemyMoveSpeed(g.kind)));}

// These are game-specific tuning values, not copied Tower Battles statistics.
// Repeated attacks have a minimum interval, an encounter cap and target grace.
// guardian: TB's axe - one ground tower next to the road can't attack, use abilities or upgrade for about 20 s.
const BOSS_ATTACKS=Object.freeze({
 guardian:{entryDelay:6,windup:1.2,entryStun:0,stun:20,minInterval:14,maxInterval:18,maxRepeats:8,range:.8,cluster:0,maxTargets:1,grace:6},
 siege:{entryDelay:1.5,windup:1.5,entryStun:2,stun:2,minInterval:26,maxInterval:34,maxRepeats:3,range:3.4,cluster:1.5,maxTargets:2,grace:6},
 overlord:{entryDelay:1.5,windup:1.5,entryStun:7,stun:7,minInterval:28,maxInterval:38,maxRepeats:4,range:3.8,cluster:1.8,maxTargets:3,grace:6}
});

Object.defineProperty(exports,"BOSS_ATTACKS",{enumerable:true,get:()=>BOSS_ATTACKS});
Object.defineProperty(exports,"PACING_VERSION",{enumerable:true,get:()=>PACING_VERSION});
Object.defineProperty(exports,"wavePar",{enumerable:true,get:()=>wavePar});
Object.defineProperty(exports,"waveQueue",{enumerable:true,get:()=>waveQueue});
Object.defineProperty(exports,"waveTimeout",{enumerable:true,get:()=>waveTimeout});
}
};

function require(id){if(cache[id])return cache[id];const result=cache[id]={};if(!modules[id])throw Error('Missing module: '+id);modules[id](require,result);return result;}
require("app.js");
})();
</script>
