// ---- 해골 공장's skeleton ------------------------------------------------------------
// A person token in bone: a skull for a head (blurred like the smiley), ribs over a dark
// chest sweeping back from the spine, longest and brightest in front, and a pelvis band
// for legs. Empty hands at the sides swap front and back with every step.
function skeletonUnit() {
  let p = band(-13, "c-30") + band(TX, "c-55");
  p += R(-7, -1.3, 11.2, 2.6, "c-12"); // spine
  for (const [x, w, t, tone] of [[2.4, 11, 2, "c"], [-0.8, 10.2, 1.8, "c-8"], [-4, 8.8, 1.6, "c-18"]]) {
    const sw = 1.8; // sweep toward the back at the sides
    p += P2([x + t / 2, 1.3, x - sw + t / 2, w, x - sw - t / 2, w, x - t / 2, 1.3], tone);
  }
  p += band(HX, "c") + G("", `<image href="skull" x="-11" y="-4.3" width="22" height="8.6"/>`, ` transform="translate(8.5 0) rotate(-90)"`);
  const hand = (x, side) => R(x, side > 0 ? 11.8 : -15.6, 3.8, 3.8, "c", 0, ' stroke="c-30" stroke-width="0.8"');
  p += G("handA", hand(3, 1) + hand(-5, -1)) + G("handB", hand(-5, 1) + hand(3, -1), ' data-off="1"');
  return p;
}
// The roster's last step, the skeleton knight: the same token in ghost teal under a steel
// breastplate and shoulder plates, the skeleton's face drawn bright, and a ghost sword in the right
// hand that turns to its target and swings through each cut.
function knightUnit() {
  let p = band(-13, "c-45") + band(TX, "c-62");
  // ghost armor: plates of the same teal, darker, a raised ridge and a glowing seam
  p += P([-6.6, -10.4, 3.6, -11.4, 3.6, 11.4, -6.6, 10.4], "c-58") + R(-6.6, -1.2, 10.2, 2.4, "c-30") + L(-4.8, -8.2, -4.8, 8.2, "c!", 0.9);
  for (const s of [-1, 1]) p += R(-4.8, s > 0 ? 9.4 : -14.6, 7.8, 5.2, "c-30", 1.6) + R(-3.6, s > 0 ? 10.6 : -13.4, 5.4, 2.8, "c-58", 1); // shoulder plates
  p += band(HX, "c") + G("", `<image href="skullB" x="-11" y="-4.3" width="22" height="8.6"/>`, ` transform="translate(8.5 0) rotate(-90)"`);
  const y = GY;
  const sword = R(-3.4, y - 0.9, 6.6, 1.8, "steel", 0.6) + R(2.6, y - 3.4, 1.8, 6.8, "steelHi", 0.6) +
    P([4.4, y - 1.7, 23, y - 1.2, 26.4, y, 23, y + 1.2, 4.4, y + 1.7], "c!") + L(5.2, y, 22.6, y, "c+75", 0.7);
  p += R(-1.4, -15.6, 3.8, 3.8, "c+42", 0, ' stroke="c+12" stroke-width="0.8"'); // empty left hand
  p += G("turret", sword + R(-1.6, 11.8, 3.8, 3.8, "c+42", 0, ' stroke="c+12" stroke-width="0.8"'));
  return p;
}

// ---- ICU 전선 (4.4): a silver-white forward base and its units ----------------------------------
// Everything is square-cut (45° corners), light silver steps of the tower color, and only the lights
// glow (c!). Units face +x like the other units; the base's gate is on the top edge like the garages.

// Chaos Trooper: an armored eraser token with a visored helmet; minigun in the right hand, grenade
// launcher in the left. Mk II (Lv.2) gets shoulder plates and a wide lit visor (it sees hidden
// enemies); from Lv.3 the armor turns dark.
function icuTrooper(lv) {
  const dark = lv >= 3, mk2 = lv >= 2, y = GY;
  const legs = dark ? "c-70" : "c-42", torso = dark ? "c-58" : "c-16", head = dark ? "c-40" : "c+22";
  // weapons sit outside the token and under it
  let p = R(-3.4, y - 2.6, 9.4, 5.2, "steelHi") + R(-1.6, y - 3.4, 3.6, 6.8, "steel");
  for (const d of [-1.4, 0, 1.4]) p += L(6, y + d, 19.6, y + d, "gunHi", 1);
  p += R(15.4, y - 2.4, 1.6, 4.8, "gun");
  p += R(-2.6, -y - 2.2, 7.4, 4.4, "steel") + R(4.8, -y - 2.9, 9.4, 5.8, "plate") + R(14.2, -y - 2.1, 1.4, 4.2, "hole");
  p += band(-13, legs) + band(TX, torso) + band(HX, head);
  // chest plate and belt
  p += P(cut(-5.6, -9.4, 2.4, 9.4, 1.8), dark ? "c-44" : "c+4") + R(-7.4, -11.6, 1.2, 23.2, dark ? "c-78" : "c-46");
  // helmet: a raised crest and the visor across the front
  p += R(4.8, -1, 3.6, 2, dark ? "c-28" : "c+46");
  p += P([8.4, -11.6, 10.6, -11.6, 12.4, -9.8, 12.4, 9.8, 10.6, 11.6, 8.4, 11.6], "c-76");
  p += mk2 ? R(9.6, -9, 1.8, 18, "c!") : R(9.8, -5.6, 1.2, 11.2, "c!");
  if (mk2) for (const s of [-1, 1]) p += P(cut(-4.8, s > 0 ? 9.8 : -14.6, 3.4, s > 0 ? 14.6 : -9.8, 1.4), dark ? "c-64" : "c-34");
  const hand = (x, s) => R(x, s > 0 ? 11.8 : -15.6, 3.8, 3.8, dark ? "c-30" : "c+22", 0, ' stroke="c-50" stroke-width="0.8"');
  return p + hand(4.6, 1) + hand(2.6, -1);
}

// Rocket truck: a six-wheeled carrier with a four-tube launcher that turns to its target.
// Mk II (Lv.3+): an armored wedge cab, side skirts, a radar panel and a heavier launcher.
function icuTruck(lv) {
  const mk2 = lv >= 3;
  let p = "";
  const axles = mk2 ? [-17, -6.4, 4.2, 15.6] : [-15, -3.4, 15];
  for (const x of axles) for (const s of [-1, 1]) p += R(x - 4.2, s > 0 ? 10.4 : -16, 8.4, 5.6, "rubber");
  if (!mk2) {
    p += R(-22, -11.6, 46, 23.2, "c-46");
    p += P(cut(11.6, -10.6, 24.4, 10.6, 3.6, 0.8), "c-10") + R(19.4, -8.4, 2.4, 16.8, "c-74") + R(13.4, -9, 4.8, 18, "c+16");
    p += R(-21, -10.6, 31, 21.2, "c-32");
    for (const yy of [-7.4, 7.4]) p += R(-19.6, yy - 0.6, 28, 1.2, "c-52");
  } else {
    p += P(cut(-25, -12.6, 28, 12.6, 2, 1), "c-50");
    for (const s of [-1, 1]) {
      const y0 = s > 0 ? 12.6 : -16.6;
      p += P(cut(-23, y0, 14, y0 + 4, 1.2), "c-30");
      for (const x of [-18, -4, 9]) p += R(x - 0.8, y0 + 1.2, 1.6, 1.6, "c+20");
    }
    p += P([12, -11.6, 22, -11.6, 30, -4, 30, 4, 22, 11.6, 12, 11.6], "c-14") + P([22.6, -8.4, 27.6, -3.4, 27.6, 3.4, 22.6, 8.4], "c-76") + R(13.6, -10, 5.6, 20, "c+18");
    p += R(14.6, -4, 3.6, 8, "steel") + R(15.4, -3.2, 2, 6.4, "c!"); // radar panel on the cab roof
    p += R(-24, -11.4, 34.6, 22.8, "c-34");
  }
  // launcher: a box of four tubes seen from above, a lit cap on each missile
  const w = mk2 ? 22 : 18, h = mk2 ? 19.6 : 16.8, x0 = -5 - w / 2, cell = mk2 ? 7.4 : 6.2, gap = mk2 ? 1.8 : 1.4;
  let t = P(cut(x0, -h / 2, x0 + w, h / 2, 2), "c-60") + P(cut(x0 + 1.2, -h / 2 + 1.2, x0 + w - 1.2, h / 2 - 1.2, 1.4), "c-6");
  for (const sx of [-1, 1]) for (const sy of [-1, 1]) {
    const cx = -5 + sx * (cell / 2 + gap / 2), cy = sy * (cell / 2 + gap / 2);
    t += R(cx - cell / 2, cy - cell / 2, cell, cell, "c-76") + P([cx - cell * .28, cy - cell * .28, cx + cell * .12, cy - cell * .28, cx + cell * .3, cy, cx + cell * .12, cy + cell * .28, cx - cell * .28, cy + cell * .28], "c+30") + R(cx + cell * .02, cy - .7, 1.4, 1.4, "c!");
  }
  if (mk2) t += R(x0 + w - 1, -h / 2 - 1.4, 3.2, h + 2.8, "c-40");
  return p + G("turret", t, ' data-pivot="-5,0"');
}

// Striker (after the reference): a dark, faceted heavy tank. Wide tracks with pale pads on the
// outer edge, a wedge glacis, louvers on the rear deck, a row of lights along each side skirt,
// a faceted turret with an octagonal hatch, three slats on its flank and a banded barrel.
// Dark steps of the tower color only; the lights and the outline are the neon.
const NEON = (w) => ` stroke="c!" stroke-width="${w}" stroke-linejoin="miter"`;
function icuTank() {
  let hull = "", a = "", b = "";
  for (const s of [-1, 1]) {
    const y0 = s > 0 ? 13 : -25, edge = s > 0 ? y0 + 9 : y0 + .4;
    hull += P(cut(-29, y0, 29, y0 + 12, 3.4), "c-86");
    for (let x = -22; x <= 22.01; x += 8.8) a += P(cut(x - 3, edge, x + 3, edge + 2.6, 1), "c-46");
    for (let x = -17.6; x <= 17.61; x += 8.8) b += P(cut(x - 3, edge, x + 3, edge + 2.6, 1), "c-46");
  }
  let low = P(cut(-28, -15.4, 27, 15.4, 9, 3), "c-78", NEON(.7));
  low += P([12, -13.6, 26.4, -6, 26.4, 6, 12, 13.6], "c-68"); // glacis
  for (let k = 0; k < 6; k++) low += R(-25 + k * 2.6, -7.6, 1.2, 15.2, "c-46"); // rear louvers
  for (const s of [-1, 1]) {
    low += P(cut(-22, s > 0 ? 10.6 : -14.2, 10, s > 0 ? 14.2 : -10.6, 1), "c-72");
    for (const x of [-18.6, -13, -7.4, -1.8, 3.8]) low += R(x, s * 12.4 - .6, 2.4, 1.2, "c!");
  }
  // turret, turning about (-4, 0): faceted, an octagonal hatch, three slats on the front flank, a banded barrel
  let t = R(6, -2.2, 34, 4.4, "c-54", 0, NEON(.6));
  for (const x of [14, 20, 26]) t += R(x, -2.7, 2.2, 5.4, "c-86");
  t += R(37, -2.8, 4, 5.6, "c-62", 0, NEON(.5));
  t += P([-19, -8.4, -13.4, -12.4, 3, -12.4, 9, -6.6, 9, 6.6, 3, 12.4, -13.4, 12.4, -19, 8.4], "c-70", NEON(.7));
  t += P([-15.4, -6.6, -11.4, -9.6, 1.4, -9.6, 5.8, -5.2, 5.8, 5.2, 1.4, 9.6, -11.4, 9.6, -15.4, 6.6], "c-62");
  for (const x of [-.6, 1.8, 4.2]) t += P([x, -12, x + 1.6, -12, x + 3, -9.4, x + 1.4, -9.4], "c-88");
  t += P([-11.4, -3, -9.2, -5.2, -5.6, -5.2, -3.4, -3, -3.4, 3, -5.6, 5.2, -9.2, 5.2, -11.4, 3], "c-44") + L(-9.2, 5.2, -5.6, 5.2, "c!", .9);
  t += R(-16.6, 7.4, 6, 1, "c!") + R(-1, 9, 5, 1, "c!");
  return hull + G("treadA", a) + G("treadB", b, ' data-off="1"') + low + G("turret", t, ' data-pivot="-4,0"');
}

// 리콘 정비선 (after Bliss of Finality, seen from above): a wide stern with stacked thrusters and
// two pairs of swept wings, the hull narrowing over two black cannons into a long spine with a
// cyan railgun inset, prongs at the nose. White steps, black panels, neon only on edges and lights.
// Drawn huge: about 130 units long (the board scales it to about 44 cells).
function icuShip() {
  const N = NEON(.7);
  let p = "";
  for (const s of [-1, 1]) {
    const W = (pts) => pts.map((v, i) => (i % 2 ? v * s : v));
    // big rear wings, swept back; a dark panel inside a wide white margin, the tip glows
    p += P(W([-32.6, 14, -42.6, 39, -51.4, 39, -47.6, 14]), "c+30", N);
    p += P(W([-36.6, 18.6, -42.4, 33, -46.2, 33, -44.6, 18.6]), "c-84");
    p += P(W([-42, 36.6, -51, 36.6, -51.4, 39, -42.6, 39]), "c!");
    // small forward wings
    p += P(W([-19.4, 14, -23.6, 26, -29.6, 26, -28.6, 14]), "c+30", N);
    p += P(W([-21.8, 16.8, -24.4, 22.6, -26.8, 22.6, -26.4, 16.8]), "c-84");
    p += P(W([-23.2, 24.4, -29.4, 24.4, -29.6, 26, -23.6, 26]), "c!");
    // engine housings at the stern corners, glowing exhausts
    p += P(W([-64, 7, -52, 7, -50, 9, -50, 16, -64, 16]), "c+36", N) + R(-66, s > 0 ? 8.6 : -14.6, 2, 6, "c!");
    // black cannons over the narrowing hull
    p += R(-12, s > 0 ? 8.2 : -10.8, 17, 2.6, "c-88") + R(4.4, s > 0 ? 8.2 : -10.8, 1.4, 2.6, "c-40");
  }
  // stern block and the three stacked thrusters
  p += P(cut(-62, -15.6, -26, 15.6, 2, 3), "c+14", N);
  for (const y of [-7, 0, 7]) p += P([-63.4, y, -58, y - 2.8, -32, y - 2.8, -28.6, y, -32, y + 2.8, -58, y + 2.8], "c+34") + R(-56, y - .4, 22, .8, "c-30");
  // vent slots along both flanks, between the wings
  for (const y of [10.4, 12.6]) for (const sy of [-1, 1]) p += R(-46, sy > 0 ? y : -y - 1, 17, 1, "c-84");
  // middle hull narrowing into the spine
  p += P([-27, -15.6, -14, -15.6, -3.6, -5, -3.6, 5, -14, 15.6, -27, 15.6], "c+24", N) + P([-25, -13, -15, -13, -7.2, -5, -7.2, 5, -15, 13, -25, 13], "c+38");
  // the spine: railgun inset in cyan, a dark keel line, prongs at the nose
  p += P([-8, -4.6, 54, -4.6, 57, -1.8, 57, 2.2, 54, 5, -8, 5], "c+30", N);
  p += R(-9, -1.9, 38, 3.8, "c!") + R(-4.6, -.7, 32, 1.4, "c+44") + R(46, 1.4, 8, 1, "c!");
  p += R(30, -4.6, 24, 1, "c-84") + R(-1, 4, 44, 1, "c-84");
  for (const [y, len] of [[-2.4, 12], [-.8, 16.5], [.8, 16.5], [2.4, 12]]) p += R(57, y - .3, len, .6, "c+40");
  return p;
}

// The base, 10×10: one big command building in the middle, a parking lot all around it where the
// units of the current level stand (troopers, then the rocket truck, then the Striker). The gate is
// on the building's top face; the bar above it fills toward the next trooper.
TOWERS.icu = (lv) => {
  let b = R(-100, -100, 200, 200, "hall") + R(-93, -93, 186, 186, "bay");
  // painted stalls on the four sides
  let m = "";
  for (let y = -78; y <= 78; y += 17.3) m += L(-91, y, -64, y, "paint", 1.2) + L(64, y, 91, y, "paint", 1.2);
  for (let x = -40; x <= 40; x += 20) m += L(x, -91, x, -78, "paint", 1.2) + L(x, 78, x, 91, "paint", 1.2);
  b += G("", m, ' opacity="0.3"');
  // the building
  b += P(cut(-58, -58, 58, 58, 10), "c-46", NEON(1.6)) + P(cut(-52, -52, 52, 52, 8), "c-10") + P(cut(-36, -36, 36, 36, 6), "c+14");
  b += P(cut(-16, -16, 16, 16, 4), "c-40") + P(cut(-10, -10, 10, 10, 2.6), lv >= 5 ? "c!" : "c-14");
  for (const s of [-1, 1]) b += R(s > 0 ? 40 : -46, -24, 6, 48, "c-28") + R(-24, s > 0 ? 40 : -46, 48, 6, "c-28");
  b += R(-26, -60, 52, 12, "c") ;
  for (const y of [-57, -53.6]) b += R(-24, y, 48, 1.2, "c-46");
  b += R(-26, -66, 52, 2.4, "slot") + G("sortie", R(-26, -66, 52, 2.4, "c!"), ' data-pivot="-26,0"');
  // parked units

"navigation.js":function(require,exports){
// A bounded, same-document history pair turns browser Back into an app action.
// Explicit exit releases the guard. Reloads reuse it instead of adding entries.
const MARK='grid-defense-back-v1';
function installBackNavigation(onBack,win=window,hold=()=>true){
 const history=win.history;let leaving=false,dropping=0;
 const state=()=>history.state?.[MARK];
 function ensureGuard(){
  if(leaving)return;
  let entry=state();
  if(!entry){
   // Navigation.canGoBack omits cross-origin predecessors, so use session history.
   const hasPrevious=history.length>1;
   entry={position:'base',hasPrevious};
   history.replaceState({...history.state,[MARK]:entry},'',win.location.href);
  }
  if(entry.position==='base'&&hold())history.pushState({...history.state,[MARK]:{...entry,position:'guard'}},'',win.location.href);
 }
 // Called after every screen or dialog change: arm the guard when back should be
 // caught, drop it (one step back inside this page) when it should not.
 // Settled on the next tick so a dialog closing into a new screen counts once.
 let pending=0;
 function sync(){
  if(pending)return;
  pending=setTimeout(()=>{pending=0;if(leaving||dropping)return;
   try{const at=state()?.position;
    if(at!=='guard')ensureGuard();
    else if(!hold()){dropping=Date.now();history.back();}}catch{}},0);
 }
 function pop(){
  if(leaving)return;
  if(dropping&&Date.now()-dropping<800){dropping=0;try{ensureGuard();}catch{}return;}
  dropping=0;
  if(state()?.position==='base'){onBack();try{ensureGuard();}catch{}}
 }
 function exit(){
  if(leaving)return;
  leaving=true;
  const entry=state();
  if(entry?.hasPrevious)history.go(entry.position==='guard'?-2:-1);
  else if(win.self===win.top)win.location.replace('about:blank');
  else leaving=false;
 }
 try{ensureGuard();}catch{return {exit(){},sync(){}};}
 win.addEventListener('popstate',pop);
 win.addEventListener('pageshow',e=>{if(e.persisted){leaving=false;try{ensureGuard();}catch{}}});
 return {exit,sync};
}

function preventTextSelection(doc=document,win=window){
 const clearSelection=()=>{const selection=win.getSelection?.();if(selection?.rangeCount&&!selection.isCollapsed)selection.removeAllRanges();};
 const editable=t=>!!t?.closest?.('textarea,input');
 const block=e=>{if(editable(e.target))return;e.preventDefault();clearSelection();};
 for(const type of ['contextmenu','selectstart','dragstart','dblclick'])doc.addEventListener(type,block,{capture:true,passive:false});
 doc.addEventListener('selectionchange',()=>{if(!editable(doc.activeElement))clearSelection();});
}

function installBattleShortcuts({state,action,back},doc=document){
 const LETTERS={KeyN:'next-wave',KeyR:'rotate',KeyQ:'hotkey-skill',KeyT:'cycle-target',KeyF:'fold-panel'};
 doc.addEventListener('keydown',e=>{
  if(e.isComposing||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.shiftKey&&e.key!=='+')return;
  const tag=e.target?.tagName?.toLowerCase();
  if(['input','textarea','select'].includes(tag)||e.target?.isContentEditable)return;
  if(e.key==='Escape'){e.preventDefault();if(!e.repeat)back();return;}
  if((e.code==='KeyY'||e.code==='KeyN')&&doc.querySelector('.dialog.msgbox')){e.preventDefault();if(!e.repeat)doc.querySelector(e.code==='KeyY'?'.dialog .xp-yes':'.dialog .xp-no')?.click();return;}
  const s=state();if(s.screen!=='battle'||s.dialog||!s.game||s.game.ended)return;
  let command=null,id;
  if(/^[1-9]$/.test(e.key)){command='build';id=s.game.loadout[Number(e.key)-1];if(!id)return;}
  else if(e.key==='Enter')command=s.pendingTile?'confirm-place':'upgrade';
  else if(e.key==='Backspace'||e.key==='Delete')command='sell';
  else if(LETTERS[e.code])command=LETTERS[e.code];
  else if(e.key===' '||e.code==='Space')command='speed';
  else if(e.key==='+'||e.key==='='||e.code==='NumpadAdd')command='zoom-in';
  else if(e.key==='-'||e.code==='NumpadSubtract')command='zoom-out';
  else if(e.key==='0')command='zoom-fit';
  if(!command)return;e.preventDefault();if(e.repeat&&!command.startsWith('zoom'))return;action(command,id);
 });
}

Object.defineProperty(exports,"installBackNavigation",{enumerable:true,get:()=>installBackNavigation});
Object.defineProperty(exports,"installBattleShortcuts",{enumerable:true,get:()=>installBattleShortcuts});
Object.defineProperty(exports,"preventTextSelection",{enumerable:true,get:()=>preventTextSelection});
},
"pacing.js":function(require,exports){
const {WAVE_SCRIPTS,DIFFICULTIES,enemyMoveSpeed}=require("data.js");

const PACING_VERSION=7;
// Seconds after the last spawn before an unfinished wave can roll over.
const MIN_TAIL=6;
// Mode tempo: scripts keep their shape; TEMPO scales every gap and pause, HOLD_SCALE every hold.
// 3.0: about 20 minutes on normal (25 waves) and 30 minutes on hard (30 waves).
const TEMPO={normal:0.7,hard:0.7},HOLD_SCALE={normal:0.2,hard:0.25};
function scriptGroups(difficulty,wave){
 const script=WAVE_SCRIPTS[difficulty][wave-1];
 if(script.final)return script.g.map(([kind,count,gap,at])=>({kind,count,gap,start:at,end:at+(count-1)*gap}));
 const k=TEMPO[difficulty]??1;let t=0,first=true;return script.g.map(([kind,count,gap,pause])=>{if(!first)t+=pause*k;first=false;const start=t;t+=(count-1)*gap*k;return {kind,count,gap:gap*k,start,end:t};});
}
function waveQueue(difficulty,wave){
 const queue=[];for(const g of scriptGroups(difficulty,wave))for(let i=0;i<g.count;i++)queue.push({kind:g.kind,at:g.start+i*g.gap});
 return queue.sort((a,b)=>a.at-b.at);
}
// Rollover time for an uncleared wave on a path of `length` cells.
function waveTimeout(difficulty,wave,length){
 const script=WAVE_SCRIPTS[difficulty][wave-1];if(script.final)return DIFFICULTIES[difficulty].finalDuration;
 const groups=scriptGroups(difficulty,wave),last=Math.max(...groups.map(g=>g.end));
 return Math.max(last+MIN_TAIL,...groups.map(g=>g.end+script.hold*(HOLD_SCALE[difficulty]??1)*length/enemyMoveSpeed(g.kind)));
}
// The time a wave normally takes to play out; farms slow down when a wave is dragged on past it.
function wavePar(difficulty,wave,length=339){const groups=scriptGroups(difficulty,wave);return Math.max(30,...groups.map(g=>g.end+.5*length/enemyMoveSpeed(g.kind)));}

// These are game-specific tuning values, not copied Tower Battles statistics.
// Repeated attacks have a minimum interval, an encounter cap and target grace.
// guardian: TB's axe - one ground tower next to the road can't attack, use abilities or upgrade for about 20 s.
const BOSS_ATTACKS=Object.freeze({
 guardian:{entryDelay:6,windup:1.2,entryStun:0,stun:20,minInterval:14,maxInterval:18,maxRepeats:8,range:.8,cluster:0,maxTargets:1,grace:6},
 siege:{entryDelay:1.5,windup:1.5,entryStun:2,stun:2,minInterval:26,maxInterval:34,maxRepeats:3,range:3.4,cluster:1.5,maxTargets:2,grace:6},
 overlord:{entryDelay:1.5,windup:1.5,entryStun:7,stun:7,minInterval:28,maxInterval:38,maxRepeats:4,range:3.8,cluster:1.8,maxTargets:3,grace:6}
});

Object.defineProperty(exports,"BOSS_ATTACKS",{enumerable:true,get:()=>BOSS_ATTACKS});
Object.defineProperty(exports,"PACING_VERSION",{enumerable:true,get:()=>PACING_VERSION});
Object.defineProperty(exports,"wavePar",{enumerable:true,get:()=>wavePar});
Object.defineProperty(exports,"waveQueue",{enumerable:true,get:()=>waveQueue});
Object.defineProperty(exports,"waveTimeout",{enumerable:true,get:()=>waveTimeout});
}
};

function require(id){if(cache[id])return cache[id];const result=cache[id]={};if(!modules[id])throw Error('Missing module: '+id);modules[id](require,result);return result;}
require("app.js");
})();
</script>
