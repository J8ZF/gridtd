}

// ---- ICU 전선 (4.4): a silver-white forward base and its units ----------------------------------
// Everything is square-cut (45° corners), light silver steps of the tower color, and only the lights
// glow (c!). Units face +x like the other units; the base's gate is on the top edge like the garages.

// Chaos Trooper: an armored eraser token with a visored helmet; minigun in the right hand, grenade
// launcher in the left. Mk II (Lv.2) gets shoulder plates and a wide lit visor (it sees hidden
// enemies); from Lv.3 the armor turns dark.
function icuTrooper(lv) {
  const dark = lv >= 3, mk2 = lv >= 2, y = GY;
  const legs = dark ? "c-70" : "c-42", torso = dark ? "c-58" : "c-16", head = dark ? "c-40" : "c+22";
  // weapons sit outside the token and under it
  let p = R(-3.4, y - 2.6, 9.4, 5.2, "steelHi") + R(-1.6, y - 3.4, 3.6, 6.8, "steel");
  for (const d of [-1.4, 0, 1.4]) p += L(6, y + d, 19.6, y + d, "gunHi", 1);
  p += R(15.4, y - 2.4, 1.6, 4.8, "gun");
  p += R(-2.6, -y - 2.2, 7.4, 4.4, "steel") + R(4.8, -y - 2.9, 9.4, 5.8, "plate") + R(14.2, -y - 2.1, 1.4, 4.2, "hole");
  p += band(-13, legs) + band(TX, torso) + band(HX, head);
  // chest plate and belt
  p += P(cut(-5.6, -9.4, 2.4, 9.4, 1.8), dark ? "c-44" : "c+4") + R(-7.4, -11.6, 1.2, 23.2, dark ? "c-78" : "c-46");
  // helmet: a raised crest and the visor across the front
  p += R(4.8, -1, 3.6, 2, dark ? "c-28" : "c+46");
  p += P([8.4, -11.6, 10.6, -11.6, 12.4, -9.8, 12.4, 9.8, 10.6, 11.6, 8.4, 11.6], "c-76");
  p += mk2 ? R(9.6, -9, 1.8, 18, "c!") : R(9.8, -5.6, 1.2, 11.2, "c!");
  if (mk2) for (const s of [-1, 1]) p += P(cut(-4.8, s > 0 ? 9.8 : -14.6, 3.4, s > 0 ? 14.6 : -9.8, 1.4), dark ? "c-64" : "c-34");
  const hand = (x, s) => R(x, s > 0 ? 11.8 : -15.6, 3.8, 3.8, dark ? "c-30" : "c+22", 0, ' stroke="c-50" stroke-width="0.8"');
  return p + hand(4.6, 1) + hand(2.6, -1);
}

// Rocket truck: a six-wheeled carrier with a four-tube launcher that turns to its target.
// Mk II (Lv.3+): an armored wedge cab, side skirts, a radar panel and a heavier launcher.
function icuTruck(lv) {
  const mk2 = lv >= 3;
  let p = "";
  const axles = mk2 ? [-17, -6.4, 4.2, 15.6] : [-15, -3.4, 15];
  for (const x of axles) for (const s of [-1, 1]) p += R(x - 4.2, s > 0 ? 10.4 : -16, 8.4, 5.6, "rubber");
  if (!mk2) {
    p += R(-22, -11.6, 46, 23.2, "c-46");
    p += P(cut(11.6, -10.6, 24.4, 10.6, 3.6, 0.8), "c-10") + R(19.4, -8.4, 2.4, 16.8, "c-74") + R(13.4, -9, 4.8, 18, "c+16");
    p += R(-21, -10.6, 31, 21.2, "c-32");
    for (const yy of [-7.4, 7.4]) p += R(-19.6, yy - 0.6, 28, 1.2, "c-52");
  } else {
    p += P(cut(-25, -12.6, 28, 12.6, 2, 1), "c-50");
    for (const s of [-1, 1]) {
      const y0 = s > 0 ? 12.6 : -16.6;
      p += P(cut(-23, y0, 14, y0 + 4, 1.2), "c-30");
      for (const x of [-18, -4, 9]) p += R(x - 0.8, y0 + 1.2, 1.6, 1.6, "c+20");
    }
    p += P([12, -11.6, 22, -11.6, 30, -4, 30, 4, 22, 11.6, 12, 11.6], "c-14") + P([22.6, -8.4, 27.6, -3.4, 27.6, 3.4, 22.6, 8.4], "c-76") + R(13.6, -10, 5.6, 20, "c+18");
    p += R(14.6, -4, 3.6, 8, "steel") + R(15.4, -3.2, 2, 6.4, "c!"); // radar panel on the cab roof
    p += R(-24, -11.4, 34.6, 22.8, "c-34");
  }
  // launcher: a box of four tubes seen from above, a lit cap on each missile
  const w = mk2 ? 22 : 18, h = mk2 ? 19.6 : 16.8, x0 = -5 - w / 2, cell = mk2 ? 7.4 : 6.2, gap = mk2 ? 1.8 : 1.4;
  let t = P(cut(x0, -h / 2, x0 + w, h / 2, 2), "c-60") + P(cut(x0 + 1.2, -h / 2 + 1.2, x0 + w - 1.2, h / 2 - 1.2, 1.4), "c-6");
  for (const sx of [-1, 1]) for (const sy of [-1, 1]) {
    const cx = -5 + sx * (cell / 2 + gap / 2), cy = sy * (cell / 2 + gap / 2);
    t += R(cx - cell / 2, cy - cell / 2, cell, cell, "c-76") + P([cx - cell * .28, cy - cell * .28, cx + cell * .12, cy - cell * .28, cx + cell * .3, cy, cx + cell * .12, cy + cell * .28, cx - cell * .28, cy + cell * .28], "c+30") + R(cx + cell * .02, cy - .7, 1.4, 1.4, "c!");
  }
  if (mk2) t += R(x0 + w - 1, -h / 2 - 1.4, 3.2, h + 2.8, "c-40");
  // a neon outline around the whole truck so it reads on the dark road
  p += P(mk2 ? cut(-26.4, -17.4, 31.4, 17.4, 3) : cut(-23.4, -17, 25.8, 17, 3), "none", NEON(.9));
  return p + G("turret", t, ' data-pivot="-5,0"');
}

// Striker (after the reference): a dark, faceted heavy tank. Wide tracks with pale pads on the
// outer edge, a wedge glacis, louvers on the rear deck, a row of lights along each side skirt,
// a faceted turret with an octagonal hatch, three slats on its flank and a banded barrel.
// Dark steps of the tower color only; the lights and the outline are the neon.
const NEON = (w) => ` stroke="c!" stroke-width="${w}" stroke-linejoin="miter"`;
function icuTank() {
  let hull = "", a = "", b = "";
  for (const s of [-1, 1]) {
    const y0 = s > 0 ? 13 : -25, edge = s > 0 ? y0 + 9 : y0 + .4;
    hull += P(cut(-29, y0, 29, y0 + 12, 3.4), "c-86");
    for (let x = -22; x <= 22.01; x += 8.8) a += P(cut(x - 3, edge, x + 3, edge + 2.6, 1), "c-46");
    for (let x = -17.6; x <= 17.61; x += 8.8) b += P(cut(x - 3, edge, x + 3, edge + 2.6, 1), "c-46");
  }
  let low = P(cut(-28, -15.4, 27, 15.4, 9, 3), "c-78", NEON(.7));
  low += P([12, -13.6, 26.4, -6, 26.4, 6, 12, 13.6], "c-68"); // glacis
  for (let k = 0; k < 6; k++) low += R(-25 + k * 2.6, -7.6, 1.2, 15.2, "c-46"); // rear louvers
  for (const s of [-1, 1]) {
    low += P(cut(-22, s > 0 ? 10.6 : -14.2, 10, s > 0 ? 14.2 : -10.6, 1), "c-72");
    for (const x of [-18.6, -13, -7.4, -1.8, 3.8]) low += R(x, s * 12.4 - .6, 2.4, 1.2, "c!");
  }
  // turret, turning about (-4, 0): faceted, an octagonal hatch, three slats on the front flank, a banded barrel
  let t = R(6, -2.2, 34, 4.4, "c-54", 0, NEON(.6));
  for (const x of [14, 20, 26]) t += R(x, -2.7, 2.2, 5.4, "c-86");
  t += R(37, -2.8, 4, 5.6, "c-62", 0, NEON(.5));
  t += P([-19, -8.4, -13.4, -12.4, 3, -12.4, 9, -6.6, 9, 6.6, 3, 12.4, -13.4, 12.4, -19, 8.4], "c-70", NEON(.7));
  t += P([-15.4, -6.6, -11.4, -9.6, 1.4, -9.6, 5.8, -5.2, 5.8, 5.2, 1.4, 9.6, -11.4, 9.6, -15.4, 6.6], "c-62");
  for (const x of [-.6, 1.8, 4.2]) t += P([x, -12, x + 1.6, -12, x + 3, -9.4, x + 1.4, -9.4], "c-88");
  t += P([-11.4, -3, -9.2, -5.2, -5.6, -5.2, -3.4, -3, -3.4, 3, -5.6, 5.2, -9.2, 5.2, -11.4, 3], "c-44") + L(-9.2, 5.2, -5.6, 5.2, "c!", .9);
  t += R(-16.6, 7.4, 6, 1, "c!") + R(-1, 9, 5, 1, "c!");
  // a neon outline around tracks and hull: the dark tank has to read on the dark road
  low += P(cut(-30, -26, 30, 26, 4), "none", NEON(1.1));
  return hull + G("treadA", a) + G("treadB", b, ' data-off="1"') + low + G("turret", t, ' data-pivot="-4,0"');
}

// 리콘 정비선 (after Bliss of Finality, seen from above), built the way this game builds things:
// a white body, brighter raised plates on it, black seams on the plates and neon running between
// the black seams. A wide stern with three thrusters and two pairs of swept wings; the hull
// narrows into a long spine with prongs at the nose. Its weapons are turrets that turn to what
// they shoot: two heavy machine guns on the waist, the flash cannon on the stern, the railgun on
// the spine (groups mgL, mgR, flash, rail; o gives their angles relative to the hull).
// About 130 units long; the board draws it 6.8× (about 44 cells).
function icuShip() {
  const N = NEON(.7);
  let p = "";
  // black seam pair with a neon line between them, along a straight run
  const seam = (x1, y1, x2, y2, gap, w = .8) => {
    const dx = x2 - x1, dy = y2 - y1, l = Math.hypot(dx, dy), nx = -dy / l * gap, ny = dx / l * gap;
    return L(x1 + nx, y1 + ny, x2 + nx, y2 + ny, "c-86", w) + L(x1 - nx, y1 - ny, x2 - nx, y2 - ny, "c-86", w) + L(x1, y1, x2, y2, "c!", w * .8);
  };
  for (const s of [-1, 1]) {
    const W = (pts) => pts.map((v, i) => (i % 2 ? v * s : v)), y = (v) => v * s;
    // big rear wings: body, a raised plate, a black panel split by a neon line, the lit tip
    p += P(W([-32.6, 14, -42.6, 39, -51.4, 39, -47.6, 14]), "c+12", N);
    p += P(W([-35.4, 16, -43.4, 36, -49, 36, -45.8, 16]), "c+36");
    p += P(W([-38.6, 20.4, -42.8, 31, -46.2, 31, -44.6, 20.4]), "c-86") + L(-41.6, y(20.4), -44.5, y(31), "c!", .8);
    p += R(-50.8, s > 0 ? 36.8 : -38.4, 8, 1.6, "c!") + L(-50.4, y(35.4), -43, y(35.4), "c-86", .7);
    // small forward wings
    p += P(W([-19.4, 14, -23.6, 26, -29.6, 26, -28.6, 14]), "c+12", N);
    p += P(W([-21.4, 15.6, -24.4, 23.8, -28.2, 23.8, -27.4, 15.6]), "c+36");
    p += P(W([-23, 17.4, -24.8, 22, -26.8, 22, -26.2, 17.4]), "c-86") + R(-29, s > 0 ? 24.6 : -26, 5.6, 1.4, "c!");
    // engine housings at the stern corners
    p += P(W([-64, 7, -52, 7, -50, 9, -50, 16, -64, 16]), "c+12", N) + P(W([-62.4, 8.6, -53, 8.6, -51.6, 10, -51.6, 14.4, -62.4, 14.4]), "c+36");
    p += L(-60, y(11.5), -54, y(11.5), "c-86", .8) + R(-66, s > 0 ? 9 : -15, 2, 6, "c!");
  }
  // stern block: two raised plates with seams, a black channel with a neon core between them
  p += P(cut(-62, -15.6, -26, 15.6, 2, 3), "c+12", N);
  for (const s of [-1, 1]) {
    p += P(cut(-59.4, s > 0 ? 4 : -13.4, -29, s > 0 ? 13.4 : -4, 1.6), "c+36");
    for (const x of [-52, -43, -34]) p += L(x, s * 5, x, s * 12.4, "c-86", .8);
    for (const x of [-57.6, -55.2]) p += R(x, s > 0 ? 6 : -11.4, 1.2, 5.4, "c-86");
  }
  p += R(-61, -2.8, 32, 5.6, "c-86") + R(-59, -.5, 28, 1, "c!");
  for (const y of [-9, 0, 9]) p += R(-64.4, y - 2, 2.4, 4, "c-60") + R(-65.6, y - 1.4, 1.2, 2.8, "c!"); // thrusters

const {WAVES,ENEMIES}=require("data.js");
const {enemyIcon}=require("icons.js");
// Count scheduled + living enemies. Spawning moves one between the two sets;
// kills/leaks remove one, while summons and splits add their actual offspring.
function remainingEnemies(game){
 const counts=new Map(),add=(kind,n=1)=>counts.set(kind,(counts.get(kind)??0)+n);
 if(!game.started)for(const [kind,n] of WAVES[game.difficulty][0])add(kind,n);
 else {for(const e of game.queue.slice(game.spawnIndex))add(e.kind);for(const e of game.enemies)if(!e.dead&&(e.hp>0||e.down>0))add(e.kind);}
 return Object.keys(ENEMIES).filter(k=>counts.get(k)>0).map(kind=>({kind,count:counts.get(kind)}));
}
function encounterHTML(game){return `<div class="enemy-strip">${remainingEnemies(game).map(({kind,count})=>`<span class="enemy-count" data-enemy="${kind}" title="${ENEMIES[kind].name}" aria-label="${ENEMIES[kind].name} 남은 ${count}">${enemyIcon(kind)}<b>${count}</b></span>`).join('')}</div>`;}
function bossStatusHTML(game){
 const boss=game.enemies.find(e=>!e.dead&&ENEMIES[e.kind].finalBoss)??game.enemies.find(e=>!e.dead&&ENEMIES[e.kind].bar);if(!boss)return '';
 const cast=boss.boss?.cast,jam=game.jam?.left>0?` · 교란 ${game.jam.left.toFixed(1)}초`:'';return `<div class="boss-status"><div><strong>${ENEMIES[boss.kind].name}${boss.phase===2?' · 2페이즈':''}</strong><span>${boss.down>0?`다시 일어나는 중 ${boss.down.toFixed(1)}초`:cast?`${cast.type==='entry'?'충격파':'마비 공격'} ${Math.max(0,cast.remaining).toFixed(1)}초`:`${Math.ceil(boss.hp).toLocaleString()}${boss.shield>0?' +'+Math.ceil(boss.shield).toLocaleString():''} / ${Math.round(boss.maxHp).toLocaleString()}`}${jam}</span></div><div class="boss-health"><i style="width:${Math.max(0,boss.hp/boss.maxHp*100)}%"></i></div></div>`;
}
function bossWarnings(game,cell){
 return game.enemies.filter(e=>!e.dead&&e.boss?.cast).map(e=>{
  const targets=e.boss.cast.targets.map(id=>game.towers.find(t=>t.id===id)).filter(Boolean);
  return `<g stroke="#ff9b9f" fill="none" stroke-width="2"><circle cx="${e.x*cell}" cy="${e.y*cell}" r="27" stroke-dasharray="5 4"/>${targets.map(t=>`<rect x="${t.x*cell-22}" y="${t.y*cell-22}" width="44" height="44"/><path d="M${t.x*cell} ${t.y*cell-15}v17m0 5v3" stroke-width="3"/>`).join('')}</g>`;
 }).join('');
}

// Steps of an enemy's own colour. Darker steps keep the hue and get richer (lightness down,
// saturation up): a deep green on a green enemy, not a muddy one. Lighter steps move toward white.
const TONES=new Map();
function enemyTone(c,t){const key=c+t;let v=TONES.get(key);if(v)return v;const n=parseInt(c.slice(1),16);
 if(t>=0)v='#'+[16,8,0].map(k=>Math.round(((n>>k)&255)+(255-((n>>k)&255))*t).toString(16).padStart(2,'0')).join('');
 else{const r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;let h=0,s=0;

  v='#'+q.map(x=>Math.round(Math.min(1,Math.max(0,x+m))*255).toString(16).padStart(2,'0')).join('');}
 TONES.set(key,v);return v;}
