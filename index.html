.skip-offer button.icon{width:40px;min-width:40px;padding:10px;background:transparent;border-color:transparent;color:var(--muted)}
.skip-offer>button.primary:only-child{padding:0 18px}
.skip-offer button.primary.arming{background:linear-gradient(var(--accent),var(--accent)) left/0 100% no-repeat #2e5a2e;border-color:#3e7a3e;color:#ffffff;animation:arm 1s linear forwards}
@keyframes arm{99%{background-size:100% 100%;color:#ffffff;border-color:#3e7a3e}100%{background-size:100% 100%;color:#ffffff;border-color:var(--accent)}}
@keyframes skip-in{from{opacity:0;transform:translate(-50%,-6px)}}
.battle-footer .slot .tower-icon{width:38px;height:38px}.battle-footer .slot{gap:1px}.slot .price{font-size:11px;font-weight:800;color:var(--cash);-webkit-text-stroke:3px rgba(0,0,0,.55);paint-order:stroke fill;letter-spacing:.2px}.tower-art{overflow:visible}/* 3.2 inventory: selected tower on top, equipped column on the right, 4-column list */
.inventory .inv-top{display:grid;grid-template-columns:minmax(0,1fr) 62px;gap:12px;padding:14px 18px 12px;border-bottom:1px solid var(--line);flex-shrink:0}
.inv-pick{display:flex;flex-direction:column;gap:8px;min-width:0}
.inv-hero{height:128px;display:flex;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--line);border-bottom:3px solid var(--color)}
.inv-hero .inv-hero-art{width:108px;height:108px}
.inv-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px;min-width:0}
.inv-title strong{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inv-desc{font-size:12px;color:var(--muted);line-height:1.5;min-height:36px}
.inv-actions{display:grid;grid-template-columns:1fr 1.3fr;gap:6px}
.inv-actions button{min-height:42px;height:42px;padding:6px 8px;font-size:13px;gap:5px}
.inv-actions .inv-more-btn{background:var(--panel)}
.inv-act.credit{background:var(--gold);border-color:var(--gold);color:#3a2e00}
.inv-act.credit-off{color:var(--gold)}
.inv-actions svg.icon{width:16px;height:16px}
.inv-loadout{display:grid;grid-template-rows:repeat(5,minmax(0,1fr));gap:6px;min-height:0}
.inv-slot{min-height:0;height:auto;padding:3px;background:var(--panel);border:1px solid var(--line);border-bottom:3px solid var(--color,var(--line));border-radius:4px;display:flex;align-items:center;justify-content:center}
.inv-slot .tower-icon{width:34px;height:34px}
.inv-slot.empty{border:1px dashed var(--line);color:var(--muted)}
.inv-slot.empty svg{width:16px;height:16px}
.inv-slot.on,.inv-cell.on{background:#233a5c;border-color:var(--accent);border-bottom-color:var(--color)}
.inv-detail{max-height:36dvh;overflow-y:auto;scrollbar-width:thin;padding:10px 18px 12px;border-bottom:1px solid var(--line);flex-shrink:0}
.inv-long{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:8px}
.inv-level{padding:8px 0;border-top:1px solid var(--line)}
.inv-level-head{display:flex;justify-content:space-between;gap:10px;font-size:12px}
.inv-level-head strong span{font-weight:600;color:var(--muted);margin-left:4px}
.inv-level-stats{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:11px;color:var(--muted);margin-top:4px}
.inv-level-stats b{color:var(--text);font-weight:600}
.inv-camo{color:var(--accent)}
.inv-level-meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--muted);padding-top:8px;border-top:1px solid var(--line)}
.inv-level-meta b{color:var(--text);font-weight:600}
.inventory .inv-list{flex:1;padding:14px 18px 22px}
.inv-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.inv-cell{position:relative;flex-direction:column;justify-content:flex-end;gap:0;height:80px;min-height:0;padding:4px 2px 5px;background:var(--panel);border:1px solid var(--line);border-bottom:3px solid var(--color);overflow:hidden}
.inv-cell .tower-icon{position:absolute;left:50%;top:6px;width:50px;height:50px;transform:translateX(-50%)}
.inv-name{position:relative;max-width:100%;font-size:11px;font-weight:800;color:var(--text);-webkit-text-stroke:3px rgba(0,0,0,.6);paint-order:stroke fill;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:14px}
.inv-cell.locked .tower-icon{opacity:.35;filter:grayscale(.7)}
.inv-cell.locked .inv-name{color:var(--muted)}
.inv-badge{position:absolute;top:4px;right:4px;display:flex;color:var(--muted)}
.inv-badge svg{width:14px;height:14px}
.inv-badge.eq{color:var(--accent)}
/* 3.4b: the selected-tower box is a square (same height as before) */
.inv-pick .inv-hero{width:128px;align-self:center}
/* 3.4: in-battle tray: bigger art, price on a dark fade along the bottom */
.battle-footer .slot{position:relative;padding:0;justify-content:flex-start}
.battle-footer .slot .tower-icon{width:54px;height:54px;margin-top:3px}
.battle-footer .slot .price{position:absolute;left:0;right:0;bottom:0;padding:13px 2px 3px;line-height:13px;text-align:center;background:linear-gradient(to top,rgba(0,0,0,.92) 35%,rgba(0,0,0,0))}
@media(max-height:700px){.battle-footer .slot .tower-icon{width:48px;height:48px;margin-top:2px}}
/* 3.5 */
.enemy-stats .cash-stat{color:var(--cash)}.enemy-stats .cash-stat.off{color:var(--muted)}
/* 3.7 compact battle UI ---------------------------------------------------- */
.battle .battle-hud{height:48px;padding:4px 6px;gap:4px;position:relative}
.battle .battle-hud button{height:40px;min-height:40px;width:40px;min-width:40px}
.hud-stats{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-evenly;gap:4px}
.battle-hud .hud-item{flex:0 1 auto;min-width:0;display:flex;align-items:baseline;justify-content:center;gap:4px;font-size:15px;color:var(--text);overflow:hidden}
.battle-hud .hud-item i{font-style:normal;font-size:11px;font-weight:600;color:var(--muted);flex-shrink:0}
.battle-hud .hud-item b{font-weight:750;overflow:hidden;text-overflow:ellipsis}
.battle-hud .hud-item.health b{color:var(--red)}
.battle-hud .hud-item.money b{color:var(--cash)}
.battle-hud .hud-item b.full{color:var(--red)}
.battle-hud .progress{position:absolute;left:0;bottom:0;height:2px;background:var(--accent);transition:width .15s linear}
#hud-gain{position:absolute;right:52px;top:calc(100% + 6px);z-index:4;font-style:normal;font-size:12px;font-weight:750;color:var(--cash);padding:3px 7px;border-radius:4px;background:#141414e8;opacity:0;transform:translateY(-4px);transition:opacity .2s,transform .2s;pointer-events:none}
#hud-gain.on{opacity:1;transform:none}
.battle .battle-footer{position:relative;overflow:visible;padding:6px 8px 8px}
#battle-slots{overflow:hidden}
.fold-tab{position:absolute;right:8px;top:-25px;z-index:4;width:46px;min-width:46px;height:25px;min-height:25px;padding:0;border:1px solid var(--line);border-bottom:0;border-radius:6px 6px 0 0;background:var(--bg);color:var(--muted)}
.fold-tab svg.icon{width:18px;height:18px;transition:transform .15s}
.battle-footer.folded .fold-tab svg.icon{transform:rotate(180deg)}
.battle-footer .tower-controls,.battle-footer .tower-controls:has(.next-upgrade){height:122px;min-height:0;max-height:none;margin-bottom:8px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.battle-footer.folded .tower-controls,.battle-footer.folded .tower-controls:has(.next-upgrade){height:44px}
.panel-desc{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.battle-footer.folded .panel-desc{display:none}
.panel-row{flex:0 0 44px;height:44px;min-height:0}
.battle-footer .tower-heading{height:24px;min-height:24px;flex:0 0 24px}
.battle-footer .tower-heading button{height:24px;min-height:24px;width:32px;min-width:32px;padding:2px}
.battle-footer .tower-heading .cash{font-size:12px;font-weight:700;color:var(--cash)}
.battle-footer .stats{height:20px;min-height:0;flex:0 0 20px;font-size:11px}
.battle-footer .stats .inv-camo{color:var(--accent)}
.battle-footer .next-upgrade{height:28px;min-height:0;flex:0 0 28px;margin:0;font-size:10.5px;line-height:14px;color:var(--muted);overflow:hidden}
.battle-footer .next-upgrade .upgrade-name{color:var(--accent);font-weight:650;margin-right:6px}
.battle-footer .actions{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:5px}
.battle-footer .actions.two{grid-template-columns:1.6fr 1fr}
.battle-footer .placement-actions{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:6px}
.battle-footer .placement-actions button{min-height:0;height:44px}
.place-warn{flex:0 0 28px;font-size:11px;line-height:28px;color:var(--red);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.enc-total{font-size:12px;font-variant-numeric:tabular-nums}
.enc-legend{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:18px;gap:3px 14px;align-content:start;padding-top:4px;overflow-y:auto;scrollbar-width:none}
.enc-item{display:flex;align-items:center;gap:6px;min-width:0;font-size:11px;color:var(--muted)}
.enc-item svg{width:16px;height:16px;flex-shrink:0}
.enc-item span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.enc-item b{color:var(--text);font-weight:650;font-variant-numeric:tabular-nums}
.enc-none{font-size:11px;color:var(--muted)}
.tower-controls[data-mode=standby] .enc-row{display:none}
.battle-footer.folded .tower-controls[data-mode=standby] .enc-row{display:block}
.enc-row{overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.enc-row .enemy-strip{height:44px;padding:0 2px;gap:14px}
.enc-row .enc-none{line-height:44px}
/* skills */
.skill-bar{position:absolute;left:8px;bottom:8px;z-index:3;display:flex;gap:6px}
.skill-bar:empty{display:none}
.skill-bar button.skill{position:relative;overflow:hidden;width:52px;min-width:52px;height:52px;min-height:52px;padding:0;border:0;border-radius:6px;display:block;color:var(--color);background:#141414f0;box-shadow:inset 0 0 0 1px #333333,0 4px 12px #00000099}
.skill-bar button.skill:disabled{opacity:1}
.skill-fill{position:absolute;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--color) 16%,transparent)}
.skill-bar button.skill.ready{background:color-mix(in srgb,var(--color) 24%,#141414);box-shadow:inset 0 0 0 2px var(--color),0 4px 12px #00000099}
.skill-bar button.skill.ready .skill-fill{display:none}
.skill-bar button.skill.ready::before{content:"";position:absolute;width:44px;height:44px;right:-16px;bottom:-18px;border-radius:50%;background:color-mix(in srgb,var(--color) 22%,transparent)}
.skill-glyph{position:absolute;left:50%;top:7px;width:25px;height:25px;margin-left:-12.5px}
.skill-bar button.skill.cooling .skill-glyph{top:50%;margin-top:-12.5px;opacity:.3}
.skill-count{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-size:12px;font-weight:800;color:#f2f2f2;font-variant-numeric:tabular-nums}
.skill-wait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;color:#f2f2f2;font-variant-numeric:tabular-nums}
.skill-bar button.skill.on{outline:2px solid var(--color);outline-offset:2px}
.battle-footer .tower-controls,.battle-footer .tower-controls:has(.next-upgrade){height:126px}
.battle-footer.folded .tower-controls,.battle-footer.folded .tower-controls:has(.next-upgrade){height:44px}
.battle-footer .tower-heading{height:28px;min-height:28px;flex:0 0 28px}
.battle-footer .tower-heading button{height:28px;min-height:28px}
.battle-footer .tower-heading .ability{width:auto;min-width:0}
/* 3.9.1 */
.inv-hero,.inv-slot,.inv-cell,.slot,.tower-face{overflow:hidden}

/* 3.9.3 */
html,html body{font-family:"WQY Zen Hei Game",system-ui,-apple-system,"Noto Sans KR",sans-serif;font-synthesis:none}
button,input,select,textarea{font-family:inherit}
h1,h2,.wallet,.home-menu button,.home-menu button span,.inv-title strong,.dialog-actions button,.setting-actions button,.codex-tabs button,.skip-offer button{font-weight:400}
/* 3.9.4 squares */
.inventory .inv-top{display:flex;flex-direction:column;gap:12px}
.inventory .inv-loadout{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:none;gap:6px;height:auto}
.inventory .inv-slot{aspect-ratio:1/1;height:auto;min-height:0}
.inventory .inv-slot .tower-icon{width:66%;height:66%}
.inventory .inv-pick{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;column-gap:12px;row-gap:8px}
.inventory .inv-pick .inv-hero{grid-column:1;grid-row:1/4;width:auto;height:auto;aspect-ratio:1/1;align-self:start}
.inventory .inv-pick .inv-hero .inv-hero-art{width:72%;height:72%}
.inventory .inv-title,.inventory .inv-desc,.inventory .inv-actions{grid-column:2;min-width:0}
.inventory .inv-title{align-items:baseline}
.inventory .inv-desc{min-height:0}
.inventory .inv-actions{align-self:end}
.inventory .inv-cell{height:auto;aspect-ratio:1/1}
.inventory .inv-cell .tower-icon{width:58%;height:58%;top:9%}
.home-bottom .slot{aspect-ratio:1/1;height:auto;min-height:0;padding:4px 1px}
.home-bottom .slot .tower-icon{width:46%;height:46%}
/* 3.9.4 phone: dragging a tower up out of the tray was taken by the browser as a
   scroll (pointercancel), so the drag never reached the map */
#battle-slots,#battle-slots .slot{touch-action:none}
/* ===== 4.0 dark Luna ====================================================== */
html,body{background:var(--desk)}
#app{background:var(--bg)}
.screen{background:var(--bg)}
.muted{color:var(--muted)}
/* buttons */
button{border:1px solid #000;border-radius:3px;background:var(--btn);color:var(--text);font-weight:600;box-shadow:inset 0 1px 0 #6e6e6e}
button:active:not(:disabled){background:var(--btn-down);box-shadow:inset 0 1px 2px #000}
button:disabled{opacity:1;color:#6e6e6e;background:linear-gradient(180deg,#3c3c3c,#333);box-shadow:none}
button:focus-visible{outline:1px dotted #fff;outline-offset:-4px}
button.primary,.inv-act.equip-button,button.equip-button{background:var(--go);border-color:#0e3e0e;color:#fff;font-style:italic;font-weight:700;text-shadow:1px 1px #144414;box-shadow:inset 0 1px 0 #8fd08f}
button.primary:disabled{background:linear-gradient(180deg,#3c4a3c,#2e3a2e);color:#7a8a7a;text-shadow:none;box-shadow:none}
button.danger{color:var(--red)}
button.unequip-button,.inv-act.unequip-button{background:var(--stop);border-color:#4a1408;color:#fff;box-shadow:inset 0 1px 0 #f0a090}
button.flat{background:transparent;border-color:transparent;box-shadow:none}
/* title bars */
.bar.xp-title{height:34px;min-height:34px;padding:0 4px 0 10px;gap:6px;background:var(--title);border:0;border-radius:7px 7px 0 0;color:#fff;justify-content:flex-start}

 el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2400);}
// The notice box on the board: one line for announcements, one for brief messages (errors).
const noticeTimers={};
function notice(html,line='main',ms=6000){const box=$('#board-notice'),el=$(`#notice-${line}`);if(!box||!el)return false;el.innerHTML=html;el.hidden=false;box.hidden=false;
 box.parentElement.style.setProperty('--nh',`${box.offsetHeight}px`);clearTimeout(noticeTimers[line]);
 noticeTimers[line]=setTimeout(()=>{el.hidden=true;if(box.isConnected){box.hidden=[...box.children].every(c=>c.hidden);box.parentElement.style.setProperty('--nh',`${box.offsetHeight}px`);}},ms);return true;}

let sfxBuffer=null,sfxState=0,lastLeak=-9;
function audioReady(){if(!profile.settings.sound)return null;audioContext??=new(window.AudioContext||window.webkitAudioContext)();if(audioContext.state==='suspended')audioContext.resume();
 if(!sfxState){sfxState=1;try{const bin=atob(SFX_DATA),buf=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)buf[i]=bin.charCodeAt(i);audioContext.decodeAudioData(buf.buffer,b=>{sfxBuffer=b;sfxState=2;},()=>{sfxState=3;});}catch{sfxState=3;}}
 return audioContext;}
function sound(type='click'){if(!type)return;try{const ac=audioReady();if(!ac)return;const now=ac.currentTime;
 if(type==='leak'){if(now-lastLeak<1.6)return;lastLeak=now;}
 if(sfxBuffer){const clip=SFX[type]??SFX.click,src=ac.createBufferSource(),gain=ac.createGain();src.buffer=sfxBuffer;gain.gain.value=.7;src.connect(gain);gain.connect(ac.destination);src.start(now,clip[0],clip[1]);return;}
 // the sprite could not be decoded here: a quiet tick for presses, nothing else
 if(sfxState!==3||(type!=='click'&&type!=='tick'))return;const o=ac.createOscillator(),gain=ac.createGain();o.type='triangle';o.frequency.setValueAtTime(1400,now);o.frequency.exponentialRampToValueAtTime(500,now+.03);gain.gain.setValueAtTime(.03,now);gain.gain.exponentialRampToValueAtTime(.001,now+.05);o.connect(gain);gain.connect(ac.destination);o.start(now);o.stop(now+.06);}catch{}}
function warn(text){toast(text);sound('error');}
// What a press sounds like. Some actions make their own sound once they succeed (or open a window).
const QUIET_PRESS=new Set(['dialog-x','pause','upgrade','sell','confirm-place','next-wave','skip-wave','confirm-buy','mod-cell','mod-sell','confirm-sell-all','mod-install','mod-pull','confirm-expand','mod-remove']);
function pressSound(a,el,id){if(a==='close-dialog')return 'close';if(QUIET_PRESS.has(a))return null;if(el.classList.contains('xp-x'))return 'close';
 if(['settings','codex','battle-settings','balance','modules'].includes(a)||(a==='inventory'&&!TOWER[id]))return 'open';
 if(['menu','speed','rotate','cycle-target','inv-more','skip-dismiss','build','mod-rotate','mod-count-dec','mod-count-inc','mod-count-cycle'].includes(a))return 'tick';
 if(['toggle-setting','menu-toggle','equip','unequip','swap'].includes(a))return 'switch';return 'click';}
// Get the audio ready on the first touch, so the first press already has its sound.
for(const ev of ['pointerdown','keydown'])document.addEventListener(ev,()=>{try{audioReady();}catch{}},{capture:true,passive:true});
function vibrate(ms=8){if(profile.settings.vibration)navigator.vibrate?.(ms);}
function button(action,label,cls='',extra=''){return `<button class="${cls}" data-action="${action}" ${extra}>${label}</button>`;}
function header(title,back='home',extra=''){return `<header class="bar xp-title"><h2>${title}</h2>${extra&&extra!=='<span></span>'?`<span class="xp-extra">${extra}</span>`:''}${button(back,'<i>×</i>','xp-x','aria-label="닫기"')}</header>`;}
function statusBar(){return `<footer class="xp-status"><span class="xp-cell grow">준비</span><span class="xp-cell wallet">${icon('coin')}${wallet()}</span></footer>`;}
function setScreen(name,html){if(name!=='battle'){placing=null;dragPointer=null;}screen=name;app.innerHTML=`<main class="screen ${name}">${html}${name==='battle'?'':statusBar()}</main>`;controlSignature='';backNavigation?.sync?.();}
function slots(loadout=profile.loadout,battle=false,removable=false){return `<div class="loadout">${loadout.map((id,i)=>{const t=TOWER[id];return t?button(battle?'build':removable?'unequip':'inventory',`${towerIcon(id)}${battle?`<span class="price" data-price="${id}">${money(game.buildCost(id))}</span>`:`<span>${t.name}</span>`}`,`slot ${removable?'removable':''} ${battle&&placing?.kind===id?'active':''}`,`style="--color:${t.color}" data-kind="${id}" aria-label="${t.name}${battle?' 배치 '+t.cost+'원':removable?' 해제':''}" ${battle&&(!game.canBuild(id)||!game.canAfford(game.buildCost(id)))?'disabled':''}`):button(battle?'noop':'inventory',icon('plus'),'slot empty',`aria-label="빈 슬롯 ${i+1}" ${battle?'disabled':''}`);}).join('')}</div>`;}
function home(){if(game&&!game.ended){game.paused=true;savedRun=game.snapshot();}save();setScreen('home',`<header class="bar xp-title home-top"><h2>그리드 타워 디펜스</h2>${button('codex',`${icon('book')}<span>적 도감</span>`,'xp-tool','aria-label="적 도감"')}</header><div class="home-launcher"><div class="home-banner">${BANNER?`<img class="home-banner-map" src="${BANNER}" alt="">`:''}<div class="home-banner-text"><img class="home-mark" src="${logoImage()}" alt="" aria-hidden="true"><div><h1>그리드 타워 디펜스</h1><p>버전 4.1</p></div></div></div><fieldset class="xp-group home-menu">${button('play',`${icon('play')}<span>플레이</span>`,'primary home-start')}<div class="home-sub">${button('inventory',`${icon('inventory')}<span>인벤토리</span>`)}${button('modules',`${icon('module')}<span>모듈</span>`)}${button('settings',`${icon('settings')}<span>설정</span>`)}</div></fieldset><div class="home-gap"></div><fieldset class="xp-group home-bottom">${slots()}</fieldset></div>`);}
function openDialog(title,body,buttons,kind='dialog'){if(kind!=='result')sound(kind.startsWith('msg')?'question':'open');dialogKind=kind;modal.innerHTML=`<div class="overlay"><section class="dialog" role="dialog" aria-modal="true" aria-label="${title}"><h2><span>${title}</span>${button('dialog-x','<i>×</i>','xp-x','aria-label="닫기"')}</h2>${body}<div class="dialog-actions">${buttons}</div></section></div>`;modal.querySelector('.dialog').classList.toggle('msgbox',kind.startsWith('msg'));(modal.querySelector('.xp-yes')??modal.querySelector('.dialog-actions button')??modal.querySelector('button'))?.focus();backNavigation?.sync?.();}

function msgBox(title,text,yes,extra='',kind='msg'){openDialog(title,`<div class="xp-msg">${QUESTION}<div>${text}</div></div>`,button(yes,'<span>예(<u>Y</u>)</span>','xp-yes',extra)+button('close-dialog','<span>아니요(<u>N</u>)</span>','xp-no'),kind);}

// Small static picture of the map for the menus.
let BANNER='',LOGO='';
function logoImage(){if(LOGO)return LOGO;try{const c=document.createElement('canvas');c.width=c.height=20;const g=c.getContext('2d');
 g.strokeStyle='#7db2ff';g.lineWidth=1;for(const v of [1.5,7.5,12.5,18.5]){g.beginPath();g.moveTo(v,1.5);g.lineTo(v,18.5);g.stroke();g.beginPath();g.moveTo(1.5,v);g.lineTo(18.5,v);g.stroke();}
 g.fillStyle='#000';g.fillRect(7,8,6,5);g.fillStyle='#c0c0c0';g.fillRect(8,9,4,3);
 g.strokeStyle='#fff';g.lineWidth=1.4;g.beginPath();g.moveTo(10,9);g.lineTo(10,3.5);g.stroke();
 g.fillStyle='#ff4040';g.beginPath();g.arc(4.5,15.5,1.8,0,Math.PI*2);g.fill();
 LOGO=c.toDataURL();}catch{}return LOGO;}
function makeBanner(){return new Promise(done=>{try{const svg=mapSVG(MAPS[0]),vb=svg.match(/viewBox="([^"]+)"/)[1].split(' ').map(Number),w=150,h=Math.round(w*vb[3]/vb[2]);const img=new Image();img.onload=()=>{try{const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);BANNER=c.toDataURL();}catch{}done();};img.onerror=()=>done();img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg.replace('<svg ',`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" `));}catch{done();}});}
function mapSVG(map){const pts=a=>a.map(p=>p.join(',')).join(' '),road=map.points.map(([x,y])=>`${x+.5},${y+.5}`).join(' '),tone={cliff:'#3d3d3d','cliff-block':'#3d3d3d',water:'#14313d',rock:'#383838',pallet:'#383838'},end=map.points.at(-1);
 return `<svg viewBox="0 ${map.viewTop} ${COLS} ${ROWS-map.viewTop}" aria-hidden="true"><rect x="-10" y="-10" width="${COLS+20}" height="${ROWS+20}" fill="#000000"/><polygon points="${pts(map.ground)}" fill="#202020" stroke="#2e2e2e" stroke-width=".6"/>${map.features.map(f=>f.circle?`<circle cx="${f.circle[0]}" cy="${f.circle[1]}" r="${f.circle[2]}" fill="#333333"/>`:`<polygon points="${pts(f.poly)}" fill="${tone[f.kind]??'#333333'}"/>`).join('')}<polyline points="${road}" fill="none" stroke="#4f4f4f" stroke-width="3" stroke-linejoin="miter"/><polyline points="${road}" fill="none" stroke="#363636" stroke-width="2.6" stroke-linejoin="miter"/><polyline points="${road}" fill="none" stroke="${map.color}" stroke-width=".4" stroke-dasharray="1.2 2.4"/><circle cx="3" cy="${map.points[1][1]+.5}" r="1.8" fill="${map.color}"/><rect x="${end[0]-1.5}" y="${end[1]-2.5}" width="4" height="4" fill="none" stroke="#ea7f90" stroke-width=".7"/></svg>`;}

function maps(){closeDialog();setScreen('maps',header('맵 선택')+`<div class="scroll map-list">${MAPS.map(m=>button('choose-map',`<div class="map-thumb">${mapSVG(m,true)}</div><div class="map-label"><div><h3>${m.name}</h3><div class="muted">${m.difficulty} · ${makePath(m.points).length-1}칸</div></div><span class="rate">×${m.mult.toFixed(2)}</span></div>`,'map-card',`data-map="${m.id}"`)).join('')}</div>`);}
function difficulty(map){chosenMap=map;setScreen('difficulty',header(map.name,MAPS.length>1?'maps':'home')+`<div class="scroll"><div class="difficulty-preview">${BANNER?`<img src="${BANNER}" alt="">`:mapSVG(map)}</div>${Object.entries(DIFFICULTIES).map(([id,d])=>{const first=!profile.clears[`${map.id}:${id}`],reward=Math.round(d.reward*map.mult*100*(first?1.2:1));return button('start-game',`<div><strong>${d.name}</strong><p>${d.count} 웨이브</p></div><div><div class="reward">${icon('coin')}<span>${money(reward)}</span></div><div class="first-clear">${first?'첫 클리어 +20%':'클리어 완료'}</div></div>`,'difficulty-card',`data-difficulty="${id}"`);}).join('')}</div>`);}
let invSel=null,invMore=false,invTap={kind:null,at:0};
const fmtN=v=>String(+(+v).toFixed(2));
// One line of key numbers for a tower at a level (lobby only, no buffs).
function levelLine(id,lv){const d=TOWER[id],i=lv-1,s=[],sec=v=>fmtN(v)+'초';
 switch(id){

  case'mod-cancel':modSel=modSel?.mode==='placing'&&spareCount(modSel.id)>0?{mode:'pick',id:modSel.id}:null;refreshModules();break;
  case'mod-move':if(modSel?.mode==='placed'){const p=st.placed.splice(modSel.index,1)[0];save();startPlacing(p.id,p.r,{x:p.x,y:p.y});}break;
  case'mod-remove':if(modSel?.mode==='placed'){const p=st.placed.splice(modSel.index,1)[0];sound('switch');save();modSel={mode:'pick',id:p.id};refreshModules();}break;
  case'mod-count-dec':pullCount=Math.max(1,pullCount-1);refreshModules();break;
  case'mod-count-inc':pullCount=Math.min(100,pullCount+1);refreshModules();break;
  case'mod-count-cycle':pullCount=PULL_STEPS.find(n=>n>pullCount)??1;refreshModules();break;
  case'mod-pull':pullModules();break;
  case'confirm-expand':expandCell(Number(el.dataset.i));break;
  case'mod-effects':moduleEffectsDialog();break;
 }}

function guide(){openDialog('조작 안내',`<p>하단 타워를 끌어 지도에 놓기 → 회전 → 설치<br>막힌 곳에 놓으면 가까운 빈자리에 붙습니다<br>배치한 타워 선택 → 강화·타겟·판매<br>한 손가락으로 이동, 두 손가락으로 확대<br>상단 배속 1× → 2× → 0×(일시정지)<br>지도 위 ‘시작’으로 전투 시작<br>적이 모두 나온 뒤에도 대기 시간이 넉넉하면 지도 위에 ‘스킵 할까요?’가 뜹니다<br>스킵은 한 번에 한 웨이브만 · 버튼이 다 차오른 뒤에 눌립니다(차오르는 중에 누르면 처음부터)<br>하단 패널은 오른쪽 위 화살표로 접고 폅니다<br>커맨더 스킬: 지도 왼쪽 아래 버튼(준비된 커맨더 중 하나) 또는 커맨더를 선택해 콜 투 암즈<br>전체 ${PLACEMENT_LIMIT}개 · 농장 ${TOWER.farm.placementLimit}개 · 정비소 ${TOWER.spawner.placementLimit}개 · 로봇 ${TOWER.robot.placementLimit}개까지 배치<br>제목줄 ×, 게임 메뉴 또는 뒤로 가기 → 일시정지 메뉴<br>보기 메뉴: 확대·축소·패널·레벨 표시·비행기 숨기기<br>메뉴·설정·안내를 열거나 다른 앱으로 나가도 일시정지<br>멈추면 지도 위에 ‘계속’이 뜹니다<br>마우스: 타워를 고른 뒤 지도를 더블클릭하면 바로 설치 · 오른쪽 클릭 취소<br>키보드: 1~5 타워 · Enter 설치 확인/강화 · Backspace·Delete 판매<br>Space 배속 · N 다음 웨이브 · R 회전 · Q 스킬 · T 타겟 · F 패널 접기<br>+ - 확대·축소 · 0 전체 보기 · Esc 메뉴<br><br>웨이브를 버티면 타워 해금용 크레딧을 얻습니다.<br>실제 피해 1당 캐시 1을 얻습니다(소환·분열된 적은 0, 큰 보스는 50~70%).<br>에이전트는 Lv.2부터 피해 수입이 ${Math.round(TOWER.agent.incomeBonus[1]*100)}%, Lv.3은 ${Math.round(TOWER.agent.incomeBonus[2]*100)}% 더 높습니다.<br>웨이브 종료 시 인터미션에서 캐시를 받습니다.<br>웨이브의 적을 모두 잡으면 인터미션 뒤 다음 웨이브가 옵니다.<br>다 못 잡아도 대기 시간이 끝나면 다음 웨이브가 옵니다.<br>스킵해도 웨이브 보상은 그대로 받고, 추가 보상은 없습니다.<br>인터미션은 ${ECONOMY.intermissionSeconds}초이며 남은 적·타워·농장은 계속 움직입니다.<br>한 웨이브를 기준 시간보다 오래 끌면 농장 생산이 점점 느려집니다.<br>적이 출구에 도착하면 남은 체력과 보호막만큼 기지에 피해를 줍니다.<br><br>히든 감지: ${TOWERS.filter(t=>t.camoLevel&&t.id!=='plane').sort((a,b)=>a.camoLevel-b.camoLevel).map(t=>`${t.name} Lv.${t.camoLevel}`).join(' · ')}<br>비행기 Lv.3부터 궤도 안의 히든 해제<br>히든도 차량과 충돌합니다.<br>노란 보호막이 남으면 정지·화상 감속에 면역입니다.<br>보호막 피해도 1당 캐시 1을 얻습니다.<br>보스의 마비 예고는 공격 효과를 꺼도 표시됩니다.</p>`,button('close-dialog','확인','primary'));}

function towerStats(t){const d=TOWER[t.kind],s=game.stat(t),i=t.level-1,km=game.km(t.kind),dm=v=>Math.round(v*km.dmg*10)/10;if(t.kind==='farm')return `수입 <b>${money(Math.round(d.income[i]*100*km.income))}</b><span>주기 <b>${s.period}초</b></span><span>효율 <b>${Math.round(game.farmEfficiency()*100)}%</b></span><span>누적 <b>${money((t.produced??0)*100)}</b></span>`;if(t.kind==='flame')return `화상 <b>${d.burn[i]}/${d.burnInterval}초</b><span>지속 <b>${d.burnDuration[i]}초</b></span><span>감속 <b>20%</b></span><span>사거리 <b>${(s.range*game.buffs(t).range).toFixed(1)}</b></span>`;if(t.kind==='commander')return `공속 <b>+${Math.round((d.boost[i]-1+(t.active>0?d.activeFire[i]-1:0))*100)}%</b><span>사거리 <b>+${Math.round((d.rangeBoost[i]-1+(t.active>0?d.activeRange[i]-1:0))*100)}%</b></span><span>범위 <b>${s.range}</b></span>`;if(d.hp)return `차량 HP <b>${Math.round(d.hp[i]*km.vhp).toLocaleString()}</b><span>출격 <b>${s.period}초</b></span><span>다음 <b id="launch-countdown">${Math.ceil(Math.max(0,t.cooldown))}초</b></span>`;const buff=game.buffs(t);return `<span>피해 <b>${t.kind==='shotgun'?`${dm(s.damage)}+${dm(d.spreadDamage[i])}×${d.extra[i]}`:t.kind==='laser'?`${dm(s.damage)}→${Math.round(dm(s.damage)*d.cap[i])}`:dm(s.damage)+(d.burst?'×'+d.burst[i]:'')}</b></span><span>사거리 <b>${(s.range*buff.range).toFixed(1)}</b></span><span>${d.burst?'재장전':t.kind==='laser'?'틱':'주기'} <b>${(s.period/buff.fire).toFixed(2)}초</b></span>${game.camoLevel(t.kind)<=t.level?'<span style="color:var(--accent)">히든</span>':''}`;}

 if(force||key!==controlSignature){controlSignature=key;const box=$('#tower-controls');box.dataset.mode=t?'tower':placing&&TOWER[placing.kind]?'place':'standby';box.innerHTML=t?selectedPanelHTML(t):placing&&TOWER[placing.kind]?placingPanelHTML():standbyHTML();}
 const confirm=$('#confirm-place-button');if(confirm){const p=placing,pend=p?.mode==='pending';confirm.disabled=!pend||!p.ok||!game.canPlace(p.kind,p.x,p.y,p.r)||!game.canAfford(game.buildCost(p.kind))||!game.canBuild(p.kind);$('#rotate-button').disabled=!pend||!TOWER[p.kind].turns;const hint=$('#placement-hint');if(hint){const msg=placementHint();if(hint.textContent!==msg)hint.textContent=msg;}}
 if(t){const stats=$('#selected-stats');if(stats)stats.innerHTML=towerStats(t);const launch=$('#launch-countdown');if(launch)launch.textContent=`${Math.ceil(Math.max(0,t.cooldown))}초`;const up=$('#upgrade-button');if(up)up.disabled=t.level>=maxLevel(t.kind)||t.disabled>0||!game.canAfford(game.upgradeCost(t));const ability=$('#ability-button');if(ability){const txt=t.active>0?`콜 투 암즈 ${Math.ceil(t.active)}초`:t.abilityCooldown>0?`${Math.ceil(t.abilityCooldown)}초`:'콜 투 암즈';if(ability.textContent!==txt)ability.textContent=txt;ability.disabled=t.abilityCooldown>0||game.paused||t.disabled>0;}}

// Idle panel: the enemies still to beat (names when open, a strip when folded).

function updateEncounter(){const legend=$('#enc-legend'),strip=$('#enc-strip');if(!legend||!strip)return;const list=remainingEnemies(game),sig=encSig(list);if(legend.dataset.sig===sig)return;legend.dataset.sig=strip.dataset.sig=sig;legend.innerHTML=encLegendHTML(list);const sc=strip.parentElement.scrollLeft;strip.innerHTML=encStripHTML(list);strip.parentElement.scrollLeft=sc;$('#enc-total').textContent=list.reduce((a,x)=>a+x.count,0);}
// Skills: one square button per kind at the map's lower left. ×N = ready towers;
// none ready = seconds until the soonest one. A press fires a random ready tower.
const SKILLS={commander:{name:'콜 투 암즈',glyph:'<path d="M3.5 10v4h3l7.5 4.5v-13L6.5 10h-3Z"/><path d="M17.5 9.2a4 4 0 0 1 0 5.6"/><path d="M20 6.8a7.5 7.5 0 0 1 0 10.4"/>',has:t=>t.level>=3,cooldown:()=>TOWER.commander.activeCooldown}};
function skillReady(t){return t.abilityCooldown<=0&&!(t.disabled>0);}
function skillState(){const out=[];for(const [kind,s] of Object.entries(SKILLS)){const list=game.towers.filter(t=>t.kind===kind&&s.has(t));if(!list.length)continue;const ready=list.filter(skillReady).length,wait=ready?0:Math.min(...list.map(t=>Math.max(t.abilityCooldown,t.disabled??0)));out.push({kind,ready,wait,active:list.some(t=>t.active>0)});}return out;}
function updateSkills(){const bar=$('#skill-bar');if(!bar)return;const off=game.paused||!game.started||game.ended,st=skillState(),sig=st.map(x=>[x.kind,x.ready,Math.ceil(x.wait),x.active].join(':')).join(',')+':'+off;if(bar.dataset.sig===sig)return;bar.dataset.sig=sig;
 bar.innerHTML=st.map(x=>{const s=SKILLS[x.kind],w=Math.ceil(x.wait),p=x.ready?100:Math.round((1-x.wait/s.cooldown())*100);return button('skill',`<i class="skill-fill" style="height:${Math.max(0,Math.min(100,p))}%"></i><svg class="skill-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${s.glyph}</svg>${x.ready?`<b class="skill-count">×${x.ready}</b>`:`<b class="skill-wait">${w}</b>`}`,`skill ${x.ready?'ready':'cooling'}${x.active?' on':''}`,`data-kind="${x.kind}" style="--color:${TOWER[x.kind].color}" aria-label="${s.name} ${x.ready?x.ready+'개 준비':w+'초 남음'}" ${!x.ready||off?'disabled':''}`);}).join('');}
function toggleFold(){const open=profile.settings.panelOpen===false;profile.settings.panelOpen=open;save();const f=$('.battle-footer');if(!f)return;f.classList.toggle('folded',!open);const b=$('#fold-button');if(b){b.setAttribute('aria-expanded',open);b.setAttribute('aria-label',open?'설명 패널 접기':'설명 패널 펴기');}}
function updateBattleUI(){if(screen!=='battle')return;$('#boss-info').innerHTML=bossStatusHTML(game);const n=game.placementCount(),pl=$('#hud-placement');pl.textContent=`${n}/${game.placementLimit()}`;pl.classList.toggle('full',n>=game.placementLimit());$('#hud-wave').textContent=Math.max(1,game.wave);$('#hud-health').textContent=game.cheats.lives?'∞':game.health;$('#hud-cash').textContent=game.cheats.cash?'∞':money(game.cash);const gain=$('#hud-gain'),won=(game.phase==='intermission'||performance.now()<gainUntil)&&game.lastWaveCash>0;if(gain){const txt=won?`+${money(game.lastWaveCash*100)}`:'';if(gain.textContent!==txt)gain.textContent=txt;gain.classList.toggle('on',won);}const timer=$('#wave-timer');if(timer){let h='';if(game.started&&!game.ended){if(game.wave>=game.config.count)h='최종 웨이브';else{const t=Math.ceil(nextWaveIn());h=`다음 웨이브<b>${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}</b>`;}}if(timer.innerHTML!==h)timer.innerHTML=h;}$('#speed-button').textContent=`${game.started?game.playbackRate:game.speed}×`;for(const el of $('#battle-slots').querySelectorAll('[data-kind]')){const id=el.dataset.kind,d=TOWER[id],blocked=game.placementBlock(id);el.disabled=!!blocked||!game.canAfford(game.buildCost(id));el.setAttribute('aria-label',`${d.name} 배치 ${blocked||d.cost+'원'}`);const price=el.querySelector('[data-price]');if(price)price.textContent=blocked?'한도':money(game.buildCost(id));el.classList.toggle('active',placing?.kind===el.dataset.kind);}updateEncounter();updateSkills();updateOffer();renderControls();}
// Top-of-map prompt: the start button before the battle, then the skip offer.
// The skip offer hides while paused, and a fresh one ignores presses for OFFER_ARM ms
// (the button fills up meanwhile) so rapid taps cannot skip a wave by accident.
const OFFER_ARM=1000;
function offerMode(){return game.ended?'':!game.started?'start':game.paused?'resume':game.canSkip()&&!(skipDismissed?.g===game&&skipDismissed.w===game.wave)?'skip':'';}
// Time until the next wave arrives on its own: what is left of this wave plus the intermission.
function nextWaveIn(){return game.phase==='intermission'?game.intermissionTime:Math.max(0,game.waveDuration-game.waveTime)+game.intermissionSeconds();}
function updateOffer(){const el=$('#wave-offer');if(!el)return;const mode=offerMode(),key=mode&&`${mode}:${game.wave}`;
 if(el.dataset.key!==key){el.dataset.key=key;el.hidden=!mode;
  if(mode==='start')el.innerHTML=button('next-wave','<span>시작</span>','primary wide-cta','id="next-wave-button"');
  else if(mode==='resume')el.innerHTML=button('run','<span>계속</span>','primary wide-cta','id="resume-button"');
  else if(mode==='skip'){offerArmedAt=performance.now()+OFFER_ARM;el.innerHTML=`${button('skip-wave','<span>스킵 할까요?</span>','primary arming','id="skip-button"')}${button('skip-dismiss',icon('close'),'icon','aria-label="스킵 닫기"')}`;}
  else el.innerHTML='';}
}
function skipArmed(){return $('#wave-offer')?.dataset.key===`skip:${game.wave}`&&performance.now()>=offerArmedAt;}
// Pressing the button while it is still filling starts the fill over, so a burst of taps never gets through.
document.addEventListener('pointerdown',e=>{const b=e.target.closest?.('#skip-button');if(!b||performance.now()>=offerArmedAt)return;offerArmedAt=performance.now()+OFFER_ARM;b.classList.remove('arming');void b.offsetWidth;b.classList.add('arming');},true);
function drawBattle(){if(screen!=='battle'||!board||!game)return;const shown=placing&&(placing.mode==='pending'||placing.shown)?placing:null;board.draw(game,{selected,placing:shown,effects:profile.settings.effects,hidePlanes:profile.settings.hidePlanes,levelMode:profile.settings.levelMode,time:game.time});}
function mountBoard(){const cv=$('#board');board=createBoard(cv,game.map);boardObserver?.disconnect();boardObserver=new ResizeObserver(()=>{board.resize();drawBattle();});boardObserver.observe(cv);board.resize();bindBoard(cv);}
function boardPoint(e){const r=$('#board').getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top,e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom];}
// Clipping: a footprint that does not fit where it is aimed moves to the nearest spot that fits.
const CLIP=[];for(let dy=-9;dy<=9;dy++)for(let dx=-9;dx<=9;dx++){const d=Math.hypot(dx,dy);if(d<=9)CLIP.push([dx,dy,d]);}CLIP.sort((a,b)=>a[2]-b[2]);

 // keep the previous spot when it is about as close, so the ghost does not flicker between two gaps
 if(best&&prev?.ok&&prev.kind===kind&&prev.r===r&&game.canPlace(kind,prev.x,prev.y,r)&&Math.hypot(prev.x-tx,prev.y-ty)<=best.d+.8)return{kind,r,x:prev.x,y:prev.y,ok:true};
 return best?{kind,r,x:best.x,y:best.y,ok:true}:{kind,r,x:tx,y:ty,ok:false};}
function placeAtCenter(kind,r=0){const v=board.view(),[wx,wy]=board.toWorld(v.W/2,v.H/2);return{...clipAt(kind,wx,wy,r,null),mode:'pending'};}
// Touch lifts the ghost above the finger so the finger never hides it.
const liftPx=e=>e.pointerType==='mouse'?0:Math.max(56,Math.min(84,board.view().H*.11));
function placementHint(){if(!placing)return '';const block=game.placementBlock(placing.kind);if(block)return block;if(!game.canAfford(game.buildCost(placing.kind)))return '캐시가 부족합니다';return placing.mode!=='drag'&&!placing.ok?'놓을 자리가 없습니다 · 다른 곳을 누르세요':'';}
function towerAt(wx,wy){const x=Math.floor(wx),y=Math.floor(wy);if(x>=0&&y>=0&&x<COLS&&y<ROWS){const id=game.occ[y*COLS+x];if(id)return game.towers.find(t=>t.id===id);}
 const pad=14/board.view().scale;let best=null,bd=Infinity;for(const t of game.towers){const d=Math.hypot(Math.max(t.col-wx,0,wx-t.col-t.w),Math.max(t.row-wy,0,wy-t.row-t.h));if(d<=pad&&d<bd){bd=d;best=t;}}return best;}
function overGhost(wx,wy){if(placing?.mode!=='pending')return false;const[w,h]=dims(placing.kind,placing.r),pad=Math.max(1,22/board.view().scale);return wx>=placing.x-pad&&wx<=placing.x+w+pad&&wy>=placing.y-pad&&wy<=placing.y+h+pad;}
function tapBoard(wx,wy){if(!game||game.ended)return;if(placing?.mode==='pending'){placing={...clipAt(placing.kind,wx,wy,placing.r,null),mode:'pending'};sound('tick');}else{const t=towerAt(wx,wy);selected=t?.id??null;if(t)sound('tick');}renderControls(true);updateBattleUI();drawBattle();}
function rotatePlacing(){if(placing?.mode!=='pending'||!TOWER[placing.kind].turns)return false;const[w,h]=dims(placing.kind,placing.r);placing={...clipAt(placing.kind,placing.x+w/2,placing.y+h/2,(placing.r+1)%4,null),mode:'pending'};return true;}
function confirmPlacement(){if(!game||game.ended||placing?.mode!=='pending')return;const block=game.placementBlock(placing.kind);if(block){warn(block);updateBattleUI();return;}
 if(!placing.ok||!game.canPlace(placing.kind,placing.x,placing.y,placing.r)){warn('배치할 수 없는 구역입니다.');return;}const placed=game.place(placing.kind,placing.x,placing.y,placing.r);if(!placed){warn('캐시가 부족합니다.');updateBattleUI();return;}
 selected=placed.id;placing=null;sound('place');vibrate();save();renderControls(true);updateBattleUI();drawBattle();}
// Dragging starts on a battle slot (or on a waiting ghost) and is followed by window listeners.
function startDrag(kind,e,from){const keep=placing?.kind===kind&&placing.mode==='pending'?{...placing}:null;selected=null;placing={...(keep??{kind,r:0,x:0,y:0,ok:false}),mode:'drag',shown:from==='ghost'};dragPointer={id:e.pointerId,x:e.clientX,y:e.clientY,moved:false,from,restore:keep};renderControls(true);updateBattleUI();}

function dragEnd(){const d=dragPointer;dragPointer=null;if(!placing)return;
 if(d.from==='tray'&&!d.moved)placing=d.restore?null:placeAtCenter(placing.kind,placing.r); // tapping the same slot again cancels
 else if(placing.shown&&placing.ok)placing={...placing,mode:'pending'};
 else if(d.restore)placing={...d.restore,mode:'pending'};
 else placing=null;
 renderControls(true);updateBattleUI();drawBattle();}
document.addEventListener('pointerdown',e=>{const b=e.target.closest?.('#battle-slots [data-kind]');if(!b||screen!=='battle'||!game||game.ended||dialogKind||dragPointer)return;const id=b.dataset.kind;
 if(!game.canBuild(id)){warn(game.placementBlock(id));return;}if(!game.canAfford(game.buildCost(id))){warn('캐시가 부족합니다.');return;}sound('tick');
 e.preventDefault();try{b.setPointerCapture(e.pointerId);}catch{}startDrag(id,e,'tray');});
window.addEventListener('pointermove',e=>{if(!dragPointer||e.pointerId!==dragPointer.id)return;if(Math.hypot(e.clientX-dragPointer.x,e.clientY-dragPointer.y)>8)dragPointer.moved=true;if(dragPointer.moved||dragPointer.from==='ghost')dragMove(e);});

function bindBoard(cv){const pointers=new Map();let gesture=null;
 let lastPointer='';cv.addEventListener('dblclick',e=>{if(lastPointer!=='mouse'||placing?.mode!=='pending'||!game||game.ended)return;const[sx,sy]=boardPoint(e),[wx,wy]=board.toWorld(sx,sy);placing={...clipAt(placing.kind,wx,wy,placing.r,null),mode:'pending'};confirmPlacement();});
 cv.addEventListener('contextmenu',()=>{if(placing||selected)battleAction('deselect');});
 cv.addEventListener('pointerdown',e=>{lastPointer=e.pointerType;if(dragPointer||(e.pointerType==='mouse'&&e.button!==0))return;try{cv.setPointerCapture(e.pointerId);}catch{}const[sx,sy]=boardPoint(e);pointers.set(e.pointerId,{x:sx,y:sy,x0:sx,y0:sy,t:performance.now()});
  if(pointers.size===1){const[wx,wy]=board.toWorld(sx,sy);if(overGhost(wx,wy)){pointers.delete(e.pointerId);startDrag(placing.kind,e,'ghost');dragPointer.moved=true;return;}gesture={type:'pan',moved:false};}
  else if(pointers.size===2){const[a,b]=[...pointers.values()];gesture={type:'pinch',d:Math.hypot(a.x-b.x,a.y-b.y)||1,s:board.view().scale,mx:(a.x+b.x)/2,my:(a.y+b.y)/2};}});
 cv.addEventListener('pointermove',e=>{const p=pointers.get(e.pointerId);if(!p)return;const[sx,sy]=boardPoint(e),px=p.x,py=p.y;p.x=sx;p.y=sy;
  if(gesture?.type==='pinch'&&pointers.size===2){const[a,b]=[...pointers.values()],mx=(a.x+b.x)/2,my=(a.y+b.y)/2;board.pan(mx-gesture.mx,my-gesture.my);gesture.mx=mx;gesture.my=my;board.zoomTo(gesture.s*Math.hypot(a.x-b.x,a.y-b.y)/gesture.d,mx,my);}
  else if(gesture?.type==='pan'&&pointers.size===1){if(Math.hypot(sx-p.x0,sy-p.y0)>8)gesture.moved=true;if(gesture.moved)board.pan(sx-px,sy-py);}});

function battleAction(action,id){
 if(screen!=='battle'||!game||game.ended||dialogKind)return false;
 switch(action){
  case 'speed':game.setPlaybackRate(game.started?(game.playbackRate+1)%3:game.speed===1?2:1);break;
  case 'build':if(!TOWER[id]||!game.canBuild(id)||!game.canAfford(game.buildCost(id)))return false;selected=null;placing=placing?.kind===id?null:placeAtCenter(id,0);break;
  case 'rotate':if(!rotatePlacing())return false;renderControls(true);drawBattle();return true;
  case 'confirm-place':confirmPlacement();return true;
  case 'next-wave':if(game.started)return battleAction('skip-wave');if(!game.callNext())return false;break;
  case 'skip-wave':if(game.paused||!skipArmed()||!game.skip())return false;gainUntil=performance.now()+2400;break;
  case 'skip-dismiss':if(!game.canSkip())return false;skipDismissed={g:game,w:game.wave};updateBattleUI();return true;
  case 'deselect':selected=null;placing=null;break;
  case 'upgrade':if(!game.upgrade(selected))return false;sound('upgrade');vibrate();break;
  case 'sell':if(!game.sell(selected))return false;sound('sell');selected=null;break;
  case 'ability':if(!game.ability(selected))return false;break;
  case 'hotkey-skill':{const t=game.towers.find(t=>t.id===selected);if(t&&SKILLS[t.kind]?.has(t)&&skillReady(t)){if(!game.ability(t.id))return false;break;}const k=Object.keys(SKILLS).find(k=>game.towers.some(t=>t.kind===k&&SKILLS[k].has(t)&&skillReady(t)));if(!k)return false;return battleAction('skill',k);}
  case 'cycle-target':{const t=game.towers.find(t=>t.id===selected);if(!t||NO_TARGET.includes(t.kind))return false;const ids=Object.keys(TARGETS),next=ids[(ids.indexOf(t.target)+1)%ids.length];if(!game.setTarget(t.id,next))return false;break;}
  case 'fold-panel':toggleFold();return true;
  case 'zoom-in':board?.zoomBy(1.4);drawBattle();return true;
  case 'zoom-out':board?.zoomBy(1/1.4);drawBattle();return true;
  case 'zoom-fit':board?.fit();drawBattle();return true;
  case 'skill':{const s=SKILLS[id],ready=s?game.towers.filter(t=>t.kind===id&&s.has(t)&&skillReady(t)):[];if(!ready.length||!game.ability(ready[Math.floor(Math.random()*ready.length)].id))return false;vibrate();break;}
  default:return false;
 }
 save();renderControls(true);updateBattleUI();drawBattle();return true;
}
// Battle menu bar. Items are [label, action, shortcut, state]; state: {off, on, kind}.

 game:{label:'게임',key:'G',items:()=>[game.paused&&game.started?['계속하기','run','']:['일시정지','pause','Esc'],['다음 웨이브','next-wave','N',{off:game.started&&!game.canSkip()}],['배속 변경','speed','Space'],0,['설정...','battle-settings',''],['메인 메뉴로','battle-home','']]},

"art.js":function(require,exports){
// art.js: tower, road-unit and aircraft art, authored as SVG.
// 1 cell = 20 SVG units, origin at the footprint center, +x is "forward".
// Colors are tokens resolved per tower: "c" is the tower color, "c-55" darker,
// "c+40" lighter; other names are shared neutrals (see N).
// Flat top-down, no shadows: lighter = higher. The tower color is the
// indicator (pad frame + top-most part); barrels are light steel so the aim
// reads at any zoom.
// Moving parts are named groups the game animates:
//   turret  rotates to the aim (towers) or gun angle (units)
//   treadA/treadB  alternate while a tracked unit drives
//   exhaust  jet flames (hidden while parked)
// Nothing else animates: no spinning props or radars.
//   parked  unit waiting inside its building, empty  bay marking while deployed
//   sortie  bar that fills toward the next deployment
// Groups marked data-off are hidden unless the game turns them on.
const { TOWER } = require("data.js");

// ---- colors ---------------------------------------------------------------
const INK = "#000000";
const N = {
  hole: "#111111",
  rubber: "#1b1b1b",
  pad: "#242424",
  floor: "#2a2a2a",
  hull: "#333333",
  steel: "#444444",
  plate: "#555555",
  steelHi: "#6a6a6a",
  gun: "#959595",
  gunHi: "#d0d0d0",
  air: "#505050",
  airHi: "#656565",
  glow: "#ffc08d",
  hall: "#222222",
  bay: "#292929",
  bayLine: "#383838",
  rail: "#323232",
  booth: "#2f2f2f",
  slot: "#181818",
  strip: "#232323",
  paint: "#cccccc"
};
const toneCache = new Map();
function rgb(c) {
  const n = parseInt(c.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function tone(c, t) {
  const k = c + "|" + t;
  let v = toneCache.get(k);
  if (v) return v;
  const a = rgb(c), b = t < 0 ? rgb(INK) : [255, 255, 255], f = Math.abs(t);
  v = "#" + a.map((x, i) => Math.round(x + (b[i] - x) * f).toString(16).padStart(2, "0")).join("");
  toneCache.set(k, v);
  return v;
}
// "c!" = the tower color at full saturation, light: for things that glow.
function neon(c) {
  const k = c + "|!";
  let v = toneCache.get(k);
  if (v) return v;
  const [r, g, b] = rgb(c).map((x) => x / 255), mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let h = 0;
  if (d) h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  h *= 60;
  const L = 0.7, C = (1 - Math.abs(2 * L - 1)), X = C * (1 - Math.abs(((h / 60) % 2) - 1)), m = L - C / 2;
  const [r1, g1, b1] = h < 60 ? [C, X, 0] : h < 120 ? [X, C, 0] : h < 180 ? [0, C, X] : h < 240 ? [0, X, C] : h < 300 ? [X, 0, C] : [C, 0, X];
  v = "#" + [r1, g1, b1].map((x) => Math.round((x + m) * 255).toString(16).padStart(2, "0")).join("");
  toneCache.set(k, v);
  return v;
}
function color(token, c) {
  if (!token || token === "none" || token[0] === "#") return token;
  if (token === "c!") return neon(c);
  const m = /^c([+-]\d+)?$/.exec(token);
  if (m) return m[1] ? tone(c, +m[1] / 100) : c;
  return N[token] ?? token;
}

// Low-res face texture (see face2.py): upscaled softly on purpose.
const FACE = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABwAAAALCAYAAABs3u23AAABDUlEQVR42u2SwUrDQBRF75tJQjCd1phOaRMwIC6zqKAbF/6OP+C/9C/6CV24cKPgByhCNlKwKJISyjQv40KXTmm24t2eyz3weMBfj9zBSKk0CQdh1o8iU9e12TWkte55UXQcyEMyptq4esIF4nhUCL+ZE9PCMGZKpYmrq1SaGMaMmBbCb+ZxPCo6C5nshICCgAzAVAjuO0e+2ZSAjICCyU6cZ3OBPM/Dj6q+kpZOWtnef65WjwBal3MwHJ4JFhdM9iVWB7dlWW46CX9LbzzW3ra9FLZ5AICWvPPGF3fr5fJt3w2vizAw0AxcM7wbABYW68DgCcDeQur41aRUegSfTwEAW/lcVa/vACz+85MvG8BRNw+6xfIAAAAASUVORK5CYII=";

// ---- markup helpers (all numbers in SVG units) ---------------------------
const f = (v) => +(+v).toFixed(2);
const R = (x, y, w, h, fill, rx = 0, more = "") => `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}"${rx ? ` rx="${f(rx)}"` : ""} fill="${fill}"${more}/>`;
const C = (cx, cy, r, fill, more = "") => `<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(r)}" fill="${fill}"${more}/>`;
const E = (cx, cy, rx, ry, fill, more = "") => `<ellipse cx="${f(cx)}" cy="${f(cy)}" rx="${f(rx)}" ry="${f(ry)}" fill="${fill}"${more}/>`;
const L = (x1, y1, x2, y2, stroke, sw, more = "") => `<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" stroke="${stroke}" stroke-width="${f(sw)}"${more}/>`;
const P = (pts, fill, more = "") => `<polygon points="${pts.map(f).join(" ")}" fill="${fill}"${more}/>`;
// polygon plus its mirror across the x axis
const P2 = (pts, fill) => P(pts, fill) + P(pts.map((v, i) => (i % 2 ? -v : v)), fill);
const G = (id, body, attrs = "") => `<g${id ? ` id="${id}"` : ""}${attrs}>${body}</g>`;
const ROUND = ' stroke-linecap="round"';

// ---- shared pieces --------------------------------------------------------
// Pad under a person tower; the colored frame is the indicator.
function pad(w, h) {
  const hw = w * 10, hh = h * 10;
  return R(-hw + 1.2, -hh + 1.2, hw * 2 - 2.4, hh * 2 - 2.4, "pad", 3.2) +
    R(-hw + 2.8, -hh + 2.8, hw * 2 - 5.6, hh * 2 - 5.6, "none", 2, ' stroke="c" stroke-width="2.4"');
}
// People are "erasers": a square token with its two front corners cut at 45°,
// split front to back into head, torso (the widest band) and legs. Forward is
// +x, so the cut end is where the person looks. The head carries a low-res
// smiley texture (mouth toward the front, eyes behind it) that the game
// upscales softly, like an old low-res decal.
// Bands, front to back: head x 4..13, torso -7..4, legs -13..-7.
// Held things (guns, bombs, megaphone) sit OUTSIDE the token beside its right
// side (+y) and are drawn under it; small hand nubs at the edge hold them.
// Things worn on the back (packs, tanks, ammo boxes) sit on the torso.
const HX = 4, TX = -7, CUT = 3.4, GY = 15.8;
const band = (x0, fill) => P([x0, -13, 13 - CUT, -13, 13, -13 + CUT, 13, 13 - CUT, 13 - CUT, 13, x0, 13], fill);
// eyes sit at (6.9, ±4.3) once the face is placed
const EYE_X = 6.9, EYE_Y = 4.3;
function body(o = {}) {
  const legs = o.legs ?? "c-38", torso = o.torso ?? "c-8", head = o.head ?? "c+42";
  return band(-13, legs) + band(TX, torso) + band(HX, head) +
    G("", `<image href="face" x="-11" y="-4.3" width="22" height="8.6"/>`, ` transform="translate(8.5 0) rotate(-90)"`);
}
// one square hand on the token edge holding the weapon, s = side (1 right, -1 left)
const nub = (x, s = 1) => R(x, s > 0 ? 11.8 : -15.6, 3.8, 3.8, "c+42", 0, ' stroke="c+12" stroke-width="0.8"');
// Goggles shaped like real ski goggles: straight top (toward the forehead,
// -x), corners cut at the bottom and a notch for the nose (toward the mouth).
// Dark tinted frame, lens filled with the tower color so it glows against
// the frame. No glare streaks. Stops short of the mouth so the smile shows.
const gogglePts = (k) => [4.2 + k, -10.4 + k, 4.2 + k, 10.4 - k, 7.8 - k * 0.4, 10.4 - k, 9.4 - k, 8.6 - k * 0.4,
  9.4 - k, 2.8, 7.9 - k * 0.5, 0, 9.4 - k, -2.8, 9.4 - k, -8.6 + k * 0.4, 7.8 - k * 0.4, -10.4 + k];
const goggles = () => R(EYE_X - 0.8, -13, 1.6, 26, "c-62") + P(gogglePts(0), "c-74") + P(gogglePts(1.1), "c!");
// A one-handed person stands a little left of the pad center so token + weapon
// stay inside the pad frame; two-handed (both sides) stays centered.
const tower = (under, over = "", shift = -2.6) => ({ base: pad(2, 2), turret: G("", under + body() + over, ` transform="translate(0 ${shift})"`) });

// ---- towers: { base, turret } per level -----------------------------------
const TOWERS = {};

TOWERS.soldier = (lv) => {
  const y = GY;
  let gun;
  if (lv < 3) gun = R(-4, y - 1.7, 4, 3.4, "steel", 0.8) + R(0, y - 1.5, 11.4, 3, "steelHi", 0.8) + R(11.4, y - 0.9, 9, 1.8, "gunHi");
  else
    // light machine gun: thicker, drum magazine, longer barrel and a flash hider
    gun = R(-4, y - 2, 15.4, 4, "steelHi", 1) + C(4, y + 2.6, 2.4, "steel") + C(4, y + 2.6, 0.9, "c-20") +
      R(11.4, y - 1.1, 10, 2.2, "gunHi") + R(21, y - 1.6, 1.8, 3.2, "gun");
  const pack = lv >= 3 ? R(-6.6, -10, 7, 12, "c-55", 1.6) + R(-5.6, -8.6, 1.6, 9.2, "c-30", 0.6) : ""; // field pack
  return tower(gun, pack + nub(1) + (lv >= 2 ? goggles() : ""));
};

TOWERS.bomb = (lv) => {
  const r = lv >= 3 ? 4.6 : 3.8, bx = 11, by = GY + 0.6;
  const bomb = C(bx, by, r, "#303030") + C(bx - r * 0.35, by - r * 0.35, r * 0.28, "#555555") +
    L(bx + r * 0.7, by - r * 0.3, bx + r + 2, by - r * 0.3, "paint", 1) + C(bx + r + 2.4, by - r * 0.3, 1.4, "c+55");
  let over = R(-6, -12.6, 6.4, 5.4, "c-55", 1.4) + C(-2.8, -9.9, 1.2, "c-20"); // hip satchel
  if (lv >= 3) {
    // bandolier of small bombs across the chest
    over += L(-6, -12, 3, 9, "c-62", 2);
    for (const [x, y] of [[-4.6, -8.6], [-2, -2.6], [0.6, 3.4]]) over += C(x, y, 1.9, "#303030") + C(x - 0.5, y - 0.5, 0.6, "#555555");
  }
  return tower(bomb, over + nub(8.6) + (lv >= 2 ? goggles() : ""));

TOWERS.sniper = (lv) => {
  const y = GY;
  let gun;
  if (lv < 4) {
    const bh = lv >= 3 ? 2 : 1.3;
    gun = R(-5, y - 1.5, 5, 3, "steel", 0.8) + R(0, y - 1.3, 12, 2.6, "steelHi", 0.6) + R(12, y - bh / 2, 14, bh, "gunHi");
    if (lv >= 3) gun += R(24, y - 1.1, 2.6, 2.2, "gun"); // heavier barrel, muzzle cap
  } else {
    // anti-materiel rifle: long heavy barrel, muzzle brake, bipod
    gun = R(-5, y - 1.9, 5, 3.8, "steel", 0.8) + R(0, y - 1.9, 13, 3.8, "steelHi", 0.8) + R(13, y - 1.1, 16, 2.2, "gunHi") +
      R(28, y - 2.3, 3, 4.6, "gun", 0.6) + L(22, y - 1.2, 24, y - 4.6, "gun", 1.2) + L(22, y + 1.2, 24, y + 4.6, "gun", 1.2);
  }
  if (lv >= 2) gun += R(2.4, y - 1.1, 8.4, 2.2, "plate", 1.1) + C(10.6, y, 0.9, "c+60"); // scope
  let over = R(HX - 0.2, -12.4, 1.6, 24.8, "c-30", 0.8); // hood edge behind the eyes
  if (lv >= 3) over += R(-5.6, -12.4, 6, 4.4, "c-55", 1); // ammo pouch
  return tower(gun, over + nub(0.4));
};

TOWERS.flame = (lv) => {
  const y = GY;
  let gun = R(-2, y - 1.7, 12, 3.4, "steelHi", 1);
  gun += lv >= 3 ? P([10, y - 1.8, 17, y - 3.2, 17, y + 2.8, 10, y + 1.4], "gunHi") + C(18.4, y - 0.2, 1.7, "c+55")
                 : R(10, y - 1.1, 7, 2.2, "gunHi") + C(18, y, 1.3, "c+55");
  // fuel tanks on the back, seen from above as round tops on the torso; hose to the gun
  let over = "";
  const ys = lv >= 2 ? [-9, -3.2, 2.6] : [-7, 0.4], tr = lv >= 2 ? 2.9 : 3.5;
  for (const t of ys) over += C(-2, t, tr, "c-40") + C(-2, t, tr * 0.45, "c+12");
  over += L(-2, ys.at(-1) + tr, 0, 14, "rubber", 1.4);
  // pyromaniac: gas mask over the mouth
  if (lv >= 3) over += R(9.2, -5.4, 3.8, 10.8, "hole", 2) + C(13.6, 0, 2.2, "steel") + C(13.6, 0, 0.9, "gun");
  return tower(gun, over + nub(1));
};

TOWERS.minigun = (lv) => {
  const twin = lv >= 4;
  const gun = (s) => {
    const y = s * GY;
    let m = R(-3, y - 2.8, 10, 5.6, "steelHi", 1.4);
    for (const d of [-1.4, 0, 1.4]) m += L(7, y + d, 20.5, y + d, "gunHi", 1);
    return m + R(14, y - 2.4, 1.6, 4.8, "gun");
  };
  // ammo box on the back, brass belt out to the gun from Lv2
  const by = twin ? -4 : -10;
  let over = R(-6.6, by, 6.6, 8, "c-55", 1.4) + R(-5.6, by + 1.6, 1.4, 4.8, "c-30", 0.5);
  if (lv >= 2) {
    over += L(0, by + 6, 1.6, 13, "c+28", 1.8, ' stroke-dasharray="1.2 0.8"');
    if (twin) over += L(0, by + 2, 1.6, -13, "c+28", 1.8, ' stroke-dasharray="1.2 0.8"');
  }
  over += nub(1.2) + (twin ? nub(1.2, -1) : "");
  return tower(gun(1) + (twin ? gun(-1) : ""), over + (lv >= 3 ? goggles() : ""), twin ? 0 : -2.6);
};

TOWERS.shotgun = (lv) => {
  const y = GY;
  let gun = R(-3, y - 1.6, 4, 3.2, "steel", 0.8) + R(1, y - 1.8, 8, 3.6, "steelHi", 0.8) +
    R(9, y - 1.8, 7.4, 1.5, "gunHi") + R(9, y + 0.3, 7.4, 1.5, "gunHi");
  if (lv >= 3) gun += P([16, y - 2.2, 19.4, y - 3.6, 19.4, y + 3.6, 16, y + 2.2], "gunHi"); // flared muzzle
  gun += R(10.2, y - 2.5, 3, 5, "plate", 1); // pump
  if (lv >= 2) gun += C(4.6, y + 3, 2.6, "steel") + C(4.6, y + 3, 1, "c-20"); // drum
  // close-quarters armor: shoulder plates on the torso edges
  const armor = lv >= 3 ? R(-6, -13, 8, 3.2, "c+22", 1.2) + R(-6, 9.8, 8, 3.2, "c+22", 1.2) : "";
  return tower(gun, armor + nub(1.4));
};

TOWERS.commander = (lv) => {
  const big = lv >= 3, fl = big ? 1.3 : 1;

  let under = P([-11, -11, -11 - 11 * fl, -13.6 - 2 * fl, -11 - 8 * fl, -9.4 + 1.4 * fl], "c+15");

  // epaulettes + a star badge
  over += R(-4, -13.6, 6, 2.4, "c+42", 0.6) + R(-4, 11.2, 6, 2.4, "c+42", 0.6) +
    P([0, -2.4, 0.7, -0.7, 2.5, -0.7, 1.1, 0.4, 1.6, 2.2, 0, 1.2, -1.6, 2.2, -1.1, 0.4, -2.5, -0.7, -0.7, -0.7], "c+42");

TOWERS.agent = (lv) => {
  const pistol = (s) => {
    const y = s * GY, len = lv >= 3 ? 11 : 6.5;

  let t = body({ torso: "c-55", legs: "c-68" }) + P([HX, -3, 1, 0, HX, 3], "paint") + R(-3, -0.8, 7, 1.6, "hole");
  // wraparound shades: one dark band across both eyes

  if (lv >= 2) t += L(6.9, -7.6, 6.9, 7.6, "c+60", 0.8, ' opacity="0.85"') + C(4, -12.6, 1.2, "paint"); // night lens + earpiece
  t += nub(4) + (lv >= 3 ? nub(4, -1) : "");
  return { base: pad(2, 2), turret: G("", under + t, ` transform="translate(0 ${lv >= 3 ? 0 : -2.6})"`) };

// ---- road units -------------------------------------------------------------
// Tracked robot. Lv1 tracks + one minigun, Lv2 armor (track skirts, pauldrons),
// Lv3 twin miniguns + rocket pods on the shoulders, Lv4 big center minigun
// with a missile rack on each side.
function robotUnit(lv) {
  let hull = "", a = "", b = "";
  for (const s of [-1, 1]) {
    const y0 = s > 0 ? 13.6 : -24;
    hull += R(-26.4, y0, 52.8, 10.4, "rubber", 4.4);
    for (let x = -21.6; x <= 21.61; x += 4.8) a += L(x, y0 + 1.2, x, y0 + 9.2, "steel", 1.6);
    for (let x = -19.2; x <= 19.21; x += 4.8) b += L(x, y0 + 1.2, x, y0 + 9.2, "steel", 1.6);
  }
  let skirts = "";
  if (lv >= 2)
    for (const s of [-1, 1]) {
      const yo = s > 0 ? 18.4 : -24.8;
      skirts += R(-22, yo, 44, 6.4, "c-40", 1.2);
      for (const x of [-16, 0, 16]) skirts += C(x, yo + 3.2, 0.9, "c+10");
    }
  // lower hull between the tracks, front glacis and the turret ring
  let low = R(-21.6, -14, 43.2, 28, "hull", 2.4) + R(16, -12, 4.8, 24, "steel", 1.2);
  for (const y of [-7.6, 0, 7.6]) low += R(17.2, y - 1.2, 2.4, 2.4, "plate", 0.6);
  low += C(-3, 0, 12.4, "steel");

  // upper body: turns with the guns
  const L4 = lv >= 4, wide = lv >= 2 ? 14 : 12.4;
  const armTo = (y, x1) => R(-2.4, y - 2.6, x1 * 20 + 2.4, 5.2, "steelHi", 1.4) + L(0.4, y, x1 * 20 - 1.2, y, "plate", 1.2);
  const minigun = (y, x0, len) => {
    const X = x0 * 20;
    let m = R(X - 0.8, y - 3, 6.4, 6, "plate", 1);
    for (const d of [-1.5, 0, 1.5]) m += L(X + 5.2, y + d, X + 5.2 + len * 20, y + d, "gunHi", 1);
    return m + R(X + 5.2 + len * 12, y - 2.4, 1.4, 4.8, "gun");
  };
  let t = "";
  if (!L4) {
    t += armTo(wide, 0.48) + armTo(-wide, lv >= 3 ? 0.48 : 0.3) + minigun(wide, 0.48, 0.78);
    if (lv >= 3) t += minigun(-wide, 0.48, 0.78);
    else t += R(5.2, -wide - 3.2, 4, 6.4, "plate", 1.6) + R(8.8, -wide - 2.6, 1.6, 1.6, "gun") + R(8.8, -wide + 1, 1.6, 1.6, "gun"); // fist
  } else {
    for (const s of [-1, 1]) {
      const y = s * 18.4;
      t += R(-12.4, y - 5.2, 23.2, 10.4, "steel", 1.6);
      for (const k of [-1, 0, 1]) {
        const yy = y + k * 3;
        t += R(-10, yy - 1, 18.4, 2, "gunHi", 1) + P([8.4, yy - 1, 12, yy, 8.4, yy + 1], "c");
      }
    }
  }
  const cw = L4 ? 12.4 : lv >= 2 ? 11.2 : 10;
  if (!L4) for (const s of [-1, 1]) t += C(-2, s * wide, 4, "plate"); // shoulder joints
  // chamfered chest: an armored mech chest, not a crate
  const chest = (x0, x1, h, k, fill) => P([x0 + k, -h, x1 - k, -h, x1, -h + k, x1, h - k, x1 - k, h, x0 + k, h, x0, h - k, x0, -h + k], fill);
  t += chest(-12.4, 8, cw, 4, "c-18") + chest(-10, 5.2, cw - 2.4, 2.8, "c");
  if (lv >= 2) t += L(-2.8, -cw + 3.2, -2.8, cw - 3.2, "c-40", 1.2);
  if (lv === 2) for (const s of [-1, 1]) t += R(-8.4, s * (wide + 0.8) - 4, 9.2, 8, "c+12", 2.4); // pauldrons
  if (lv === 3)
    for (const s of [-1, 1]) {
      // rocket pods on the shoulders, tubes open to the sky
      const y = s * (wide + 0.4);
      t += R(-10, y - 4.8, 11.2, 9.6, "steel", 1.4);
      for (const [x, yy] of [[-7.2, -2], [-7.2, 2], [-2, -2], [-2, 2]]) t += C(x, y + yy, 1.7, "hole") + C(x, y + yy, 0.7, "c+35");
    }
  if (L4) {
    // big center minigun in front of the chest, cockpit pushed back
    t += R(6, -6.4, 10, 12.8, "plate", 2) + C(12.4, 0, 4.8, "steelHi");
    for (const k of [-2, -1, 0, 1, 2]) t += L(15.6, k * 1.5, 37, k * 1.5, "gunHi", 1);
    t += R(25, -4.4, 1.8, 8.8, "gun") + R(34.4, -4, 1.6, 8, "gun");
    t += R(-8.4, -3.2, 5.2, 6.4, "c-40", 1.2) + R(-4.8, -2.2, 1.2, 4.4, "c+65");
  } else t += R(4, -4, 6.4, 8, "c-40", 1.6) + R(8.4, -2.6, 1.6, 5.2, "c+65");
  return hull + G("treadA", a) + G("treadB", b, " data-off=\"1\"") + skirts + low + G("turret", t);
}

// ---- aircraft -----------------------------------------------------------------
function propeller(x, r) {
  return L(x, -r, x, r, "gunHi", 1) + C(x, 0, 1.4, "gunHi");
}
// Lv1 biplane, Lv2 biplane with bombs, Lv3 long-wing spy plane with a radar
// dome, Lv4 swept-wing jet carrying four missiles.
function planeUnit(lv) {
  let p = "";
  if (lv <= 2) {
    p += R(-6.4, -21.6, 7.2, 43.2, "c-55", 1.6); // lower wing peeks out (biplane stagger)
    if (lv === 2)
      for (const s of [-1, 1]) p += E(-7.6, s * 8.4, 4.8, 1.5, "steel") + R(-13.2, s * 8.4 - 1.6, 1.6, 3.2, "gun") + C(-3.2, s * 8.4, 0.8, "c");
    p += P([18.4, -3.4, 18.4, 3.4, -6, 4, -21, 1.4, -21, -1.4, -6, -4], "c-30"); // fuselage
    p += R(-20.4, -9.2, 5.2, 18.4, "c", 1.2) + L(-22, 0, -13.6, 0, "c+35", 1.4); // tail
    p += R(-2.4, -24, 8.4, 48, "c", 2) + L(3.6, -22.4, 3.6, 22.4, "c+20", 1); // upper wing
    p += R(-0.4, 20.4, 4.4, 3.6, "c+35", 0.8) + R(-0.4, -24, 4.4, 3.6, "c+35", 0.8);
    for (const s of [-1, 1]) p += L(6, s * 8.4, 11.2, s * 8.4, "gunHi", 1.4); // wing guns
    p += C(-7.2, 0, 2.8, "hole") + C(-7.2, 0, 1.6, "c+35"); // cockpit + pilot
    p += R(15.2, -4, 4, 8, "steelHi", 1.6) + propeller(20, 10);
    return p;
  }
  if (lv === 3) {
    // long straight wings, dark airframe, color only on tips and stripes
    p += R(-4.8, -30, 6.8, 60, "air", 1.6) + R(-4.8, 24, 6.8, 6, "c", 1.2) + R(-4.8, -30, 6.8, 6, "c", 1.2);
    for (const s of [-1, 1]) p += R(-4.8, s * 12.4 - 0.8, 6.8, 1.6, "c-20");
    p += P([20, -2.6, 20, 2.6, -4, 3.4, -23, 1.2, -23, -1.2, -4, -3.4], "airHi");
    p += R(-22.8, -10, 4.4, 20, "air", 1) + L(-24, 0, -16, 0, "c", 1.4); // T-tail
    p += C(-10, 0, 5.4, "c-35") + L(-10, 0, -5.2, 0, "c+35", 1.2) + C(-10, 0, 1.4, "c+35");
    p += C(8.4, 0, 1.8, "hole") + R(17.2, -3, 3.2, 6, "steelHi", 1.2) + propeller(20.8, 8.4);
    return p;
  }
  // Lv4 jet
  p += P2([7, 3.6, -11, 24.4, -16.4, 24.4, -12.4, 4], "c-12");
  for (const s of [-1, 1])
    for (const [y, x1] of [[12.4, -1], [18, -4.1]]) {
      const yy = s * y;
      p += R(-12.4, yy - 0.9, x1 + 12.4, 1.8, "gunHi", 0.8) + P([x1, yy - 0.9, x1 + 2.8, yy, x1, yy + 0.9], "c");
    }
  p += P([26, 0, 15, -3.4, -17, -4, -21, -2.4, -21, 2.4, -17, 4, 15, 3.4], "c-30");
  p += P2([-12.4, 3.6, -21, 12.4, -23.6, 12.4, -20, 3.2], "c-12");
  p += L(-12, 2.8, -21.6, 4.8, "c+35", 1.2) + L(-12, -2.8, -21.6, -4.8, "c+35", 1.2);
  p += E(9.6, 0, 6, 2, "c+55");
  p += C(-21.4, 1.4, 1.3, "steel") + C(-21.4, -1.4, 1.3, "steel");
  p += G("exhaust", C(-21.4, 1.4, 1.3, "glow") + C(-21.4, -1.4, 1.3, "glow"));
  return p;
}

// ---- buildings with a parked unit ------------------------------------------

// Runway: the art the player liked, with the plane of the current level.

// Farm 4x3: crop field on the left, a barn on the right.
// Lv1 sprout rows, Lv2 lush rows + fertilizer sacks, Lv3 an orchard of trees.
TOWERS.farm = (lv) => {
  let b = R(-38.8, -28.8, 77.6, 57.6, "pad", 3.2);
  // field
  b += R(-35, -25, 44, 50, "c-72", 2);
  if (lv < 3) {
    for (const x of [-29, -19, -9, 1]) {
      b += R(x - 2.6, -22, 5.2, 44, "c-62", 2.6); // ridge
      for (let y = -18; y <= 18; y += 6) b += lv >= 2 ? C(x, y, 2.5, "c-12") + C(x, y, 1.1, "c+22") : C(x, y, 1.6, "c-20");
    }
  } else {
    // orchard: round crowns, lighter at the top, a few fruits
    for (const [x, y] of [[-26, -14], [-26, 2], [-26, 17], [-12, -6], [-12, 10], [2, -14], [2, 2], [2, 17]].slice(0, 8)) {
      b += C(x, y, 6.6, "c-30") + C(x, y, 4.2, "c-8") + C(x - 1, y - 1, 1.8, "c+30");
      b += C(x + 3, y + 2.6, 1, "c+55") + C(x - 3.2, y + 1.4, 1, "c+55");
    }
  }

// Cell map: 0 open ground, 1 cave rock, 2 feature (wall, rock, water, building), 3 road.
const GRIDS=new WeakMap();
const inPoly=(x,y,p)=>{let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const[a,b]=p[i],[d,e]=p[j];if((b>y)!==(e>y)&&x<(d-a)*(y-b)/(e-b)+a)c=!c;}return c;};
function terrainGrid(map){let g=GRIDS.get(map);if(g)return g;g=new Uint8Array(COLS*ROWS);
 for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const cx=x+.5,cy=y+.5;let v=inPoly(cx,cy,map.ground)?0:1;if(!v)for(const f of map.features){if(f.circle?Math.hypot(cx-f.circle[0],cy-f.circle[1])<=f.circle[2]:inPoly(cx,cy,f.poly)){v=2;break;}}g[y*COLS+x]=v;}
 const P=map.points;for(let i=0;i<P.length-1;i++){const[a,b]=P[i],[c,d]=P[i+1];for(let x=Math.min(a,c)-1;x<=Math.max(a,c)+1;x++)for(let y=Math.min(b,d)-1;y<=Math.max(b,d)+1;y++)if(x>=0&&y>=0&&x<COLS&&y<ROWS)g[y*COLS+x]=3;}
 GRIDS.set(map,g);return g;}
function buildable(map,x,y){return Number.isInteger(x)&&Number.isInteger(y)&&x>=0&&x<COLS&&y>=0&&y<ROWS&&terrainGrid(map)[y*COLS+x]===0;}
function makePath(points){const p=[];for(let i=0;i<points.length-1;i++){let[x,y]=points[i];const[a,b]=points[i+1],dx=Math.sign(a-x),dy=Math.sign(b-y);if(dx&&dy)throw Error('경로는 직각이어야 합니다.');while(x!==a||y!==b){p.push([x,y]);x+=dx;y+=dy;}}p.push(points.at(-1));return p;}

function purchaseTower(profile,id){if(!canBuyTower(profile,id))return false;const t=TOWER[id];if(!profile.cheats?.coins)profile.coins-=t.unlock*100;profile.owned.push(id);const empty=profile.loadout.indexOf(null);if(empty!==-1)profile.loadout[empty]=id;return true;}

"encounter-view.js":function(require,exports){
const {WAVES,ENEMIES}=require("data.js");
const {enemyIcon}=require("icons.js");
// Count scheduled + living enemies. Spawning moves one between the two sets;
// kills/leaks remove one, while summons and splits add their actual offspring.
function remainingEnemies(game){
 const counts=new Map(),add=(kind,n=1)=>counts.set(kind,(counts.get(kind)??0)+n);
 if(!game.started)for(const [kind,n] of WAVES[game.difficulty][0])add(kind,n);
 else {for(const e of game.queue.slice(game.spawnIndex))add(e.kind);for(const e of game.enemies)if(!e.dead&&e.hp>0)add(e.kind);}
 return Object.keys(ENEMIES).filter(k=>counts.get(k)>0).map(kind=>({kind,count:counts.get(kind)}));
}
function encounterHTML(game){return `<div class="enemy-strip">${remainingEnemies(game).map(({kind,count})=>`<span class="enemy-count" data-enemy="${kind}" title="${ENEMIES[kind].name}" aria-label="${ENEMIES[kind].name} 남은 ${count}">${enemyIcon(kind)}<b>${count}</b></span>`).join('')}</div>`;}
function bossStatusHTML(game){

 const cast=boss.boss?.cast;return `<div class="boss-status"><div><strong>${ENEMIES[boss.kind].name}</strong><span>${cast?`${cast.type==='entry'?'충격파':'마비 공격'} ${Math.max(0,cast.remaining).toFixed(1)}초`:`${Math.ceil(boss.hp).toLocaleString()} / ${boss.maxHp.toLocaleString()}`}</span></div><div class="boss-health"><i style="width:${Math.max(0,boss.hp/boss.maxHp*100)}%"></i></div></div>`;
}
function bossWarnings(game,cell){
 return game.enemies.filter(e=>!e.dead&&e.boss?.cast).map(e=>{

 }).join('');
}
