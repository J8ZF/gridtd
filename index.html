@keyframes arm{99%{background-size:100% 100%;color:#d4eee4;border-color:#3f6b5d}100%{background-size:100% 100%;color:#10231e;border-color:var(--accent)}}
@keyframes skip-in{from{opacity:0;transform:translate(-50%,-6px)}}
.battle-footer .slot .tower-icon{width:38px;height:38px}.battle-footer .slot{gap:1px}.slot .price{font-size:11px;font-weight:800;color:var(--cash);-webkit-text-stroke:3px rgba(8,12,16,.55);paint-order:stroke fill;letter-spacing:.2px}.tower-art{overflow:visible}/* 3.2 inventory: selected tower on top, equipped column on the right, 4-column list */
.inventory .inv-top{display:grid;grid-template-columns:minmax(0,1fr) 62px;gap:12px;padding:14px 18px 12px;border-bottom:1px solid var(--line);flex-shrink:0}
.inv-pick{display:flex;flex-direction:column;gap:8px;min-width:0}
.inv-hero{height:128px;display:flex;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--line);border-bottom:3px solid var(--color)}
.inv-hero .inv-hero-art{width:108px;height:108px}
.inv-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px;min-width:0}
.inv-title strong{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inv-desc{font-size:12px;color:var(--muted);line-height:1.5;min-height:36px}
.inv-actions{display:grid;grid-template-columns:1fr 1.3fr;gap:6px}
.inv-actions button{min-height:42px;height:42px;padding:6px 8px;font-size:13px;gap:5px}
.inv-actions .inv-more-btn{background:var(--panel)}
.inv-act.credit{background:var(--gold);border-color:var(--gold);color:#2a2008}
.inv-act.credit-off{color:var(--gold)}
.inv-actions svg.icon{width:16px;height:16px}
.inv-loadout{display:grid;grid-template-rows:repeat(5,minmax(0,1fr));gap:6px;min-height:0}
.inv-slot{min-height:0;height:auto;padding:3px;background:var(--panel);border:1px solid var(--line);border-bottom:3px solid var(--color,var(--line));border-radius:4px;display:flex;align-items:center;justify-content:center}
.inv-slot svg.tower-icon{width:34px;height:34px}
.inv-slot.empty{border:1px dashed var(--line);color:var(--muted)}
.inv-slot.empty svg{width:16px;height:16px}
.inv-slot.on,.inv-cell.on{background:#1d2b29;border-color:var(--accent);border-bottom-color:var(--color)}
.inv-detail{max-height:36dvh;overflow-y:auto;scrollbar-width:thin;padding:10px 18px 12px;border-bottom:1px solid var(--line);flex-shrink:0}
.inv-long{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:8px}
.inv-level{padding:8px 0;border-top:1px solid var(--line)}
.inv-level-head{display:flex;justify-content:space-between;gap:10px;font-size:12px}
.inv-level-head strong span{font-weight:600;color:var(--muted);margin-left:4px}
.inv-level-stats{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:11px;color:var(--muted);margin-top:4px}
.inv-level-stats b{color:var(--text);font-weight:600}
.inv-camo{color:var(--accent)}
.inv-level-meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--muted);padding-top:8px;border-top:1px solid var(--line)}
.inv-level-meta b{color:var(--text);font-weight:600}
.inventory .inv-list{flex:1;padding:14px 18px 22px}
.inv-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.inv-cell{position:relative;flex-direction:column;justify-content:flex-end;gap:0;height:80px;min-height:0;padding:4px 2px 5px;background:var(--panel);border:1px solid var(--line);border-bottom:3px solid var(--color);overflow:hidden}
.inv-cell svg.tower-icon{position:absolute;left:50%;top:6px;width:50px;height:50px;transform:translateX(-50%)}
.inv-name{position:relative;max-width:100%;font-size:11px;font-weight:800;color:var(--text);-webkit-text-stroke:3px rgba(8,12,16,.6);paint-order:stroke fill;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:14px}
.inv-cell.locked svg.tower-icon{opacity:.35;filter:grayscale(.7)}
.inv-cell.locked .inv-name{color:var(--muted)}
.inv-badge{position:absolute;top:4px;right:4px;display:flex;color:var(--muted)}
.inv-badge svg{width:14px;height:14px}
.inv-badge.eq{color:var(--accent)}
/* 3.4b: the selected-tower box is a square (same height as before) */
.inv-pick .inv-hero{width:128px;align-self:center}
/* 3.4: in-battle tray: bigger art, price on a dark fade along the bottom */
.battle-footer .slot{position:relative;padding:0;justify-content:flex-start}
.battle-footer .slot .tower-icon{width:54px;height:54px;margin-top:3px}
.battle-footer .slot .price{position:absolute;left:0;right:0;bottom:0;padding:13px 2px 3px;line-height:13px;text-align:center;background:linear-gradient(to top,rgba(8,12,16,.92) 35%,rgba(8,12,16,0))}
@media(max-height:700px){.battle-footer .slot .tower-icon{width:48px;height:48px;margin-top:2px}}
/* 3.5 */
.enemy-stats .cash-stat{color:var(--cash)}.enemy-stats .cash-stat.off{color:var(--muted)}
/* 3.7 compact battle UI ---------------------------------------------------- */
.battle .battle-hud{height:48px;padding:4px 6px;gap:4px;position:relative}
.battle .battle-hud button{height:40px;min-height:40px;width:40px;min-width:40px}
.hud-stats{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-evenly;gap:4px}
.battle-hud .hud-item{flex:0 1 auto;min-width:0;display:flex;align-items:baseline;justify-content:center;gap:4px;font-size:15px;color:var(--text);overflow:hidden}
.battle-hud .hud-item i{font-style:normal;font-size:11px;font-weight:600;color:var(--muted);flex-shrink:0}
.battle-hud .hud-item b{font-weight:750;overflow:hidden;text-overflow:ellipsis}
.battle-hud .hud-item.health b{color:var(--red)}
.battle-hud .hud-item.money b{color:var(--cash)}
.battle-hud .hud-item b.full{color:var(--red)}
.battle-hud .progress{position:absolute;left:0;bottom:0;height:2px;background:var(--accent);transition:width .15s linear}
#hud-gain{position:absolute;right:52px;top:calc(100% + 6px);z-index:4;font-style:normal;font-size:12px;font-weight:750;color:var(--cash);padding:3px 7px;border-radius:4px;background:#10151be8;opacity:0;transform:translateY(-4px);transition:opacity .2s,transform .2s;pointer-events:none}
#hud-gain.on{opacity:1;transform:none}
.battle .battle-footer{position:relative;overflow:visible;padding:6px 8px 8px}
#battle-slots{overflow:hidden}
.fold-tab{position:absolute;right:8px;top:-25px;z-index:4;width:46px;min-width:46px;height:25px;min-height:25px;padding:0;border:1px solid var(--line);border-bottom:0;border-radius:6px 6px 0 0;background:var(--bg);color:var(--muted)}
.fold-tab svg.icon{width:18px;height:18px;transition:transform .15s}
.battle-footer.folded .fold-tab svg.icon{transform:rotate(180deg)}
.battle-footer .tower-controls,.battle-footer .tower-controls:has(.next-upgrade){height:122px;min-height:0;max-height:none;margin-bottom:8px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.battle-footer.folded .tower-controls,.battle-footer.folded .tower-controls:has(.next-upgrade){height:44px}
.panel-desc{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.battle-footer.folded .panel-desc{display:none}
.panel-row{flex:0 0 44px;height:44px;min-height:0}
.battle-footer .tower-heading{height:24px;min-height:24px;flex:0 0 24px}
.battle-footer .tower-heading button{height:24px;min-height:24px;width:32px;min-width:32px;padding:2px}
.battle-footer .tower-heading .cash{font-size:12px;font-weight:700;color:var(--cash)}
.battle-footer .stats{height:20px;min-height:0;flex:0 0 20px;font-size:11px}
.battle-footer .stats .inv-camo{color:var(--accent)}
.battle-footer .next-upgrade{height:28px;min-height:0;flex:0 0 28px;margin:0;font-size:10.5px;line-height:14px;color:var(--muted);overflow:hidden}
.battle-footer .next-upgrade .upgrade-name{color:var(--accent);font-weight:650;margin-right:6px}
.battle-footer .actions{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:5px}
.battle-footer .actions.two{grid-template-columns:1.6fr 1fr}
.battle-footer .placement-actions{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:6px}
.battle-footer .placement-actions button{min-height:0;height:44px}
.place-warn{flex:0 0 28px;font-size:11px;line-height:28px;color:var(--red);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.enc-total{font-size:12px;font-variant-numeric:tabular-nums}
.enc-legend{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:18px;gap:3px 14px;align-content:start;padding-top:4px;overflow-y:auto;scrollbar-width:none}
.enc-item{display:flex;align-items:center;gap:6px;min-width:0;font-size:11px;color:var(--muted)}
.enc-item svg{width:16px;height:16px;flex-shrink:0}
.enc-item span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.enc-item b{color:var(--text);font-weight:650;font-variant-numeric:tabular-nums}
.enc-none{font-size:11px;color:var(--muted)}
.tower-controls[data-mode=standby] .enc-row{display:none}
.battle-footer.folded .tower-controls[data-mode=standby] .enc-row{display:block}
.enc-row{overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.enc-row .enemy-strip{height:44px;padding:0 2px;gap:14px}
.enc-row .enc-none{line-height:44px}
/* skills */
.skill-bar{position:absolute;left:8px;bottom:8px;z-index:3;display:flex;gap:6px}
.skill-bar:empty{display:none}
.skill-bar button.skill{position:relative;overflow:hidden;width:52px;min-width:52px;height:52px;min-height:52px;padding:0;border:0;border-radius:6px;display:block;color:var(--color);background:#10151bf0;box-shadow:inset 0 0 0 1px #2b3541,0 4px 12px #0009}
.skill-bar button.skill:disabled{opacity:1}
.skill-fill{position:absolute;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--color) 16%,transparent)}
.skill-bar button.skill.ready{background:color-mix(in srgb,var(--color) 24%,#10151b);box-shadow:inset 0 0 0 2px var(--color),0 4px 12px #0009}
.skill-bar button.skill.ready .skill-fill{display:none}
.skill-bar button.skill.ready::before{content:"";position:absolute;width:44px;height:44px;right:-16px;bottom:-18px;border-radius:50%;background:color-mix(in srgb,var(--color) 22%,transparent)}
.skill-glyph{position:absolute;left:50%;top:7px;width:25px;height:25px;margin-left:-12.5px}
.skill-bar button.skill.cooling .skill-glyph{top:50%;margin-top:-12.5px;opacity:.3}
.skill-count{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-size:12px;font-weight:800;color:#eef3f7;font-variant-numeric:tabular-nums}
.skill-wait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;color:#eef3f7;font-variant-numeric:tabular-nums}
.skill-bar button.skill.on{outline:2px solid var(--color);outline-offset:2px}
.battle-footer .tower-controls,.battle-footer .tower-controls:has(.next-upgrade){height:126px}
.battle-footer.folded .tower-controls,.battle-footer.folded .tower-controls:has(.next-upgrade){height:44px}
.battle-footer .tower-heading{height:28px;min-height:28px;flex:0 0 28px}
.battle-footer .tower-heading button{height:28px;min-height:28px}
.battle-footer .tower-heading .ability{width:auto;min-width:0}
/* 3.9.1 */
.inv-hero,.inv-slot,.inv-cell,.slot,.tower-face{overflow:hidden}

function sanitizeProfile(p){if(!p||p.version!==1||!Number.isSafeInteger(p.coins)||p.coins<0||p.coins>1e12||!Array.isArray(p.owned)||!Array.isArray(p.loadout))throw Error('지원하지 않는 저장 파일입니다.');const out=starterProfile();out.coins=p.coins;out.owned=[...new Set(p.owned.filter(k=>TOWER[k]))];out.loadout=Array(5).fill(null);const added=new Set();p.loadout.slice(0,5).forEach((k,i)=>{if(out.owned.includes(k)&&!added.has(k)){out.loadout[i]=k;added.add(k);}});out.seen=Object.fromEntries(Object.keys(p.seen??{}).filter(k=>ENEMIES[k]).map(k=>[k,true]));out.clears=Object.fromEntries(MAPS.flatMap(m=>['normal','hard'].map(d=>`${m.id}:${d}`)).filter(k=>p.clears?.[k]).map(k=>[k,true]));for(const k of ['sound','effects','vibration','hidePlanes','levelMode','panelOpen'])if(typeof p.settings?.[k]==='boolean')out.settings[k]=p.settings[k];out.stats={played:Math.max(0,Math.min(100000,Number(p.stats?.played)||0)),wins:Math.max(0,Math.min(100000,Number(p.stats?.wins)||0))};out.cheats=normalizeCheats(p.cheats);out.firstVisit=p.firstVisit!==false;return out;}

damage>=0&&b.radius>0&&b.duration>0&&b.remaining>=0&&b.remaining<=b.duration)))throw Error('폭탄 데이터가 올바르지 않습니다.');return r.ended?null:r;}

// Small static picture of the map for the menus.
function mapSVG(map){const pts=a=>a.map(p=>p.join(',')).join(' '),road=map.points.map(([x,y])=>`${x+.5},${y+.5}`).join(' '),tone={cliff:'#33404c','cliff-block':'#33404c',water:'#14313d',rock:'#2f3a45',pallet:'#2f3a45'},end=map.points.at(-1);
 return `<svg viewBox="0 ${map.viewTop} ${COLS} ${ROWS-map.viewTop}" aria-hidden="true"><rect x="-10" y="-10" width="${COLS+20}" height="${ROWS+20}" fill="#0b0f14"/><polygon points="${pts(map.ground)}" fill="#19212a" stroke="#26303b" stroke-width=".6"/>${map.features.map(f=>f.circle?`<circle cx="${f.circle[0]}" cy="${f.circle[1]}" r="${f.circle[2]}" fill="#2b3540"/>`:`<polygon points="${pts(f.poly)}" fill="${tone[f.kind]??'#2b3540'}"/>`).join('')}<polyline points="${road}" fill="none" stroke="#47515b" stroke-width="3" stroke-linejoin="miter"/><polyline points="${road}" fill="none" stroke="#2f373f" stroke-width="2.6" stroke-linejoin="miter"/><polyline points="${road}" fill="none" stroke="${map.color}" stroke-width=".4" stroke-dasharray="1.2 2.4"/><circle cx="3" cy="${map.points[1][1]+.5}" r="1.8" fill="${map.color}"/><rect x="${end[0]-1.5}" y="${end[1]-2.5}" width="4" height="4" fill="none" stroke="#ea7f90" stroke-width=".7"/></svg>`;}

function maps(){closeDialog();setScreen('maps',header('맵 선택')+`<div class="scroll map-list">${MAPS.map(m=>button('choose-map',`<div class="map-thumb">${mapSVG(m,true)}</div><div class="map-label"><div><h3>${m.name}</h3><div class="muted">${m.difficulty} · ${makePath(m.points).length-1}칸</div></div><span class="rate">×${m.mult.toFixed(2)}</span></div>`,'map-card',`data-map="${m.id}"`)).join('')}</div>`);}
function difficulty(map){chosenMap=map;setScreen('difficulty',header(map.name,'maps')+`<div class="scroll"><div class="difficulty-preview">${mapSVG(map)}</div><div class="terrain-legend"><span><i class="buildable-key"></i>배치 가능</span><span><i class="blocked-key">×</i>배치 불가</span></div>${Object.entries(DIFFICULTIES).map(([id,d])=>{const first=!profile.clears[`${map.id}:${id}`],reward=Math.round(d.reward*map.mult*100*(first?1.2:1));return button('start-game',`<div><strong>${d.name}</strong><p>${d.count} 웨이브</p></div><div><div class="reward">${icon('coin')}<span>${money(reward)}</span><small>크레딧</small></div><div class="first-clear">${first?'첫 클리어 +20%':'클리어 완료'}</div></div>`,'difficulty-card',`data-difficulty="${id}"`);}).join('')}</div>`);}
let invSel=null,invMore=false,invTap={kind:null,at:0};
const fmtN=v=>String(+(+v).toFixed(2));
// One line of key numbers for a tower at a level (lobby only, no buffs).
function levelLine(id,lv){const d=TOWER[id],i=lv-1,s=[],sec=v=>fmtN(v)+'초';
 switch(id){
  case'farm':s.push(['수입',`${d.income[i]} / ${sec(d.period[i])}`]);break;
  case'commander':s.push(['공속',`+${Math.round((d.boost[i]-1)*100)}%`],['사거리',`+${Math.round((d.rangeBoost[i]-1)*100)}%`],['범위',fmtN(d.range[i])]);if(d.activeDuration[i])s.push(['콜 투 암즈',`+${Math.round((d.activeFire[i]-1)*100)}%p · ${d.activeDuration[i]}초`]);break;
  case'spawner':s.push(['차량 체력',d.hp[i]]);if(d.gun[i])s.push(['기관총',d.gun[i]]);if(d.explosion[i])s.push(['폭발',d.explosion[i]]);s.push(['출격',sec(d.period[i])]);break;
  case'robot':s.push(['체력',d.hp[i].toLocaleString()],['미니건',d.gun[i]]);if(d.rocket[i])s.push(['로켓',d.rocket[i]]);s.push(['사거리',fmtN(d.gunRange[i])],['출격',sec(d.period[i])]);break;
  case'plane':s.push(['기관포',d.damage[i]]);if(d.bomb[i])s.push(['폭탄',d.bomb[i]]);if(d.missile[i])s.push(['미사일',`${d.missile[i]}×${d.missileCount}`]);s.push(['비행 반경',fmtN(d.range[i])]);break;
  case'flame':s.push(['화상',`${d.burn[i]} / 초`],['지속',sec(d.burnDuration[i])],['사거리',fmtN(d.range[i])]);break;
  case'shotgun':s.push(['직격',d.damage[i]],['확산',`${d.spreadDamage[i]}×${d.extra[i]}`],['사거리',fmtN(d.range[i])],['주기',sec(d.period[i])]);break;
  case'tesla':s.push(['총 피해',d.damage[i]],['전이',`${d.chain[i]}명`],['사거리',fmtN(d.range[i])],['주기',sec(d.period[i])]);break;
  case'gauss':s.push(['피해',d.damage[i]],['대상',`${d.targets[i]}명`],['범위',fmtN(d.range[i])],['주기',sec(d.period[i])]);break;
  case'laser':s.push(['피해',`${d.damage[i]}→${fmtN(d.damage[i]*d.cap[i])}`],['연사',`${d.burst[i]}발`],['사거리',fmtN(d.range[i])],['재충전',sec(d.period[i])]);break;
  case'bomb':s.push(['피해',d.damage[i]],['폭발',fmtN(d.splash[i])],['사거리',fmtN(d.range[i])],['주기',sec(d.period[i])]);break;
  default:s.push(['피해',d.burst?`${d.damage[i]}×${d.burst[i]}`:d.damage[i]],['사거리',fmtN(d.range[i])],[d.burst?'재장전':'주기',sec(d.period[i])]);}
 if(id==='agent'&&d.incomeBonus[i])s.push(['추가 수입',`+${Math.round(d.incomeBonus[i]*100)}%`]);if(id==='gauss')s.push(['수입',`피해 ${d.milestoneDamage[i]}마다 +${d.milestoneIncome[i]}`]);
 const camo=id==='plane'?d.revealLevel:d.camoLevel;if(camo&&lv>=camo)s.push(['',id==='plane'?'히든 해제':'히든']);
 return s.map(([k,v])=>k?`<span>${k} <b>${v}</b></span>`:`<span class="inv-camo">${v}</span>`).join('');}
function invDetails(id){const t=TOWER[id],n=t.upgrades.length+1;return `<p class="inv-long">${t.detail}</p>${Array.from({length:n},(_,i)=>`<div class="inv-level"><div class="inv-level-head"><strong>Lv.${i+1}${i?` <span>${t.upgradeNames[i-1]}</span>`:''}</strong><span class="cash">${i?'':'배치 '}${money((i?t.upgrades[i-1]:t.cost)*100)}</span></div><div class="inv-level-stats">${levelLine(id,i+1)}</div></div>`).join('')}<div class="inv-level-meta"><span>크기 <b>${t.size[0]}×${t.size[1]}</b>${t.turns?' · 회전 가능':''}</span>${t.placementLimit?`<span>배치 한도 <b>${t.placementLimit}개</b></span>`:''}<span>최대 레벨까지 <b class="cash">${money(cumulativeCost(id,n)*100)}</b></span></div>`;}
const invOwned=k=>profile.owned.includes(k);
function invPickHTML(){const t=TOWER[invSel],own=invOwned(invSel),eq=profile.loadout.includes(invSel),full=!profile.loadout.includes(null),buyable=canBuyTower(profile,invSel);
 const act=own?(eq?button('unequip','해제','inv-act unequip-button',`data-kind="${invSel}"`):button('equip','장착','inv-act equip-button',`data-kind="${invSel}" ${full?'disabled':''}`)):button('buy',`${icon('coin')}<span>${money(t.unlock*100)}</span>`,`inv-act ${buyable?'credit':'credit-off'}`,`data-kind="${invSel}" aria-label="${t.name} 구매" ${buyable?'':'disabled'}`);
 return `<div class="inv-pick"><div class="inv-hero" data-kind="${invSel}" style="--color:${t.color}">${towerIcon(invSel,'inv-hero-art')}</div><div class="inv-title"><strong style="color:${t.color}">${t.name}</strong><span class="muted small">티어 ${t.tier}${own?'':' · 잠김'}</span></div><p class="inv-desc">${t.desc}</p><div class="inv-actions">${button('inv-more',invMore?'접기':'더보기','inv-more-btn',`aria-expanded="${invMore}"`)}${act}</div></div>`;}
function invLoadoutHTML(){return `<div class="inv-loadout" data-key="${profile.loadout.join(',')}" aria-label="장착한 타워">${profile.loadout.map((k,i)=>k?button('inv-pick',towerIcon(k),`inv-slot ${k===invSel?'on':''}`,`style="--color:${TOWER[k].color}" data-kind="${k}" aria-label="${TOWER[k].name}"`):`<div class="inv-slot empty" aria-label="빈 슬롯 ${i+1}">${icon('plus')}</div>`).join('')}</div>`;}
function invBadge(id){return profile.loadout.includes(id)?`<i class="inv-badge eq">${icon('check')}</i>`:invOwned(id)?'':`<i class="inv-badge">${icon('lock')}</i>`;}
function invCellHTML(x){const o=invOwned(x.id),e=profile.loadout.includes(x.id);return button('inv-pick',`${towerIcon(x.id)}<span class="inv-name">${x.name}</span>${invBadge(x.id)}`,`inv-cell ${x.id===invSel?'on':''} ${o?'':'locked'}`,`style="--color:${x.color}" data-kind="${x.id}" aria-label="${x.name}${e?' 장착됨':o?'':' 잠김'}"`);}
function inventory(){if(!TOWER[invSel])invSel=profile.loadout.find(Boolean)??TOWERS[0].id;
 setScreen('inventory',header('인벤토리')+`<section class="inv-top">${invPickHTML()}${invLoadoutHTML()}</section>${invMore?`<div class="inv-detail" data-kind="${invSel}">${invDetails(invSel)}</div>`:''}<div class="scroll inv-list">${[1,2,3,4].map(tier=>{const list=TOWERS.filter(x=>x.tier===tier);return `<div class="section-label"><span>티어 ${tier}</span><span>${list.length}종</span></div><div class="inv-grid">${list.map(invCellHTML).join('')}</div>`;}).join('')}</div>`);}
function balance(){setScreen('balance',header('밸런스 기준','back-balance','<span></span>')+balancePanel());}
function towerInfo(id){const t=TOWER[id];openDialog(t.name,`<div class="tower-face" style="--color:${t.color};margin-bottom:16px">${towerIcon(id)}</div><p>${t.detail}</p><div class="keyline"><span>크기</span><span>${t.size[0]}×${t.size[1]}칸${t.turns?' · 회전 가능':''}</span></div>${t.placementLimit?`<div class="keyline"><span>배치 한도</span><span>${t.placementLimit}개</span></div>`:""}<div class="keyline"><span>배치</span><span class="cash">${money(t.cost*100)}</span></div>${t.upgrades.map((v,i)=>`<div class="keyline"><span><strong class="upgrade-name">${t.upgradeNames[i]}</strong><small class="upgrade-detail">Lv.${i+1} → Lv.${i+2} · ${t.notes[i]}</small></span><span class="cash">${money(v*100)}<small class="upgrade-detail">누적 ${money(cumulativeCost(id,i+2)*100)}</small></span></div>`).join('')}<div style="height:16px"></div>`,button('close-dialog','닫기','primary'));}
function buy(id){const t=TOWER[id];if(!canBuyTower(profile,id))return;openDialog(`${t.name} 해금`,`<p>${t.detail}</p><div class="result-row big"><span>${icon('coin')}</span><span>${money(t.unlock*100)}</span></div>`,button('confirm-buy','해금','primary',`data-kind="${id}"`)+button('close-dialog','취소','flat'));}
function confirmBuy(id){const t=TOWER[id];if(!canBuyTower(profile,id))return;const empty=profile.loadout.indexOf(null);if(!purchaseTower(profile,id))return;save();closeDialog();invSel=id;refreshInventory();toast(empty!==-1?'해금하고 빈 슬롯에 장착했습니다.':'해금했습니다.');}
function refreshInventory(){save();const top=$('.inventory .inv-top');if(screen!=='inventory'||!top){inventory();return;}
 top.querySelector('.inv-pick').outerHTML=invPickHTML();
 const key=profile.loadout.join(',');const lo=top.querySelector('.inv-loadout');if(lo.dataset.key!==key)lo.outerHTML=invLoadoutHTML();else for(const el of lo.querySelectorAll('.inv-slot[data-kind]'))el.classList.toggle('on',el.dataset.kind===invSel);
 const det=$('.inv-detail');if(invMore){const html=`<div class="inv-detail" data-kind="${invSel}">${invDetails(invSel)}</div>`;if(!det)top.insertAdjacentHTML('afterend',html);else if(det.dataset.kind!==invSel)det.outerHTML=html;}else det?.remove();
 for(const el of document.querySelectorAll('.inv-cell')){const id=el.dataset.kind,o=invOwned(id);el.classList.toggle('on',id===invSel);el.classList.toggle('locked',!o);const want=invBadge(id),badge=el.querySelector('.inv-badge');if((badge?.outerHTML??'')!==want){badge?.remove();if(want)el.insertAdjacentHTML('beforeend',want);}el.setAttribute('aria-label',`${TOWER[id].name}${profile.loadout.includes(id)?' 장착됨':o?'':' 잠김'}`);}
 const w=$('.inventory .wallet');if(w)w.innerHTML=`${icon('coin')}${wallet()}`;}
function unequip(id){const index=profile.loadout.indexOf(id);if(index===-1)return;profile.loadout[index]=null;refreshInventory();}
function equip(id){if(!profile.owned.includes(id)||profile.loadout.includes(id))return;const empty=profile.loadout.indexOf(null);if(empty===-1)return;profile.loadout[empty]=id;invSel=id;refreshInventory();}

function codex(tab=codexTab){codexTab=tab==='hard'?'hard':'normal';const ids=CODEX_GROUPS[codexTab],seen=ids.filter(k=>profile.seen[k]).length;setScreen('codex',header('적 도감','home',`<span class="muted small">${seen} / ${ids.length}</span>`)+`${codexTab==='hard'?`<p class="codex-note muted small">어려움 모드에서는 모든 적의 체력과 보호막이 ${Math.round((DIFFICULTIES.hard.hpScale-1)*100)}% 많습니다.</p>`:''}<p class="codex-note muted small">입구가 아닌 곳에서 생겨난 적(소환·분열·상자에서 나온 적)은 캐시를 주지 않습니다.</p><nav class="codex-tabs" aria-label="도감 분류">${['normal','hard'].map(id=>button('codex-tab',id==='normal'?'일반':'어려움',id===codexTab?'active':'',`data-kind="${id}" aria-pressed="${id===codexTab}"`)).join('')}</nav><div class="scroll codex-grid">${ids.map(id=>{const e=ENEMIES[id];return profile.seen[id]?`<article class="enemy-card" data-enemy="${id}">${enemyIcon(id)}<h3>${e.name}</h3><div class="enemy-stats"><span>HP ${e.hp.toLocaleString()}</span>${e.shield?`<span class="shield-stat">보호막 ${e.shield.toLocaleString()}</span>`:''}<span>${enemyMoveSpeed(id)>0?enemyMoveSpeed(id).toFixed(3)+'칸/초':'이동 안 함'}</span>${e.child?'<span class="cash-stat off">캐시 없음</span>':e.cashRate?`<span class="cash-stat">캐시 ${Math.round(e.cashRate*100)}%</span>`:''}</div><p>${e.desc}</p></article>`:`<article class="enemy-card locked">${icon('lock')}<span class="small">미발견</span></article>`;}).join('')}</div>`);}

function settings(from=screen){if(from!=='settings')previous=from;if(game&&!game.ended)game.paused=true;setScreen('settings',header('설정','back-settings','<span></span>')+`<div class="scroll">${[['sound','효과음'],['effects','공격 효과'],['vibration','진동'],['hidePlanes','비행기 숨기기'],['levelMode','타워 레벨 표시']].map(([key,label])=>`<div class="setting-row"><span>${label}</span><button role="switch" aria-checked="${profile.settings[key]}" aria-label="${label}" data-action="toggle-setting" data-key="${key}" class="switch ${profile.settings[key]?'on':''}"></button></div>`).join('')}<div class="section-label"><span>개발 치트</span></div>${[['lives','무한 라이프'],['cash','무한 캐시'],['coins','무한 크레딧']].map(([key,label])=>`<div class="setting-row"><span>${label}</span><button role="switch" aria-checked="${profile.cheats[key]}" aria-label="${label}" data-action="toggle-cheat" data-key="${key}" class="switch ${profile.cheats[key]?'on':''}"></button></div>`).join('')}<p class="cheat-help">전투에도 즉시 적용됩니다. 끄면 기존 잔액을 사용합니다.</p><div class="setting-row"><span>타워·도감 전체 해금</span>${allUnlocked()?'<span class="muted small">해금 완료</span>':button('unlock-all','해금','')}</div><div class="setting-row"><div>자동 저장<p>현재 기기·브라우저에 저장됩니다.<br>기기를 옮길 때는 저장 파일을 사용하세요.</p></div>${icon('check')}</div><div class="setting-actions">${button('export',`${icon('download')} 내보내기`)}${button('import',`${icon('upload')} 불러오기`)}</div><div class="setting-row">${button('balance','밸런스 기준','flat')}</div><div class="setting-row">${button('guide',`${icon('info')} 조작 안내`,'flat')}</div><div class="setting-row"><span>클리어</span><span class="mono">${profile.stats.wins}</span></div></div>`);}
// Cheat: own every tower and mark every enemy as seen.
function allUnlocked(){return TOWERS.every(t=>profile.owned.includes(t.id))&&Object.keys(ENEMIES).every(k=>profile.seen[k]);}
function unlockAll(){profile.owned=[...new Set([...profile.owned,...TOWERS.map(t=>t.id)])];for(const k of Object.keys(ENEMIES))profile.seen[k]=true;save();settings('settings');toast('모든 타워와 도감을 해금했습니다.');}
function guide(){openDialog('조작 안내',`<p>하단 타워를 끌어 지도에 놓기 → 회전 → 설치<br>막힌 곳에 놓으면 가까운 빈자리에 붙습니다<br>배치한 타워 선택 → 강화·타겟·판매<br>한 손가락으로 이동, 두 손가락으로 확대<br>상단 배속 1× → 2× → 0×(일시정지)<br>지도 위 ‘1 웨이브 시작’으로 전투 시작<br>적이 모두 나온 뒤에도 대기 시간이 넉넉하면 지도 위에 ‘스킵할까요?’가 뜹니다<br>스킵은 한 번에 한 웨이브만 · 버튼이 다 차오른 뒤에 눌립니다(차오르는 중에 누르면 처음부터)<br>하단 패널은 오른쪽 위 화살표로 접고 폅니다<br>커맨더 스킬: 지도 왼쪽 아래 버튼(준비된 커맨더 중 하나) 또는 커맨더를 선택해 콜 투 암즈<br>전체 ${PLACEMENT_LIMIT}개 · 농장 ${TOWER.farm.placementLimit}개 · 정비소 ${TOWER.spawner.placementLimit}개 · 로봇 ${TOWER.robot.placementLimit}개까지 배치<br>상단 메뉴 또는 뒤로 가기 → 일시정지 메뉴<br>메뉴·설정·안내를 열거나 다른 앱으로 나가도 일시정지<br>멈추면 지도 위에 ‘계속하기’가 뜹니다<br>키보드: 1~5 타워 · Enter 강화/배치 확인<br>Backspace 판매 · Space 배속 · N 스킵 · R 회전 · Esc 메뉴<br><br>웨이브를 버티면 타워 해금용 크레딧을 얻습니다.<br>실제 피해 1당 캐시 1을 얻습니다.<br>에이전트는 Lv.2부터 피해 수입이 ${Math.round(TOWER.agent.incomeBonus[1]*100)}%, Lv.3은 ${Math.round(TOWER.agent.incomeBonus[2]*100)}% 더 높습니다.<br>웨이브 종료 시 인터미션에서 캐시를 받습니다.<br>웨이브의 적을 모두 잡으면 인터미션 뒤 다음 웨이브가 옵니다.<br>다 못 잡아도 대기 시간이 끝나면 다음 웨이브가 옵니다.<br>스킵해도 웨이브 보상은 그대로 받고, 추가 보상은 없습니다.<br>인터미션은 ${ECONOMY.intermissionSeconds}초이며 남은 적·타워·농장은 계속 움직입니다.<br>한 웨이브를 기준 시간보다 오래 끌면 농장 생산이 점점 느려집니다.<br>적이 출구에 도착하면 남은 체력과 보호막만큼 기지에 피해를 줍니다.<br><br>군인 Lv.3 · 스나이퍼 Lv.2부터 히든 감지<br>비행기 Lv.3부터 궤도 안의 히든 해제<br>히든도 차량과 충돌합니다.<br>노란 보호막이 남으면 정지·화상 감속에 면역입니다.<br>보호막 피해도 1당 캐시 1을 얻습니다.<br>보스의 마비 예고는 공격 효과를 꺼도 표시됩니다.</p>`,button('close-dialog','확인','primary'));}

function towerStats(t){const d=TOWER[t.kind],s=stat(t),i=t.level-1;if(t.kind==='farm')return `수입 <b>${money(d.income[i]*100)}</b><span>주기 <b>${s.period}초</b></span><span>효율 <b>${Math.round(game.farmEfficiency()*100)}%</b></span><span>누적 <b>${money((t.produced??0)*100)}</b></span>`;if(t.kind==='flame')return `화상 <b>${d.burn[i]} / ${d.burnInterval}초</b><span>지속 <b>${d.burnDuration[i]}초</b></span><span>감속 <b>20%</b></span><span>사거리 <b>${(s.range*game.buffs(t).range).toFixed(1)}</b></span>`;if(t.kind==='commander')return `공속 <b>+${Math.round((d.boost[i]-1+(t.active>0?d.activeFire[i]-1:0))*100)}%</b><span>사거리 <b>+${Math.round((d.rangeBoost[i]-1+(t.active>0?d.activeRange[i]-1:0))*100)}%</b></span><span>범위 <b>${s.range}</b></span>`;if(d.hp)return `차량 HP <b>${d.hp[i].toLocaleString()}</b><span>출격 <b>${s.period}초</b></span><span>다음 <b id="launch-countdown">${Math.ceil(Math.max(0,t.cooldown))}초</b></span>`;const buff=game.buffs(t);return `<span>피해 <b>${t.kind==='shotgun'?`${s.damage}+${d.spreadDamage[i]}×${d.extra[i]}`:t.kind==='laser'?`${s.damage}→${Math.round(s.damage*d.cap[i])}`:s.damage+(d.burst?'×'+d.burst[i]:'')}</b></span><span>사거리 <b>${(s.range*buff.range).toFixed(1)}</b></span><span>${d.burst?'재장전':t.kind==='laser'?'틱':'주기'} <b>${(s.period/buff.fire).toFixed(2)}초</b></span>${(d.camoLevel??99)<=t.level?'<span style="color:var(--accent)">히든</span>':''}`;}

function selectedPanelHTML(t){const d=TOWER[t.kind],max=t.level>=maxLevel(t.kind),cost=max?0:d.upgrades[t.level-1]*100,aims=!NO_TARGET.includes(t.kind);

function renderControls(force=false){if(screen!=='battle')return;const t=game.towers.find(t=>t.id===selected),key=[selected,t?.level,t?.target,t?.disabled>0,placing?.kind,placing?.mode,placing?.r,game.started,game.paused,game.phase,game.wave,game.ended].join(':');
 if(force||key!==controlSignature){controlSignature=key;const box=$('#tower-controls');box.dataset.mode=t?'tower':placing&&TOWER[placing.kind]?'place':'standby';box.innerHTML=t?selectedPanelHTML(t):placing&&TOWER[placing.kind]?placingPanelHTML():standbyHTML();}

 if(t){const stats=$('#selected-stats');if(stats)stats.innerHTML=towerStats(t);const launch=$('#launch-countdown');if(launch)launch.textContent=`${Math.ceil(Math.max(0,t.cooldown))}초`;const up=$('#upgrade-button');if(up)up.disabled=t.level>=maxLevel(t.kind)||t.disabled>0||!game.canAfford(TOWER[t.kind].upgrades[t.level-1]*100);const ability=$('#ability-button');if(ability){const txt=t.active>0?`콜 투 암즈 ${Math.ceil(t.active)}초`:t.abilityCooldown>0?`${Math.ceil(t.abilityCooldown)}초`:'콜 투 암즈';if(ability.textContent!==txt)ability.textContent=txt;ability.disabled=t.abilityCooldown>0||game.paused||t.disabled>0;}}

function updateEncounter(){const legend=$('#enc-legend'),strip=$('#enc-strip');if(!legend||!strip)return;const list=remainingEnemies(game),sig=encSig(list);if(legend.dataset.sig===sig)return;legend.dataset.sig=strip.dataset.sig=sig;legend.innerHTML=encLegendHTML(list);const sc=strip.parentElement.scrollLeft;strip.innerHTML=encStripHTML(list);strip.parentElement.scrollLeft=sc;$('#enc-total').textContent=list.reduce((a,x)=>a+x.count,0);}
// Skills: one square button per kind at the map's lower left. ×N = ready towers;
// none ready = seconds until the soonest one. A press fires a random ready tower.
const SKILLS={commander:{name:'콜 투 암즈',glyph:'<path d="M3.5 10v4h3l7.5 4.5v-13L6.5 10h-3Z"/><path d="M17.5 9.2a4 4 0 0 1 0 5.6"/><path d="M20 6.8a7.5 7.5 0 0 1 0 10.4"/>',has:t=>t.level>=3,cooldown:()=>TOWER.commander.activeCooldown}};
function skillReady(t){return t.abilityCooldown<=0&&!(t.disabled>0);}
function skillState(){const out=[];for(const [kind,s] of Object.entries(SKILLS)){const list=game.towers.filter(t=>t.kind===kind&&s.has(t));if(!list.length)continue;const ready=list.filter(skillReady).length,wait=ready?0:Math.min(...list.map(t=>Math.max(t.abilityCooldown,t.disabled??0)));out.push({kind,ready,wait,active:list.some(t=>t.active>0)});}return out;}
function updateSkills(){const bar=$('#skill-bar');if(!bar)return;const off=game.paused||!game.started||game.ended,st=skillState(),sig=st.map(x=>[x.kind,x.ready,Math.ceil(x.wait),x.active].join(':')).join(',')+':'+off;if(bar.dataset.sig===sig)return;bar.dataset.sig=sig;
 bar.innerHTML=st.map(x=>{const s=SKILLS[x.kind],w=Math.ceil(x.wait),p=x.ready?100:Math.round((1-x.wait/s.cooldown())*100);return button('skill',`<i class="skill-fill" style="height:${Math.max(0,Math.min(100,p))}%"></i><svg class="skill-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${s.glyph}</svg>${x.ready?`<b class="skill-count">×${x.ready}</b>`:`<b class="skill-wait">${w}</b>`}`,`skill ${x.ready?'ready':'cooling'}${x.active?' on':''}`,`data-kind="${x.kind}" style="--color:${TOWER[x.kind].color}" aria-label="${s.name} ${x.ready?x.ready+'개 준비':w+'초 남음'}" ${!x.ready||off?'disabled':''}`);}).join('');}
function toggleFold(){const open=profile.settings.panelOpen===false;profile.settings.panelOpen=open;save();const f=$('.battle-footer');if(!f)return;f.classList.toggle('folded',!open);const b=$('#fold-button');if(b){b.setAttribute('aria-expanded',open);b.setAttribute('aria-label',open?'설명 패널 접기':'설명 패널 펴기');}}
function updateBattleUI(){if(screen!=='battle')return;$('#boss-info').innerHTML=bossStatusHTML(game);const n=game.placementCount(),pl=$('#hud-placement');pl.textContent=`${n}/${PLACEMENT_LIMIT}`;pl.classList.toggle('full',n>=PLACEMENT_LIMIT);$('#hud-wave').textContent=Math.max(1,game.wave);$('#hud-health').textContent=game.cheats.lives?'∞':game.health;$('#hud-cash').textContent=game.cheats.cash?'∞':money(game.cash);const gain=$('#hud-gain'),won=game.phase==='intermission'&&game.lastWaveCash>0;if(gain){const txt=won?`+${money(game.lastWaveCash*100)}`:'';if(gain.textContent!==txt)gain.textContent=txt;gain.classList.toggle('on',won);}$('#wave-progress').style.width=`${game.phase==='intermission'?(1-game.intermissionTime/ECONOMY.intermissionSeconds)*100:game.started?Math.min(100,game.waveTime/game.waveDuration*100):0}%`;$('#speed-button').textContent=`${game.started?game.playbackRate:game.speed}×`;for(const el of $('#battle-slots').querySelectorAll('[data-kind]')){const id=el.dataset.kind,d=TOWER[id],blocked=game.placementBlock(id);el.disabled=!!blocked||!game.canAfford(d.cost*100);el.setAttribute('aria-label',`${d.name} 배치 ${blocked||d.cost+'원'}`);const price=el.querySelector('[data-price]');if(price)price.textContent=blocked?'한도':money(d.cost*100);el.classList.toggle('active',placing?.kind===el.dataset.kind);}updateEncounter();updateSkills();updateOffer();renderControls();}
// Top-of-map prompt: the start button before the battle, then the skip offer.
// The skip offer hides while paused, and a fresh one ignores presses for OFFER_ARM ms
// (the button fills up meanwhile) so rapid taps cannot skip a wave by accident.
const OFFER_ARM=1000;
function offerMode(){return game.ended?'':!game.started?'start':game.paused?'resume':game.canSkip()&&!(skipDismissed?.g===game&&skipDismissed.w===game.wave)?'skip':'';}
// Time until the next wave arrives on its own: what is left of this wave plus the intermission.
function nextWaveIn(){return game.phase==='intermission'?game.intermissionTime:Math.max(0,game.waveDuration-game.waveTime)+ECONOMY.intermissionSeconds;}
function updateOffer(){const el=$('#wave-offer');if(!el)return;const mode=offerMode(),key=mode&&`${mode}:${game.wave}`;
 if(el.dataset.key!==key){el.dataset.key=key;el.hidden=!mode;
  if(mode==='start')el.innerHTML=button('next-wave',`${icon('play')}<span>1 웨이브 시작</span>`,'primary','id="next-wave-button"');
  else if(mode==='resume')el.innerHTML=`<div class="skip-text"><strong>일시정지</strong></div>${button('run',`${icon('play')}<span>계속하기</span>`,'primary','id="resume-button"')}`;
  else if(mode==='skip'){offerArmedAt=performance.now()+OFFER_ARM;el.innerHTML=`<div class="skip-text"><strong>스킵할까요?</strong><span class="mono" id="skip-left"></span></div>${button('skip-wave',`${icon('next')}<span>스킵</span>`,'primary arming','id="skip-button"')}${button('skip-dismiss',icon('close'),'icon','aria-label="스킵 닫기"')}`;}
  else el.innerHTML='';}
 if(mode==='skip')$('#skip-left').textContent=`${Math.ceil(nextWaveIn())}초 남음`;}
function skipArmed(){return $('#wave-offer')?.dataset.key===`skip:${game.wave}`&&performance.now()>=offerArmedAt;}
// Pressing the button while it is still filling starts the fill over, so a burst of taps never gets through.
document.addEventListener('pointerdown',e=>{const b=e.target.closest?.('#skip-button');if(!b||performance.now()>=offerArmedAt)return;offerArmedAt=performance.now()+OFFER_ARM;b.classList.remove('arming');void b.offsetWidth;b.classList.add('arming');},true);
function drawBattle(){if(screen!=='battle'||!board||!game)return;const shown=placing&&(placing.mode==='pending'||placing.shown)?placing:null;board.draw(game,{selected,placing:shown,effects:profile.settings.effects,hidePlanes:profile.settings.hidePlanes,levelMode:profile.settings.levelMode,time:game.time});}
function mountBoard(){const cv=$('#board');board=createBoard(cv,game.map);boardObserver?.disconnect();boardObserver=new ResizeObserver(()=>{board.resize();drawBattle();});boardObserver.observe(cv);board.resize();bindBoard(cv);}
function boardPoint(e){const r=$('#board').getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top,e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom];}
// Clipping: a footprint that does not fit where it is aimed moves to the nearest spot that fits.
const CLIP=[];for(let dy=-9;dy<=9;dy++)for(let dx=-9;dx<=9;dx++){const d=Math.hypot(dx,dy);if(d<=9)CLIP.push([dx,dy,d]);}CLIP.sort((a,b)=>a[2]-b[2]);

// ---- markup helpers (all numbers in SVG units) ---------------------------
const f = (v) => +(+v).toFixed(2);
const R = (x, y, w, h, fill, rx = 0, more = "") => `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}"${rx ? ` rx="${f(rx)}"` : ""} fill="${fill}"${more}/>`;
const C = (cx, cy, r, fill, more = "") => `<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(r)}" fill="${fill}"${more}/>`;
const E = (cx, cy, rx, ry, fill, more = "") => `<ellipse cx="${f(cx)}" cy="${f(cy)}" rx="${f(rx)}" ry="${f(ry)}" fill="${fill}"${more}/>`;
const L = (x1, y1, x2, y2, stroke, sw, more = "") => `<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" stroke="${stroke}" stroke-width="${f(sw)}"${more}/>`;
const P = (pts, fill, more = "") => `<polygon points="${pts.map(f).join(" ")}" fill="${fill}"${more}/>`;
// polygon plus its mirror across the x axis
const P2 = (pts, fill) => P(pts, fill) + P(pts.map((v, i) => (i % 2 ? -v : v)), fill);
const G = (id, body, attrs = "") => `<g${id ? ` id="${id}"` : ""}${attrs}>${body}</g>`;
const ROUND = ' stroke-linecap="round"';

// ---- shared pieces --------------------------------------------------------
// Pad under a person tower; the colored frame is the indicator.
function pad(w, h) {
  const hw = w * 10, hh = h * 10;
  return R(-hw + 1.2, -hh + 1.2, hw * 2 - 2.4, hh * 2 - 2.4, "pad", 3.2) +
    R(-hw + 2.8, -hh + 2.8, hw * 2 - 5.6, hh * 2 - 5.6, "none", 2, ' stroke="c" stroke-width="2.4"');
}
// People are "erasers": a square token with its two front corners cut at 45°,
// split front to back into head, torso (the widest band) and legs. Forward is
// +x, so the cut end is where the person looks. The head carries a low-res
// smiley texture (mouth toward the front, eyes behind it) that the game
// upscales softly, like an old low-res decal.
// Bands, front to back: head x 4..13, torso -7..4, legs -13..-7.
// Held things (guns, bombs, megaphone) sit OUTSIDE the token beside its right
// side (+y) and are drawn under it; small hand nubs at the edge hold them.
// Things worn on the back (packs, tanks, ammo boxes) sit on the torso.
const HX = 4, TX = -7, CUT = 3.4, GY = 15.8;
const band = (x0, fill) => P([x0, -13, 13 - CUT, -13, 13, -13 + CUT, 13, 13 - CUT, 13 - CUT, 13, x0, 13], fill);
// eyes sit at (6.9, ±4.3) once the face is placed
const EYE_X = 6.9, EYE_Y = 4.3;
function body(o = {}) {
  const legs = o.legs ?? "c-38", torso = o.torso ?? "c-8", head = o.head ?? "c+42";
  return band(-13, legs) + band(TX, torso) + band(HX, head) +
    G("", `<image href="face" x="-11" y="-4.3" width="22" height="8.6"/>`, ` transform="translate(8.5 0) rotate(-90)"`);
}
// one square hand on the token edge holding the weapon, s = side (1 right, -1 left)
const nub = (x, s = 1) => R(x, s > 0 ? 11.8 : -15.6, 3.8, 3.8, "c+42", 0, ' stroke="c+12" stroke-width="0.8"');
// Goggles shaped like real ski goggles: straight top (toward the forehead,
// -x), corners cut at the bottom and a notch for the nose (toward the mouth).
// Dark tinted frame, lens filled with the tower color so it glows against
// the frame. No glare streaks. Stops short of the mouth so the smile shows.
const gogglePts = (k) => [4.2 + k, -10.4 + k, 4.2 + k, 10.4 - k, 7.8 - k * 0.4, 10.4 - k, 9.4 - k, 8.6 - k * 0.4,
  9.4 - k, 2.8, 7.9 - k * 0.5, 0, 9.4 - k, -2.8, 9.4 - k, -8.6 + k * 0.4, 7.8 - k * 0.4, -10.4 + k];
const goggles = () => R(EYE_X - 0.8, -13, 1.6, 26, "c-62") + P(gogglePts(0), "c-74") + P(gogglePts(1.1), "c!");
// A one-handed person stands a little left of the pad center so token + weapon
// stay inside the pad frame; two-handed (both sides) stays centered.
const tower = (under, over = "", shift = -2.6) => ({ base: pad(2, 2), turret: G("", under + body() + over, ` transform="translate(0 ${shift})"`) });

// ---- towers: { base, turret } per level -----------------------------------
const TOWERS = {};

TOWERS.soldier = (lv) => {
  const y = GY;
  let gun;
  if (lv < 3) gun = R(-4, y - 1.7, 4, 3.4, "steel", 0.8) + R(0, y - 1.5, 11.4, 3, "steelHi", 0.8) + R(11.4, y - 0.9, 9, 1.8, "gunHi");
  else
    // light machine gun: thicker, drum magazine, longer barrel and a flash hider
    gun = R(-4, y - 2, 15.4, 4, "steelHi", 1) + C(4, y + 2.6, 2.4, "steel") + C(4, y + 2.6, 0.9, "c-20") +
      R(11.4, y - 1.1, 10, 2.2, "gunHi") + R(21, y - 1.6, 1.8, 3.2, "gun");
  const pack = lv >= 3 ? R(-6.6, -10, 7, 12, "c-55", 1.6) + R(-5.6, -8.6, 1.6, 9.2, "c-30", 0.6) : ""; // field pack
  return tower(gun, pack + nub(1) + (lv >= 2 ? goggles() : ""));
};

TOWERS.bomb = (lv) => {
  const r = lv >= 3 ? 4.6 : 3.8, bx = 11, by = GY + 0.6;
  const bomb = C(bx, by, r, "#2b3138") + C(bx - r * 0.35, by - r * 0.35, r * 0.28, "#4a5866") +
    L(bx + r * 0.7, by - r * 0.3, bx + r + 2, by - r * 0.3, "paint", 1) + C(bx + r + 2.4, by - r * 0.3, 1.4, "c+55");
  let over = R(-6, -12.6, 6.4, 5.4, "c-55", 1.4) + C(-2.8, -9.9, 1.2, "c-20"); // hip satchel
  if (lv >= 3) {
    // bandolier of small bombs across the chest
    over += L(-6, -12, 3, 9, "c-62", 2);
    for (const [x, y] of [[-4.6, -8.6], [-2, -2.6], [0.6, 3.4]]) over += C(x, y, 1.9, "#2b3138") + C(x - 0.5, y - 0.5, 0.6, "#4a5866");
  }
  return tower(bomb, over + nub(8.6) + (lv >= 2 ? goggles() : ""));
};

TOWERS.sniper = (lv) => {
  const y = GY;
  let gun;
  if (lv < 4) {
    const bh = lv >= 3 ? 2 : 1.3;
    gun = R(-5, y - 1.5, 5, 3, "steel", 0.8) + R(0, y - 1.3, 12, 2.6, "steelHi", 0.6) + R(12, y - bh / 2, 14, bh, "gunHi");
    if (lv >= 3) gun += R(24, y - 1.1, 2.6, 2.2, "gun"); // heavier barrel, muzzle cap
  } else {
    // anti-materiel rifle: long heavy barrel, muzzle brake, bipod
    gun = R(-5, y - 1.9, 5, 3.8, "steel", 0.8) + R(0, y - 1.9, 13, 3.8, "steelHi", 0.8) + R(13, y - 1.1, 16, 2.2, "gunHi") +
      R(28, y - 2.3, 3, 4.6, "gun", 0.6) + L(22, y - 1.2, 24, y - 4.6, "gun", 1.2) + L(22, y + 1.2, 24, y + 4.6, "gun", 1.2);
  }
  if (lv >= 2) gun += R(2.4, y - 1.1, 8.4, 2.2, "plate", 1.1) + C(10.6, y, 0.9, "c+60"); // scope
  let over = R(HX - 0.2, -12.4, 1.6, 24.8, "c-30", 0.8); // hood edge behind the eyes
  if (lv >= 3) over += R(-5.6, -12.4, 6, 4.4, "c-55", 1); // ammo pouch
  return tower(gun, over + nub(0.4));
};

TOWERS.flame = (lv) => {
  const y = GY;
  let gun = R(-2, y - 1.7, 12, 3.4, "steelHi", 1);
  gun += lv >= 3 ? P([10, y - 1.8, 17, y - 3.2, 17, y + 2.8, 10, y + 1.4], "gunHi") + C(18.4, y - 0.2, 1.7, "c+55")
                 : R(10, y - 1.1, 7, 2.2, "gunHi") + C(18, y, 1.3, "c+55");
  // fuel tanks on the back, seen from above as round tops on the torso; hose to the gun
  let over = "";
  const ys = lv >= 2 ? [-9, -3.2, 2.6] : [-7, 0.4], tr = lv >= 2 ? 2.9 : 3.5;
  for (const t of ys) over += C(-2, t, tr, "c-40") + C(-2, t, tr * 0.45, "c+12");
  over += L(-2, ys.at(-1) + tr, 0, 14, "rubber", 1.4);
  // pyromaniac: gas mask over the mouth
  if (lv >= 3) over += R(9.2, -5.4, 3.8, 10.8, "hole", 2) + C(13.6, 0, 2.2, "steel") + C(13.6, 0, 0.9, "gun");
  return tower(gun, over + nub(1));
};

TOWERS.minigun = (lv) => {
  const twin = lv >= 4;
  const gun = (s) => {
    const y = s * GY;
    let m = R(-3, y - 2.8, 10, 5.6, "steelHi", 1.4);
    for (const d of [-1.4, 0, 1.4]) m += L(7, y + d, 20.5, y + d, "gunHi", 1);
    return m + R(14, y - 2.4, 1.6, 4.8, "gun");
  };
  // ammo box on the back, brass belt out to the gun from Lv2
  const by = twin ? -4 : -10;
  let over = R(-6.6, by, 6.6, 8, "c-55", 1.4) + R(-5.6, by + 1.6, 1.4, 4.8, "c-30", 0.5);
  if (lv >= 2) {
    over += L(0, by + 6, 1.6, 13, "c+28", 1.8, ' stroke-dasharray="1.2 0.8"');
    if (twin) over += L(0, by + 2, 1.6, -13, "c+28", 1.8, ' stroke-dasharray="1.2 0.8"');
  }
  over += nub(1.2) + (twin ? nub(1.2, -1) : "");
  return tower(gun(1) + (twin ? gun(-1) : ""), over + (lv >= 3 ? goggles() : ""), twin ? 0 : -2.6);
};

TOWERS.shotgun = (lv) => {
  const y = GY;
  let gun = R(-3, y - 1.6, 4, 3.2, "steel", 0.8) + R(1, y - 1.8, 8, 3.6, "steelHi", 0.8) +
    R(9, y - 1.8, 7.4, 1.5, "gunHi") + R(9, y + 0.3, 7.4, 1.5, "gunHi");
  if (lv >= 3) gun += P([16, y - 2.2, 19.4, y - 3.6, 19.4, y + 3.6, 16, y + 2.2], "gunHi"); // flared muzzle
  gun += R(10.2, y - 2.5, 3, 5, "plate", 1); // pump
  if (lv >= 2) gun += C(4.6, y + 3, 2.6, "steel") + C(4.6, y + 3, 1, "c-20"); // drum
  // close-quarters armor: shoulder plates on the torso edges
  const armor = lv >= 3 ? R(-6, -13, 8, 3.2, "c+22", 1.2) + R(-6, 9.8, 8, 3.2, "c+22", 1.2) : "";
  return tower(gun, armor + nub(1.4));
};

TOWERS.commander = (lv) => {
  const big = lv >= 3, fl = big ? 1.3 : 1;
  // pennant flying from a pole worn on the back-left; bigger with a star at Lv3
  let under = P([-11, -11, -11 - 11 * fl, -13.6 - 2 * fl, -11 - 8 * fl, -9.4 + 1.4 * fl], "c+15");
  if (big) under += C(-19, -12.2, 1.3, "c-40") +
    R(4.6, GY - 1.2, 3.4, 2.4, "steel", 0.6) + P([8, GY - 1, 8, GY + 1, 15.6, GY + 3.2, 15.6, GY - 3.2], "gunHi"); // megaphone
  let over = C(-11, -11, 1.6, "gun");
  if (lv >= 2) over += R(-6.4, 1.6, 5.6, 7.4, "steel", 1) + L(-3.6, 3, -10, 9.4, "gun", 0.8) + C(-10, 9.4, 1, "c+42"); // radio pack
  // epaulettes + a star badge
  over += R(-4, -13.6, 6, 2.4, "c+42", 0.6) + R(-4, 11.2, 6, 2.4, "c+42", 0.6) +
    P([0, -2.4, 0.7, -0.7, 2.5, -0.7, 1.1, 0.4, 1.6, 2.2, 0, 1.2, -1.6, 2.2, -1.1, 0.4, -2.5, -0.7, -0.7, -0.7], "c+42");
  if (big) over += nub(4.4);
  return tower(under, over);
};

TOWERS.agent = (lv) => {
  const pistol = (s) => {
    const y = s * GY, len = lv >= 3 ? 11 : 6.5;
    return R(5.4, y - 1.1, 7, 2.2, "steelHi", 0.6) + R(12.4, y - 0.7, len, 1.4, lv >= 3 ? "gun" : "gunHi");
  };
  const under = pistol(1) + (lv >= 3 ? pistol(-1) : "");
  // dark suit, white collar and black tie at the chest
  let t = body({ torso: "c-55", legs: "c-68" }) + P([HX, -3, 1, 0, HX, 3], "paint") + R(-3, -0.8, 7, 1.6, "hole");
  // wraparound shades: one dark band across both eyes
  t += R(4.7, -9.4, 4.4, 18.8, "hole", 2.2);
  if (lv >= 2) t += L(6.9, -7.6, 6.9, 7.6, "c+60", 0.8, ' opacity="0.85"') + C(4, -12.6, 1.2, "paint"); // night lens + earpiece
  t += nub(4) + (lv >= 3 ? nub(4, -1) : "");
  return { base: pad(2, 2), turret: G("", under + t, ` transform="translate(0 ${lv >= 3 ? 0 : -2.6})"`) };
};

// ---- road units -------------------------------------------------------------
// Tracked robot. Lv1 tracks + one minigun, Lv2 armor (track skirts, pauldrons),
// Lv3 twin miniguns + rocket pods on the shoulders, Lv4 big center minigun
// with a missile rack on each side.
function robotUnit(lv) {
  let hull = "", a = "", b = "";
  for (const s of [-1, 1]) {
    const y0 = s > 0 ? 13.6 : -24;
    hull += R(-26.4, y0, 52.8, 10.4, "rubber", 4.4);
    for (let x = -21.6; x <= 21.61; x += 4.8) a += L(x, y0 + 1.2, x, y0 + 9.2, "steel", 1.6);
    for (let x = -19.2; x <= 19.21; x += 4.8) b += L(x, y0 + 1.2, x, y0 + 9.2, "steel", 1.6);
  }
  let skirts = "";
  if (lv >= 2)
    for (const s of [-1, 1]) {
      const yo = s > 0 ? 18.4 : -24.8;
      skirts += R(-22, yo, 44, 6.4, "c-40", 1.2);
      for (const x of [-16, 0, 16]) skirts += C(x, yo + 3.2, 0.9, "c+10");
    }
  // lower hull between the tracks, front glacis and the turret ring
  let low = R(-21.6, -14, 43.2, 28, "hull", 2.4) + R(16, -12, 4.8, 24, "steel", 1.2);
  for (const y of [-7.6, 0, 7.6]) low += R(17.2, y - 1.2, 2.4, 2.4, "plate", 0.6);
  low += C(-3, 0, 12.4, "steel");

  // upper body: turns with the guns
  const L4 = lv >= 4, wide = lv >= 2 ? 14 : 12.4;
  const armTo = (y, x1) => R(-2.4, y - 2.6, x1 * 20 + 2.4, 5.2, "steelHi", 1.4) + L(0.4, y, x1 * 20 - 1.2, y, "plate", 1.2);
  const minigun = (y, x0, len) => {
    const X = x0 * 20;
    let m = R(X - 0.8, y - 3, 6.4, 6, "plate", 1);
    for (const d of [-1.5, 0, 1.5]) m += L(X + 5.2, y + d, X + 5.2 + len * 20, y + d, "gunHi", 1);
    return m + R(X + 5.2 + len * 12, y - 2.4, 1.4, 4.8, "gun");
  };
  let t = "";
  if (!L4) {
    t += armTo(wide, 0.48) + armTo(-wide, lv >= 3 ? 0.48 : 0.3) + minigun(wide, 0.48, 0.78);
    if (lv >= 3) t += minigun(-wide, 0.48, 0.78);
    else t += R(5.2, -wide - 3.2, 4, 6.4, "plate", 1.6) + R(8.8, -wide - 2.6, 1.6, 1.6, "gun") + R(8.8, -wide + 1, 1.6, 1.6, "gun"); // fist
  } else {
    for (const s of [-1, 1]) {
      const y = s * 18.4;
      t += R(-12.4, y - 5.2, 23.2, 10.4, "steel", 1.6);
      for (const k of [-1, 0, 1]) {
        const yy = y + k * 3;
        t += R(-10, yy - 1, 18.4, 2, "gunHi", 1) + P([8.4, yy - 1, 12, yy, 8.4, yy + 1], "c");
      }
    }
  }
  const cw = L4 ? 12.4 : lv >= 2 ? 11.2 : 10;
  if (!L4) for (const s of [-1, 1]) t += C(-2, s * wide, 4, "plate"); // shoulder joints
  // chamfered chest: an armored mech chest, not a crate
  const chest = (x0, x1, h, k, fill) => P([x0 + k, -h, x1 - k, -h, x1, -h + k, x1, h - k, x1 - k, h, x0 + k, h, x0, h - k, x0, -h + k], fill);
  t += chest(-12.4, 8, cw, 4, "c-18") + chest(-10, 5.2, cw - 2.4, 2.8, "c");
  if (lv >= 2) t += L(-2.8, -cw + 3.2, -2.8, cw - 3.2, "c-40", 1.2);
  if (lv === 2) for (const s of [-1, 1]) t += R(-8.4, s * (wide + 0.8) - 4, 9.2, 8, "c+12", 2.4); // pauldrons
  if (lv === 3)
    for (const s of [-1, 1]) {
      // rocket pods on the shoulders, tubes open to the sky
      const y = s * (wide + 0.4);
      t += R(-10, y - 4.8, 11.2, 9.6, "steel", 1.4);
      for (const [x, yy] of [[-7.2, -2], [-7.2, 2], [-2, -2], [-2, 2]]) t += C(x, y + yy, 1.7, "hole") + C(x, y + yy, 0.7, "c+35");
    }
  if (L4) {
    // big center minigun in front of the chest, cockpit pushed back
    t += R(6, -6.4, 10, 12.8, "plate", 2) + C(12.4, 0, 4.8, "steelHi");
    for (const k of [-2, -1, 0, 1, 2]) t += L(15.6, k * 1.5, 37, k * 1.5, "gunHi", 1);
    t += R(25, -4.4, 1.8, 8.8, "gun") + R(34.4, -4, 1.6, 8, "gun");
    t += R(-8.4, -3.2, 5.2, 6.4, "c-40", 1.2) + R(-4.8, -2.2, 1.2, 4.4, "c+65");
  } else t += R(4, -4, 6.4, 8, "c-40", 1.6) + R(8.4, -2.6, 1.6, 5.2, "c+65");
  return hull + G("treadA", a) + G("treadB", b, " data-off=\"1\"") + skirts + low + G("turret", t);
}

// ---- aircraft -----------------------------------------------------------------
function propeller(x, r) {
  return L(x, -r, x, r, "gunHi", 1) + C(x, 0, 1.4, "gunHi");
}
// Lv1 biplane, Lv2 biplane with bombs, Lv3 long-wing spy plane with a radar
// dome, Lv4 swept-wing jet carrying four missiles.
function planeUnit(lv) {
  let p = "";
  if (lv <= 2) {
    p += R(-6.4, -21.6, 7.2, 43.2, "c-55", 1.6); // lower wing peeks out (biplane stagger)
    if (lv === 2)
      for (const s of [-1, 1]) p += E(-7.6, s * 8.4, 4.8, 1.5, "steel") + R(-13.2, s * 8.4 - 1.6, 1.6, 3.2, "gun") + C(-3.2, s * 8.4, 0.8, "c");
    p += P([18.4, -3.4, 18.4, 3.4, -6, 4, -21, 1.4, -21, -1.4, -6, -4], "c-30"); // fuselage
    p += R(-20.4, -9.2, 5.2, 18.4, "c", 1.2) + L(-22, 0, -13.6, 0, "c+35", 1.4); // tail
    p += R(-2.4, -24, 8.4, 48, "c", 2) + L(3.6, -22.4, 3.6, 22.4, "c+20", 1); // upper wing
    p += R(-0.4, 20.4, 4.4, 3.6, "c+35", 0.8) + R(-0.4, -24, 4.4, 3.6, "c+35", 0.8);
    for (const s of [-1, 1]) p += L(6, s * 8.4, 11.2, s * 8.4, "gunHi", 1.4); // wing guns
    p += C(-7.2, 0, 2.8, "hole") + C(-7.2, 0, 1.6, "c+35"); // cockpit + pilot
    p += R(15.2, -4, 4, 8, "steelHi", 1.6) + propeller(20, 10);
    return p;
  }
  if (lv === 3) {
    // long straight wings, dark airframe, color only on tips and stripes
    p += R(-4.8, -30, 6.8, 60, "air", 1.6) + R(-4.8, 24, 6.8, 6, "c", 1.2) + R(-4.8, -30, 6.8, 6, "c", 1.2);
    for (const s of [-1, 1]) p += R(-4.8, s * 12.4 - 0.8, 6.8, 1.6, "c-20");
    p += P([20, -2.6, 20, 2.6, -4, 3.4, -23, 1.2, -23, -1.2, -4, -3.4], "airHi");
    p += R(-22.8, -10, 4.4, 20, "air", 1) + L(-24, 0, -16, 0, "c", 1.4); // T-tail
    p += C(-10, 0, 5.4, "c-35") + L(-10, 0, -5.2, 0, "c+35", 1.2) + C(-10, 0, 1.4, "c+35");
    p += C(8.4, 0, 1.8, "hole") + R(17.2, -3, 3.2, 6, "steelHi", 1.2) + propeller(20.8, 8.4);
    return p;
  }
  // Lv4 jet

// ---- compile SVG into canvas draw lists ------------------------------------------
const listCache = new Map();
function parseTransform(s) {
  const ops = [];
  if (!s) return ops;
  for (const m of s.matchAll(/(translate|rotate|scale)\(([^)]*)\)/g)) ops.push([m[1], m[2].trim().split(/[\s,]+/).map(Number)]);
  return ops;
}
function roundRectPath(x, y, w, h, r) {
  const p = new Path2D();
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  p.moveTo(x + r, y);
  p.arcTo(x + w, y, x + w, y + h, r);
  p.arcTo(x + w, y + h, x, y + h, r);
  p.arcTo(x, y + h, x, y, r);
  p.arcTo(x, y, x + w, y, r);
  p.closePath();
  return p;
}
function compileNode(el, c, inherit) {
  const out = [];
  for (const n of el.children) {
    const a = (k, d) => n.getAttribute(k) ?? d;
    const style = {
      fill: color(a("fill", inherit.fill), c),
      stroke: color(a("stroke", inherit.stroke), c),
      sw: +a("stroke-width", inherit.sw),
      cap: a("stroke-linecap", inherit.cap),
      dash: a("stroke-dasharray", inherit.dash)
    };
    if (n.tagName === "g") {
      out.push({
        group: true,
        id: n.getAttribute("id") || "",
        off: n.hasAttribute("data-off"),
        pivot: (n.getAttribute("data-pivot") || "0,0").split(",").map(Number),
        tf: parseTransform(n.getAttribute("transform")),
        opacity: n.hasAttribute("opacity") ? +n.getAttribute("opacity") : null,
        kids: compileNode(n, c, style)
      });
      continue;
    }
    const num = (k) => +a(k, 0);
    if (n.tagName === "image") {
      out.push({ img: a("href", ""), x: num("x"), y: num("y"), w: num("width"), h: num("height") });
      continue;
    }
    let p = new Path2D(), open = false;
    switch (n.tagName) {
      case "rect":
        p = roundRectPath(num("x"), num("y"), num("width"), num("height"), num("rx"));
        break;
      case "circle":
        p.arc(num("cx"), num("cy"), num("r"), 0, Math.PI * 2);
        break;
      case "ellipse":
        p.ellipse(num("cx"), num("cy"), num("rx"), num("ry"), 0, 0, Math.PI * 2);
        break;
      case "line":
        p.moveTo(num("x1"), num("y1"));
        p.lineTo(num("x2"), num("y2"));
        open = true;
        break;
      case "polygon":
      case "polyline": {
        const v = a("points", "").trim().split(/[\s,]+/).map(Number);
        p.moveTo(v[0], v[1]);
        for (let i = 2; i < v.length; i += 2) p.lineTo(v[i], v[i + 1]);
        if (n.tagName === "polygon") p.closePath();
        else open = true;
        break;
      }
      case "path":
        p = new Path2D(a("d", ""));
        break;
      default:
        continue;
    }
    out.push({
      p,
      fill: open ? null : style.fill && style.fill !== "none" ? style.fill : null,
      stroke: style.stroke && style.stroke !== "none" ? style.stroke : null,
      sw: style.sw || 1,
      cap: style.cap || "butt",
      dash: style.dash ? style.dash.split(/[\s,]+/).map(Number) : null,
      opacity: n.hasAttribute("opacity") ? +n.getAttribute("opacity") : null
    });
  }
  return out;
}
function compile(markup, c) {
  const doc = new DOMParser().parseFromString(`<svg xmlns="http://www.w3.org/2000/svg">${markup}</svg>`, "image/svg+xml");
  return compileNode(doc.documentElement, c, { fill: "none", stroke: "none", sw: 1, cap: "butt", dash: null });
}
function list(key, c, make) {
  let v = listCache.get(key);
  if (!v) listCache.set(key, (v = compile(make(), c)));
  return v;
}
// Raster textures referenced by <image href="name">; loaded once, drawn when ready.
const textures = {};
function texture(name) {
  let im = textures[name];
  if (!im) {
    im = textures[name] = new Image();
    im.src = name === "face" ? FACE : name;
  }
  return im.complete && im.naturalWidth ? im : null;
}
// dyn[id]: false hides the group; true shows a data-off group;
// { rotate, scale: [sx, sy], translate: [dx, dy] } moves it around its pivot.
function run(g, items, dyn) {
  for (const it of items) {
    if (it.group) {
      const d = dyn[it.id];
      if (d === false || (it.off && !d)) continue;
      g.save();
      for (const [op, v] of it.tf) {
        if (op === "translate") g.translate(v[0], v[1] ?? 0);
        else if (op === "rotate") g.rotate((v[0] * Math.PI) / 180);
        else g.scale(v[0], v[1] ?? v[0]);
      }
      if (d && typeof d === "object") {
        const [px, py] = it.pivot;
        g.translate(px, py);
        if (d.translate) g.translate(d.translate[0], d.translate[1]);
        if (d.rotate) g.rotate(d.rotate);
        if (d.scale) g.scale(d.scale[0], d.scale[1]);
        g.translate(-px, -py);
      }
      if (it.opacity != null) g.globalAlpha *= it.opacity;
      run(g, it.kids, dyn);
      g.restore();
      continue;
    }
    if (it.img) {
      const im = texture(it.img);
      if (im) {
        g.imageSmoothingEnabled = true;
        g.drawImage(im, it.x, it.y, it.w, it.h);
      }
      continue;
    }
    const a = g.globalAlpha;
    if (it.opacity != null) g.globalAlpha *= it.opacity;
    if (it.fill) {
      g.fillStyle = it.fill;
      g.fill(it.p);
    }
    if (it.stroke) {
      g.strokeStyle = it.stroke;
      g.lineWidth = it.sw;
      g.lineCap = it.cap;
      if (it.dash) g.setLineDash(it.dash);
      g.stroke(it.p);
      if (it.dash) g.setLineDash([]);
    }
    g.globalAlpha = a;
  }
}

// ---- public API -------------------------------------------------------------------
const hasArt = (kind) => !!TOWERS[kind];
// Placed tower around its center, in cells. Returns false when the kind still
// uses the old art (the board falls back to it).
function drawTower(g, kind, level, o = {}) {
  if (!TOWERS[kind]) return false;
  const c = TOWER[kind].color;
  const parts = list(`${kind}:${level}`, c, () => {
    const m = TOWERS[kind](level);
    return G("base", m.base) + (m.turret ? G("turret", m.turret) : "");
  });
  const dyn = { turret: { rotate: o.aim ?? 0 } };
  // the unit always stands in its building: several can be out on the road at once
  if (kind === "robot" || kind === "spawner") Object.assign(dyn, { turret: undefined, parked: true, empty: false, sortie: { scale: [Math.max(0, Math.min(1, o.ready ?? 1)), 1] }, treadB: false });
  if (kind === "plane") Object.assign(dyn, { parked: !!o.parked, exhaust: false });
  g.save();
  g.scale(0.05, 0.05);
  run(g, parts, dyn);
  g.restore();
  return true;
}
const UNITS = { robot: robotUnit, spawner: carUnit };
function drawUnit(g, kind, level, o = {}) {
  if (!UNITS[kind]) return false;
  const parts = list(`unit:${kind}:${level}`, TOWER[kind].color, () => UNITS[kind](level));
  const frame = Math.floor((o.travel ?? 0) * 6) % 2 === 0;
  g.save();
  g.scale(0.05, 0.05);
  run(g, parts, { turret: { rotate: o.gunAngle ?? 0 }, treadA: frame, treadB: !frame });
  g.restore();
  return true;
}
function drawPlane(g, level, o = {}) {
  const parts = list(`air:${level}`, TOWER.plane.color, () => planeUnit(level));
  g.save();
  g.scale(0.05, 0.05);
  run(g, parts, { exhaust: true });
  g.restore();
}
// Standalone SVG (colors resolved) for icons and for opening in a vector tool.
function towerSVG(kind, level, part = "tower") {
  const c = TOWER[kind].color;
  let body, w, h;
  if (part === "unit") {
    body = UNITS[kind](level);
    w = h = 3.6;
  } else if (part === "air") {
    body = planeUnit(level);
    w = h = 3.4;

// Cell map: 0 open ground, 1 cave rock, 2 feature (wall, rock, water, building), 3 road.
const GRIDS=new WeakMap();
const inPoly=(x,y,p)=>{let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const[a,b]=p[i],[d,e]=p[j];if((b>y)!==(e>y)&&x<(d-a)*(y-b)/(e-b)+a)c=!c;}return c;};
function terrainGrid(map){let g=GRIDS.get(map);if(g)return g;g=new Uint8Array(COLS*ROWS);
 for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const cx=x+.5,cy=y+.5;let v=inPoly(cx,cy,map.ground)?0:1;if(!v)for(const f of map.features){if(f.circle?Math.hypot(cx-f.circle[0],cy-f.circle[1])<=f.circle[2]:inPoly(cx,cy,f.poly)){v=2;break;}}g[y*COLS+x]=v;}
 const P=map.points;for(let i=0;i<P.length-1;i++){const[a,b]=P[i],[c,d]=P[i+1];for(let x=Math.min(a,c)-1;x<=Math.max(a,c)+1;x++)for(let y=Math.min(b,d)-1;y<=Math.max(b,d)+1;y++)if(x>=0&&y>=0&&x<COLS&&y<ROWS)g[y*COLS+x]=3;}
 GRIDS.set(map,g);return g;}
function buildable(map,x,y){return Number.isInteger(x)&&Number.isInteger(y)&&x>=0&&x<COLS&&y>=0&&y<ROWS&&terrainGrid(map)[y*COLS+x]===0;}
function makePath(points){const p=[];for(let i=0;i<points.length-1;i++){let[x,y]=points[i];const[a,b]=points[i+1],dx=Math.sign(a-x),dy=Math.sign(b-y);if(dx&&dy)throw Error('경로는 직각이어야 합니다.');while(x!==a||y!==b){p.push([x,y]);x+=dx;y+=dy;}}p.push(points.at(-1));return p;}

"encounter-view.js":function(require,exports){
const {WAVES,ENEMIES}=require("data.js");
const {enemyIcon}=require("icons.js");
// Count scheduled + living enemies. Spawning moves one between the two sets;
// kills/leaks remove one, while summons and splits add their actual offspring.
function remainingEnemies(game){
 const counts=new Map(),add=(kind,n=1)=>counts.set(kind,(counts.get(kind)??0)+n);
 if(!game.started)for(const [kind,n] of WAVES[game.difficulty][0])add(kind,n);
 else {for(const e of game.queue.slice(game.spawnIndex))add(e.kind);for(const e of game.enemies)if(!e.dead&&e.hp>0)add(e.kind);}
 return Object.keys(ENEMIES).filter(k=>counts.get(k)>0).map(kind=>({kind,count:counts.get(kind)}));
}
function encounterHTML(game){return `<div class="enemy-strip">${remainingEnemies(game).map(({kind,count})=>`<span class="enemy-count" data-enemy="${kind}" title="${ENEMIES[kind].name}" aria-label="${ENEMIES[kind].name} 남은 ${count}">${enemyIcon(kind)}<b>${count}</b></span>`).join('')}</div>`;}
function bossStatusHTML(game){
 const boss=game.enemies.find(e=>!e.dead&&ENEMIES[e.kind].finalBoss);if(!boss)return '';
 const cast=boss.boss?.cast;return `<div class="boss-status"><div><strong>${ENEMIES[boss.kind].name}</strong><span>${cast?`${cast.type==='entry'?'충격파':'마비 공격'} ${Math.max(0,cast.remaining).toFixed(1)}초`:`${Math.ceil(boss.hp).toLocaleString()} / ${boss.maxHp.toLocaleString()}`}</span></div><div class="boss-health"><i style="width:${Math.max(0,boss.hp/boss.maxHp*100)}%"></i></div></div>`;
}
function bossWarnings(game,cell){
 return game.enemies.filter(e=>!e.dead&&e.boss?.cast).map(e=>{
  const targets=e.boss.cast.targets.map(id=>game.towers.find(t=>t.id===id)).filter(Boolean);
  return `<g stroke="#ff9b9f" fill="none" stroke-width="2"><circle cx="${e.x*cell}" cy="${e.y*cell}" r="27" stroke-dasharray="5 4"/>${targets.map(t=>`<rect x="${t.x*cell-22}" y="${t.y*cell-22}" width="44" height="44"/><path d="M${t.x*cell} ${t.y*cell-15}v17m0 5v3" stroke-width="3"/>`).join('')}</g>`;
 }).join('');
}

Object.defineProperty(exports,"bossStatusHTML",{enumerable:true,get:()=>bossStatusHTML});
Object.defineProperty(exports,"bossWarnings",{enumerable:true,get:()=>bossWarnings});
Object.defineProperty(exports,"encounterHTML",{enumerable:true,get:()=>encounterHTML});
Object.defineProperty(exports,"remainingEnemies",{enumerable:true,get:()=>remainingEnemies});
},

  if(e.isComposing||e.ctrlKey||e.metaKey||e.altKey||e.shiftKey)return;
  const tag=e.target?.tagName?.toLowerCase();
  if(['input','textarea','select'].includes(tag)||e.target?.isContentEditable)return;
  if(e.key==='Escape'){e.preventDefault();if(!e.repeat)back();return;}
  const s=state();if(s.screen!=='battle'||s.dialog||!s.game||s.game.ended)return;
  let command=null,id;
  if(/^[1-5]$/.test(e.key)){command='build';id=s.game.loadout[Number(e.key)-1];}
  else if(e.key==='Enter')command=s.pendingTile?'confirm-place':'upgrade';
  else if(e.key==='Backspace')command='sell';
  else if(e.key.toLowerCase()==='n')command='next-wave';
  else if(e.key.toLowerCase()==='r')command='rotate';
  else if(e.key===' '||e.code==='Space')command='speed';
  if(!command)return;e.preventDefault();if(e.repeat)return;action(command,id);
 });
}

// Mode tempo: scripts keep their shape; TEMPO scales every gap and pause, HOLD_SCALE every hold.
// 3.0: about 20 minutes on normal (25 waves) and 30 minutes on hard (30 waves).
const TEMPO={normal:0.7,hard:0.7},HOLD_SCALE={normal:0.2,hard:0.25};

 if(script.final)return script.g.map(([kind,count,gap,at])=>({kind,count,gap,start:at,end:at+(count-1)*gap}));
 const k=TEMPO[difficulty]??1;let t=0,first=true;return script.g.map(([kind,count,gap,pause])=>{if(!first)t+=pause*k;first=false;const start=t;t+=(count-1)*gap*k;return {kind,count,gap:gap*k,start,end:t};});
}

 const queue=[];for(const g of scriptGroups(difficulty,wave))for(let i=0;i<g.count;i++)queue.push({kind:g.kind,at:g.start+i*g.gap});
 return queue.sort((a,b)=>a.at-b.at);
}
