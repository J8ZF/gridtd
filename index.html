// ---- compile SVG into canvas draw lists ------------------------------------------
const listCache = new Map();
function parseTransform(s) {
  const ops = [];
  if (!s) return ops;
  for (const m of s.matchAll(/(translate|rotate|scale)\(([^)]*)\)/g)) ops.push([m[1], m[2].trim().split(/[\s,]+/).map(Number)]);
  return ops;
}
function roundRectPath(x, y, w, h, r) {
  const p = new Path2D();
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  p.moveTo(x + r, y);
  p.arcTo(x + w, y, x + w, y + h, r);
  p.arcTo(x + w, y + h, x, y + h, r);
  p.arcTo(x, y + h, x, y, r);
  p.arcTo(x, y, x + w, y, r);
  p.closePath();
  return p;
}
function compileNode(el, c, inherit) {
  const out = [];
  for (const n of el.children) {
    const a = (k, d) => n.getAttribute(k) ?? d;
    const style = {
      fill: color(a("fill", inherit.fill), c),
      stroke: color(a("stroke", inherit.stroke), c),
      sw: +a("stroke-width", inherit.sw),
      cap: a("stroke-linecap", inherit.cap),
      dash: a("stroke-dasharray", inherit.dash)
    };
    if (n.tagName === "g") {
      out.push({
        group: true,
        id: n.getAttribute("id") || "",
        off: n.hasAttribute("data-off"),
        pivot: (n.getAttribute("data-pivot") || "0,0").split(",").map(Number),
        tf: parseTransform(n.getAttribute("transform")),
        opacity: n.hasAttribute("opacity") ? +n.getAttribute("opacity") : null,
        kids: compileNode(n, c, style)
      });
      continue;
    }
    const num = (k) => +a(k, 0);
    if (n.tagName === "image") {
      out.push({ img: a("href", ""), x: num("x"), y: num("y"), w: num("width"), h: num("height") });
      continue;
    }
    let p = new Path2D(), open = false;
    switch (n.tagName) {
      case "rect":
        p = roundRectPath(num("x"), num("y"), num("width"), num("height"), num("rx"));
        break;
      case "circle":
        p.arc(num("cx"), num("cy"), num("r"), 0, Math.PI * 2);
        break;
      case "ellipse":
        p.ellipse(num("cx"), num("cy"), num("rx"), num("ry"), 0, 0, Math.PI * 2);
        break;
      case "line":
        p.moveTo(num("x1"), num("y1"));
        p.lineTo(num("x2"), num("y2"));
        open = true;
        break;
      case "polygon":
      case "polyline": {
        const v = a("points", "").trim().split(/[\s,]+/).map(Number);
        p.moveTo(v[0], v[1]);
        for (let i = 2; i < v.length; i += 2) p.lineTo(v[i], v[i + 1]);
        if (n.tagName === "polygon") p.closePath();
        else open = true;
        break;
      }
      case "path":
        p = new Path2D(a("d", ""));
        break;
      default:
        continue;
    }
    out.push({
      p,
      fill: open ? null : style.fill && style.fill !== "none" ? style.fill : null,
      stroke: style.stroke && style.stroke !== "none" ? style.stroke : null,
      sw: style.sw || 1,
      cap: style.cap || "butt",
      dash: style.dash ? style.dash.split(/[\s,]+/).map(Number) : null,
      opacity: n.hasAttribute("opacity") ? +n.getAttribute("opacity") : null
    });
  }
  return out;
}
function compile(markup, c) {
  const doc = new DOMParser().parseFromString(`<svg xmlns="http://www.w3.org/2000/svg">${markup}</svg>`, "image/svg+xml");
  return compileNode(doc.documentElement, c, { fill: "none", stroke: "none", sw: 1, cap: "butt", dash: null });
}
function list(key, c, make) {
  let v = listCache.get(key);
  if (!v) listCache.set(key, (v = compile(make(), c)));
  return v;
}
// Raster textures referenced by <image href="name">; loaded once, drawn when ready.
const textures = {};
function texture(name) {
  let im = textures[name];
  if (!im) {
    im = textures[name] = new Image();
    im.src = name === "face" ? FACE : name === "skull" ? SKULL : name === "skullB" ? SKULLB : name;

  return im.complete && im.naturalWidth ? im : null;
}
// dyn[id]: false hides the group; true shows a data-off group;
// { rotate, scale: [sx, sy], translate: [dx, dy] } moves it around its pivot.
function run(g, items, dyn) {

function terrainGrid(map){let g=GRIDS.get(map);if(g)return g;g=new Uint8Array(COLS*ROWS);
 for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const cx=x+.5,cy=y+.5;let v=inPoly(cx,cy,map.ground)?0:1;if(!v)for(const f of map.features){if(f.circle?Math.hypot(cx-f.circle[0],cy-f.circle[1])<=f.circle[2]:inPoly(cx,cy,f.poly)){v=2;break;}}g[y*COLS+x]=v;}

function makePath(points){const p=[];for(let i=0;i<points.length-1;i++){let[x,y]=points[i];const[a,b]=points[i+1],dx=Math.sign(a-x),dy=Math.sign(b-y);if(dx&&dy)throw Error('경로는 직각이어야 합니다.');while(x!==a||y!==b){p.push([x,y]);x+=dx;y+=dy;}}p.push(points.at(-1));return p;}

const {WAVES,ENEMIES}=require("data.js");

// kills/leaks remove one, while summons and splits add their actual offspring.
function remainingEnemies(game){
 const counts=new Map(),add=(kind,n=1)=>counts.set(kind,(counts.get(kind)??0)+n);
 if(!game.started)for(const [kind,n] of WAVES[game.difficulty][0])add(kind,n);
 else {for(const e of game.queue.slice(game.spawnIndex))add(e.kind);for(const e of game.enemies)if(!e.dead&&e.hp>0)add(e.kind);}

}
function encounterHTML(game){return `<div class="enemy-strip">${remainingEnemies(game).map(({kind,count})=>`<span class="enemy-count" data-enemy="${kind}" title="${ENEMIES[kind].name}" aria-label="${ENEMIES[kind].name} 남은 ${count}">${enemyIcon(kind)}<b>${count}</b></span>`).join('')}</div>`;}
function bossStatusHTML(game){
 const boss=game.enemies.find(e=>!e.dead&&ENEMIES[e.kind].finalBoss);if(!boss)return '';
 const cast=boss.boss?.cast;return `<div class="boss-status"><div><strong>${ENEMIES[boss.kind].name}</strong><span>${cast?`${cast.type==='entry'?'충격파':'마비 공격'} ${Math.max(0,cast.remaining).toFixed(1)}초`:`${Math.ceil(boss.hp).toLocaleString()} / ${boss.maxHp.toLocaleString()}`}</span></div><div class="boss-health"><i style="width:${Math.max(0,boss.hp/boss.maxHp*100)}%"></i></div></div>`;
}
function bossWarnings(game,cell){
 return game.enemies.filter(e=>!e.dead&&e.boss?.cast).map(e=>{
  const targets=e.boss.cast.targets.map(id=>game.towers.find(t=>t.id===id)).filter(Boolean);
  return `<g stroke="#ff9b9f" fill="none" stroke-width="2"><circle cx="${e.x*cell}" cy="${e.y*cell}" r="27" stroke-dasharray="5 4"/>${targets.map(t=>`<rect x="${t.x*cell-22}" y="${t.y*cell-22}" width="44" height="44"/><path d="M${t.x*cell} ${t.y*cell-15}v17m0 5v3" stroke-width="3"/>`).join('')}</g>`;
 }).join('');
}
