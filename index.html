<body><div id="app"></div><div id="modal-root"></div><div id="toast" role="status" aria-live="polite"></div><input id="import-file" type="file" accept="application/json,.json" hidden><script>
(()=>{
"use strict";
const modules={
"app.js":function(require,exports){
const {enemyMoveSpeed,CODEX_GROUPS,SCALE}=require("data.js");
const {TOWERS,TOWER,ENEMIES,MAPS,TARGETS,DIFFICULTIES,COLS,ROWS,PLACEMENT_LIMIT,starterProfile,makePath,stat,normalizeCheats,canBuyTower,purchaseTower,dims,maxLevel}=require("data.js");
const {createBoard}=require("board.js");
const {Game}=require("engine.js");
const {encounterHTML,bossStatusHTML,bossWarnings}=require("encounter-view.js");
const {ECONOMY}=require("economy.js");
const {cumulativeCost}=require("balance.js");
const {balancePanel}=require("balance-view.js");
const {installBackNavigation,preventTextSelection,installBattleShortcuts}=require("navigation.js");
const {icon,towerIcon,glyph,enemyShape,enemyIcon}=require("icons.js");
const $=s=>document.querySelector(s),app=$('#app'),modal=$('#modal-root'),KEY='grid-defense-v1';
const money=c=>(c/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const wallet=()=>profile.cheats.coins?'∞':money(profile.coins);
const seconds=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
let profile=starterProfile(),savedRun=null,game=null,screen='home',previous='home',selected=null,placing=null,dragPointer=null,board=null,boardObserver=null,legacyRunDropped=false,chosenMap=MAPS[0],controlSignature='',skipDismissed=null,offerArmedAt=0,lastSave=0,lastUI=0,toastTimer,audioContext,lastSound=0,battleSettled=false,dialogKind='';
let backNavigation,codexTab='normal';
function sanitizeProfile(p){if(!p||p.version!==1||!Number.isSafeInteger(p.coins)||p.coins<0||p.coins>1e12||!Array.isArray(p.owned)||!Array.isArray(p.loadout))throw Error('지원하지 않는 저장 파일입니다.');const out=starterProfile();out.coins=p.coins;out.owned=[...new Set(p.owned.filter(k=>TOWER[k]))];out.loadout=Array(5).fill(null);const added=new Set();p.loadout.slice(0,5).forEach((k,i)=>{if(out.owned.includes(k)&&!added.has(k)){out.loadout[i]=k;added.add(k);}});out.seen=Object.fromEntries(Object.keys(p.seen??{}).filter(k=>ENEMIES[k]).map(k=>[k,true]));out.clears=Object.fromEntries(MAPS.flatMap(m=>['normal','hard'].map(d=>`${m.id}:${d}`)).filter(k=>p.clears?.[k]).map(k=>[k,true]));for(const k of ['sound','effects','vibration'])if(typeof p.settings?.[k]==='boolean')out.settings[k]=p.settings[k];out.stats={played:Math.max(0,Math.min(100000,Number(p.stats?.played)||0)),wins:Math.max(0,Math.min(100000,Number(p.stats?.wins)||0))};out.cheats=normalizeCheats(p.cheats);out.firstVisit=p.firstVisit!==false;return out;}
function validateRun(r){if(!r)return null;if(r.version===1||r.version===2){legacyRunDropped=true;return null;}if(r.version!==3||!MAPS.some(m=>m.id===r.mapId)||!DIFFICULTIES[r.difficulty]||!Array.isArray(r.loadout)||r.loadout.some(k=>k!==null&&!TOWER[k]))throw Error('전투 데이터가 올바르지 않습니다.');for(const k of ['cash','health','time','wave','nextId','rewardCents','completed'])if(!Number.isFinite(r[k])||r[k]<0)throw Error('전투 데이터가 올바르지 않습니다.');if(r.waveEnemyVariant!==undefined&&!['base','hard-late'].includes(r.waveEnemyVariant))throw Error('적 능력치 데이터가 올바르지 않습니다.');if(r.wave>DIFFICULTIES[r.difficulty].count||r.completed>r.wave||r.cash>1e12||r.health>100)throw Error('전투 범위를 확인할 수 없습니다.');for(const [key,max,valid] of [['towers',150,t=>TOWER[t.kind]&&t.level>=1&&t.level<=maxLevel(t.kind)&&Number.isInteger(t.col)&&t.col>=0&&t.col<COLS&&Number.isInteger(t.row)&&t.row>=0&&t.row<ROWS&&[undefined,0,1,2,3].includes(t.r)],['enemies',5000,e=>ENEMIES[e.kind]&&Number.isFinite(e.hp)&&Number.isFinite(e.progress)&&(e.variant===undefined||['base','hard-late'].includes(e.variant))&&['shield','maxShield','abilityClock','hasteRemaining'].every(k=>e[k]===undefined||(Number.isFinite(e[k])&&e[k]>=0))&&(e.moveSpeed===undefined||(Number.isFinite(e.moveSpeed)&&e.moveSpeed>=0&&e.moveSpeed<=5*SCALE))&&(e.hasteMultiplier===undefined||(Number.isFinite(e.hasteMultiplier)&&e.hasteMultiplier>=1&&e.hasteMultiplier<=1.15))],['vehicles',1000,v=>['robot','spawner'].includes(v.kind)&&v.level>=1&&v.level<=maxLevel(v.kind)&&Number.isFinite(v.hp)&&(v.fireWindows===undefined||(Array.isArray(v.fireWindows)&&v.fireWindows.length<=150&&v.fireWindows.every(w=>w&&Number.isFinite(w.until)&&Number.isFinite(w.fire)&&w.fire>=1&&w.fire<=2.1)))]]){if(!Array.isArray(r[key])||r[key].length>max||!r[key].every(valid))throw Error('전투 데이터가 올바르지 않습니다.');}if(r.bombs!==undefined&&(!Array.isArray(r.bombs)||r.bombs.length>150||!r.bombs.every(b=>['x','y','x2','y2','damage','radius','remaining','duration'].every(k=>Number.isFinite(b[k]))&&b.damage>=0&&b.radius>0&&b.duration>0&&b.remaining>=0&&b.remaining<=b.duration)))throw Error('폭탄 데이터가 올바르지 않습니다.');return r.ended?null:r;}
try{const raw=localStorage.getItem(KEY);if(raw){const data=JSON.parse(raw);profile=sanitizeProfile(data.profile);savedRun=validateRun(data.run);}}catch{setTimeout(()=>toast('저장 데이터를 읽지 못했습니다. 저장 파일을 불러올 수 있습니다.'),100);}
if(legacyRunDropped)setTimeout(()=>toast('3.0으로 바뀌어 진행 중이던 전투는 이어할 수 없습니다.'),100);
function save(){try{const run=game&&!game.ended?game.snapshot():savedRun;localStorage.setItem(KEY,JSON.stringify({profile,run,updatedAt:Date.now()}));lastSave=performance.now();return true;}catch{toast('저장 공간을 확인해 주세요. 설정에서 저장 파일을 내보낼 수 있습니다.');return false;}}
function toast(text){const el=$('#toast');el.textContent=text;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2400);}
function sound(type='click'){if(!profile.settings.sound)return;try{audioContext??=new(window.AudioContext||window.webkitAudioContext)();if(audioContext.state==='suspended')audioContext.resume();const now=audioContext.currentTime;if(type==='shot'&&now-lastSound<.09)return;lastSound=now;const o=audioContext.createOscillator(),gain=audioContext.createGain();o.type=type==='shot'?'triangle':'sine';o.frequency.setValueAtTime(type==='wave'?570:type==='leak'?140:type==='shot'?220:650,now);o.frequency.exponentialRampToValueAtTime(type==='leak'?65:100,now+.08);gain.gain.setValueAtTime(type==='shot'?.015:.035,now);gain.gain.exponentialRampToValueAtTime(.001,now+.09);o.connect(gain);gain.connect(audioContext.destination);o.start(now);o.stop(now+.1);}catch{}}
function vibrate(ms=8){if(profile.settings.vibration)navigator.vibrate?.(ms);}
function button(action,label,cls='',extra=''){return `<button class="${cls}" data-action="${action}" ${extra}>${label}</button>`;}
function header(title,back='home',extra=''){return `<header class="bar"><div class="bar-title">${button(back,icon('back'),'icon flat','aria-label="뒤로"')}<h2>${title}</h2></div>${extra||`<span class="wallet">${icon('coin')}${wallet()}</span>`}</header>`;}
function setScreen(name,html){if(name!=='battle'){placing=null;dragPointer=null;}screen=name;app.innerHTML=`<main class="screen ${name}">${html}</main>`;controlSignature='';}
function slots(loadout=profile.loadout,battle=false,removable=false){return `<div class="loadout">${loadout.map((id,i)=>{const t=TOWER[id];return t?button(battle?'build':removable?'unequip':'inventory',`${towerIcon(id)}<span>${t.name}</span>${battle?`<span class="price" data-price="${id}">${money(t.cost*100)}</span>`:''}`,`slot ${removable?'removable':''} ${battle&&placing?.kind===id?'active':''}`,`style="--color:${t.color}" data-kind="${id}" aria-label="${t.name}${battle?' 배치 '+t.cost+'원':removable?' 해제':''}" ${battle&&(!game.canBuild(id)||!game.canAfford(t.cost*100))?'disabled':''}`):button(battle?'noop':'inventory',icon('plus'),'slot empty',`aria-label="빈 슬롯 ${i+1}" ${battle?'disabled':''}`);}).join('')}</div>`;}
function home(){if(game&&!game.ended){game.paused=true;savedRun=game.snapshot();}save();setScreen('home',`<header class="bar home-top"><span class="wallet">${icon('coin')}${wallet()}</span>${button('codex',icon('book'),'icon flat','aria-label="적 도감"')}</header><div class="home-center"><div class="home-title"><svg class="home-mark" viewBox="-30 -30 60 60" aria-hidden="true"><path d="M0-27 24-13.5V13.5L0 27-24 13.5V-13.5Z" fill="none" stroke="currentColor" stroke-width="2"/>${glyph('soldier')}</svg><h1>타워<br>디펜스</h1></div><nav class="home-menu">${button('play',`<span>플레이</span>${icon('play')}`,'primary')}${button('inventory',`<span>인벤토리</span>${icon('inventory')}`)}${button('settings',`<span>설정</span>${icon('settings')}`)}</nav></div><div class="home-bottom">${slots()}</div>`);}
function openDialog(title,body,buttons,kind='dialog'){dialogKind=kind;modal.innerHTML=`<div class="overlay"><section class="dialog" role="dialog" aria-modal="true" aria-label="${title}"><h2>${title}</h2>${body}<div class="dialog-actions">${buttons}</div></section></div>`;modal.querySelector('button')?.focus();}
function closeDialog(){dialogKind='';modal.innerHTML='';}
function play(){if((game&&!game.ended)||savedRun){openDialog('진행 중인 전투',`<p>${MAPS.find(m=>m.id===(game?.map.id??savedRun.mapId)).name} · ${DIFFICULTIES[game?.difficulty??savedRun.difficulty].name}<br>${game?.wave??savedRun.wave} 웨이브</p>`,button('resume-saved','이어하기','primary')+button('new-game','새 게임')+button('close-dialog','취소','flat'));}else maps();}
// Small static picture of the map for the menus.
function mapSVG(map){const pts=a=>a.map(p=>p.join(',')).join(' '),road=map.points.map(([x,y])=>`${x+.5},${y+.5}`).join(' '),tone={cliff:'#33404c','cliff-block':'#33404c',water:'#14313d',rock:'#2f3a45',pallet:'#2f3a45'},end=map.points.at(-1);
 return `<svg viewBox="0 ${map.viewTop} ${COLS} ${ROWS-map.viewTop}" aria-hidden="true"><rect x="-10" y="-10" width="${COLS+20}" height="${ROWS+20}" fill="#0b0f14"/><polygon points="${pts(map.ground)}" fill="#19212a" stroke="#26303b" stroke-width=".6"/>${map.features.map(f=>f.circle?`<circle cx="${f.circle[0]}" cy="${f.circle[1]}" r="${f.circle[2]}" fill="#2b3540"/>`:`<polygon points="${pts(f.poly)}" fill="${tone[f.kind]??'#2b3540'}"/>`).join('')}<polyline points="${road}" fill="none" stroke="#47515b" stroke-width="3" stroke-linejoin="miter"/><polyline points="${road}" fill="none" stroke="#2f373f" stroke-width="2.6" stroke-linejoin="miter"/><polyline points="${road}" fill="none" stroke="${map.color}" stroke-width=".4" stroke-dasharray="1.2 2.4"/><circle cx="3" cy="${map.points[1][1]+.5}" r="1.8" fill="${map.color}"/><rect x="${end[0]-1.5}" y="${end[1]-2.5}" width="4" height="4" fill="none" stroke="#ea7f90" stroke-width=".7"/></svg>`;}

function maps(){closeDialog();setScreen('maps',header('맵 선택')+`<div class="scroll map-list">${MAPS.map(m=>button('choose-map',`<div class="map-thumb">${mapSVG(m,true)}</div><div class="map-label"><div><h3>${m.name}</h3><div class="muted">${m.difficulty} · ${makePath(m.points).length-1}칸</div></div><span class="rate">×${m.mult.toFixed(2)}</span></div>`,'map-card',`data-map="${m.id}"`)).join('')}</div>`);}
function difficulty(map){chosenMap=map;setScreen('difficulty',header(map.name,'maps')+`<div class="scroll"><div class="difficulty-preview">${mapSVG(map)}</div><div class="terrain-legend"><span><i class="buildable-key"></i>배치 가능</span><span><i class="blocked-key">×</i>배치 불가</span></div>${Object.entries(DIFFICULTIES).map(([id,d])=>{const first=!profile.clears[`${map.id}:${id}`],reward=Math.round(d.reward*map.mult*100*(first?1.2:1));return button('start-game',`<div><strong>${d.name}</strong><p>${d.count} 웨이브</p></div><div><div class="reward">${icon('coin')}<span>${money(reward)}</span><small>크레딧</small></div><div class="first-clear">${first?'첫 클리어 +20%':'클리어 완료'}</div></div>`,'difficulty-card',`data-difficulty="${id}"`);}).join('')}</div>`);}
function inventory(){setScreen('inventory',header('인벤토리')+`<div class="inventory-slots">${slots(profile.loadout,false,true)}</div><div class="scroll">${[1,2,3,4].map(tier=>`<div class="section-label"><span>티어 ${tier}</span><span>${TOWERS.filter(t=>t.tier===tier).length}종</span></div>${TOWERS.filter(t=>t.tier===tier).map(t=>{const owned=profile.owned.includes(t.id),equipped=profile.loadout.includes(t.id);return `<article class="inventory-card"><button class="tower-face" style="--color:${t.color}" data-action="tower-info" data-kind="${t.id}" aria-label="${t.name} 상세">${towerIcon(t.id)}</button><div class="inventory-copy"><h3>${t.name}</h3><p class="tower-description">${t.desc}</p></div>${button(owned?(equipped?'unequip':'equip'):'buy',owned?(equipped?'해제':'장착'):`${icon('coin')} ${money(t.unlock*100)}`,`inventory-action ${owned?(equipped?'unequip-button':'equip-button'):canBuyTower(profile,t.id)?'credit':'credit-off'}`,`data-kind="${t.id}" ${!owned&&!canBuyTower(profile,t.id)?'disabled':''}`)}</article>`;}).join('')}`).join('')}</div>`);}
function balance(){setScreen('balance',header('밸런스 기준','back-balance','<span></span>')+balancePanel());}
function towerInfo(id){const t=TOWER[id];openDialog(t.name,`<div class="tower-face" style="--color:${t.color};margin-bottom:16px">${towerIcon(id)}</div><p>${t.detail}</p><div class="keyline"><span>크기</span><span>${t.size[0]}×${t.size[1]}칸${t.turns?' · 회전 가능':''}</span></div>${t.placementLimit?`<div class="keyline"><span>배치 한도</span><span>${t.placementLimit}개</span></div>`:""}<div class="keyline"><span>배치</span><span class="cash">${money(t.cost*100)}</span></div>${t.upgrades.map((v,i)=>`<div class="keyline"><span><strong class="upgrade-name">${t.upgradeNames[i]}</strong><small class="upgrade-detail">Lv.${i+1} → Lv.${i+2} · ${t.notes[i]}</small></span><span class="cash">${money(v*100)}<small class="upgrade-detail">누적 ${money(cumulativeCost(id,i+2)*100)}</small></span></div>`).join('')}<div style="height:16px"></div>`,button('close-dialog','닫기','primary'));}
function buy(id){const t=TOWER[id];if(!canBuyTower(profile,id))return;openDialog(`${t.name} 해금`,`<p>${t.detail}</p><div class="result-row big"><span>${icon('coin')}</span><span>${money(t.unlock*100)}</span></div>`,button('confirm-buy','해금','primary',`data-kind="${id}"`)+button('close-dialog','취소','flat'));}
function confirmBuy(id){const t=TOWER[id];if(!canBuyTower(profile,id))return;const empty=profile.loadout.indexOf(null);if(!purchaseTower(profile,id))return;save();closeDialog();inventory();toast(empty!==-1?'해금하고 빈 슬롯에 장착했습니다.':'해금했습니다.');}
function refreshInventory(){const scroll=$('.inventory .scroll'),top=scroll?.scrollTop??0;save();inventory();const next=$('.inventory .scroll');if(next)next.scrollTop=top;}
function unequip(id){const index=profile.loadout.indexOf(id);if(index===-1)return;profile.loadout[index]=null;refreshInventory();}
function equip(id){if(!profile.owned.includes(id)||profile.loadout.includes(id))return;const empty=profile.loadout.indexOf(null);if(empty!==-1){profile.loadout[empty]=id;refreshInventory();return;}openDialog('교체할 타워 선택',`<div class="dialog-loadout">${profile.loadout.map((k,i)=>button('swap',towerIcon(k),'',`data-kind="${id}" data-slot="${i}" aria-label="${TOWER[k].name} 교체"`)).join('')}</div>`,button('close-dialog','취소','flat'));}

function codex(tab=codexTab){codexTab=tab==='hard'?'hard':'normal';const ids=CODEX_GROUPS[codexTab],seen=ids.filter(k=>profile.seen[k]).length;setScreen('codex',header('적 도감','home',`<span class="muted small">${seen} / ${ids.length}</span>`)+`${codexTab==='hard'?`<p class="codex-note muted small">어려움 모드에서는 모든 적의 체력과 보호막이 ${Math.round((DIFFICULTIES.hard.hpScale-1)*100)}% 많습니다.</p>`:''}<nav class="codex-tabs" aria-label="도감 분류">${['normal','hard'].map(id=>button('codex-tab',id==='normal'?'일반':'어려움',id===codexTab?'active':'',`data-kind="${id}" aria-pressed="${id===codexTab}"`)).join('')}</nav><div class="scroll codex-grid">${ids.map(id=>{const e=ENEMIES[id];return profile.seen[id]?`<article class="enemy-card" data-enemy="${id}">${enemyIcon(id)}<h3>${e.name}</h3><div class="enemy-stats"><span>HP ${e.hp.toLocaleString()}</span>${e.shield?`<span class="shield-stat">보호막 ${e.shield.toLocaleString()}</span>`:''}<span>${enemyMoveSpeed(id)>0?enemyMoveSpeed(id).toFixed(3)+'칸/초':'이동 안 함'}</span></div><p>${e.desc}</p></article>`:`<article class="enemy-card locked">${icon('lock')}<span class="small">미발견</span></article>`;}).join('')}</div>`);}

function settings(from=screen){if(from!=='settings')previous=from;if(game&&!game.ended)game.paused=true;setScreen('settings',header('설정','back-settings','<span></span>')+`<div class="scroll">${[['sound','효과음'],['effects','공격 효과'],['vibration','진동']].map(([key,label])=>`<div class="setting-row"><span>${label}</span><button role="switch" aria-checked="${profile.settings[key]}" aria-label="${label}" data-action="toggle-setting" data-key="${key}" class="switch ${profile.settings[key]?'on':''}"></button></div>`).join('')}<div class="section-label"><span>개발 치트</span></div>${[['lives','무한 라이프'],['cash','무한 전투 자금'],['coins','무한 크레딧']].map(([key,label])=>`<div class="setting-row"><span>${label}</span><button role="switch" aria-checked="${profile.cheats[key]}" aria-label="${label}" data-action="toggle-cheat" data-key="${key}" class="switch ${profile.cheats[key]?'on':''}"></button></div>`).join('')}<p class="cheat-help">전투에도 즉시 적용됩니다. 끄면 기존 잔액을 사용합니다.</p><div class="setting-row"><span>타워·도감 전체 해금</span>${allUnlocked()?'<span class="muted small">해금 완료</span>':button('unlock-all','해금','')}</div><div class="setting-row"><div>자동 저장<p>현재 기기·브라우저에 저장됩니다.<br>기기를 옮길 때는 저장 파일을 사용하세요.</p></div>${icon('check')}</div><div class="setting-actions">${button('export',`${icon('download')} 내보내기`)}${button('import',`${icon('upload')} 불러오기`)}</div><div class="setting-row">${button('balance','밸런스 기준','flat')}</div><div class="setting-row">${button('guide',`${icon('info')} 조작 안내`,'flat')}</div><div class="setting-row"><span>클리어</span><span class="mono">${profile.stats.wins}</span></div></div>`);}
// Cheat: own every tower and mark every enemy as seen.

function unlockAll(){profile.owned=[...new Set([...profile.owned,...TOWERS.map(t=>t.id)])];for(const k of Object.keys(ENEMIES))profile.seen[k]=true;save();settings('settings');toast('모든 타워와 도감을 해금했습니다.');}

function towerStats(t){const d=TOWER[t.kind],s=stat(t),i=t.level-1;if(t.kind==='farm')return `수입 <b>${money(d.income[i]*100)}</b><span>주기 <b>${s.period}초</b></span><span>효율 <b>${Math.round(game.farmEfficiency()*100)}%</b></span><span>누적 <b>${money((t.produced??0)*100)}</b></span>`;if(t.kind==='flame')return `화상 <b>${d.burn[i]} / ${d.burnInterval}초</b><span>지속 <b>${d.burnDuration[i]}초</b></span><span>감속 <b>20%</b></span><span>사거리 <b>${(s.range*game.buffs(t).range).toFixed(1)}</b></span>`;if(t.kind==='commander')return `공속 <b>+${Math.round((d.boost[i]-1+(t.active>0?d.activeFire[i]-1:0))*100)}%</b><span>사거리 <b>+${Math.round((d.rangeBoost[i]-1+(t.active>0?d.activeRange[i]-1:0))*100)}%</b></span><span>범위 <b>${s.range}</b></span>`;if(d.hp)return `차량 HP <b>${d.hp[i].toLocaleString()}</b><span>출격 <b>${s.period}초</b></span><span>다음 <b id="launch-countdown">${Math.ceil(Math.max(0,t.cooldown))}초</b></span>`;const buff=game.buffs(t);return `<span>피해 <b>${t.kind==='shotgun'?`${s.damage}+${d.spreadDamage[i]}×${d.extra[i]}`:t.kind==='laser'?`${s.damage}→${Math.round(s.damage*d.cap[i])}`:s.damage+(d.burst?'×'+d.burst[i]:'')}</b></span><span>사거리 <b>${(s.range*buff.range).toFixed(1)}</b></span><span>${d.burst?'재장전':t.kind==='laser'?'틱':'주기'} <b>${(s.period/buff.fire).toFixed(2)}초</b></span>${(d.camoLevel??99)<=t.level?'<span style="color:var(--accent)">히든</span>':''}`;}
function renderControls(force=false){if(screen!=='battle')return;const t=game.towers.find(t=>t.id===selected),key=[selected,t?.level,t?.target,t?.disabled>0,placing?.kind,placing?.mode,placing?.r,game.started,game.paused,game.phase,game.wave,game.ended].join(':');if(force||key!==controlSignature){controlSignature=key;if(t){const d=TOWER[t.kind],cost=t.level<maxLevel(t.kind)?d.upgrades[t.level-1]*100:0;$('#tower-controls').innerHTML=`<div class="tower-heading"><div><strong style="color:${d.color}">${d.name}</strong><span class="level">Lv.${t.level}</span></div><div>${t.kind==='commander'&&t.level>=3?button('ability','콜 투 암즈','ability',`id="ability-button"`):''}${button('deselect',icon('close'),'icon','aria-label="선택 해제"')}</div></div><div class="stats" id="selected-stats">${towerStats(t)}</div><div class="next-upgrade">${t.level<maxLevel(t.kind)?`<strong class="upgrade-name">${d.upgradeNames[t.level-1]}</strong><span class="upgrade-stats">Lv.${t.level+1} · ${d.notes[t.level-1]}</span>`:""}</div><div class="actions"><select id="target-select" aria-label="타겟 우선순위" ${['farm','commander','spawner','robot','gauss'].includes(t.kind)?'disabled':''}>${Object.entries(TARGETS).map(([id,label])=>`<option value="${id}" ${t.target===id?'selected':''}>${label}</option>`).join('')}</select>${button('upgrade',`${icon('upgrade')}<span>${t.level>=maxLevel(t.kind)?'최대 레벨':t.disabled>0?'마비 중':money(cost)}</span>`,'primary',`id="upgrade-button" ${t.level>=maxLevel(t.kind)||t.disabled>0||!game.canAfford(cost)?'disabled':''}`)}${button('sell',`${icon('sell')}<span class="button-value">${money(Math.floor(t.spent*70/100))}</span>`,'danger')}</div>`;}else{const d=TOWER[placing?.kind],[w,h]=d?dims(placing.kind,placing.r):[0,0];$('#tower-controls').innerHTML=d?`<div class="placement-controls"><div class="tower-heading"><strong style="color:${d.color}">${d.name}<span class="level">${w}×${h}</span></strong><span class="cash small">${money(d.cost*100)}</span></div><span class="small muted" id="pla   const nextTime=$('#next-wave-time');if(nextTime)nextTime.textContent=waveStatus();
  if(t){const stats=$('#selected-stats');if(stats)stats.innerHTML=towerStats(t);const launch=$('#launch-countdown');if(launch)launch.textContent=`${Math.ceil(Math.max(0,t.cooldown))}초`;const up=$('#upgrade-button');if(up)up.disabled=t.level>=maxLevel(t.kind)||t.disabled>0||!game.canAfford(TOWER[t.kind].upgrades[t.level-1]*100);const ability=$('#ability-button');if(ability){ability.textContent=t.active>0?`콜 투 암즈 ${Math.ceil(t.active)}초`:t.abilityCooldown>0?`${Math.ceil(t.abilityCooldown)}초`:'콜 투 암즈';ability.disabled=t.abilityCooldown>0||game.paused||t.disabled>0;}}

function updateBattleUI(){if(screen!=='battle')return;const info=$('#encounter-info'),content=encounterHTML(game);if(info.dataset.signature!==content){const scroll=info.scrollLeft;info.innerHTML=content;info.scrollLeft=scroll;info.dataset.signature=content;}$('#boss-info').innerHTML=bossStatusHTML(game);$('#hud-placement').textContent=`${game.placementCount()}/${PLACEMENT_LIMIT}`;$('#hud-wave').textContent=`${game.wave}/${game.config.count}`;$('#hud-health').textContent=game.cheats.lives?'∞':game.health;$('#hud-cash').textContent=game.cheats.cash?'∞':money(game.cash);$('#wave-caption').textContent=game.phase==='intermission'?`${game.wave+1} 웨이브 준비 · +${money(game.lastWaveCash*100)}`:`${game.map.name} · ${game.config.name}`;$('#wave-clock').textContent=!game.started?'준비':game.paused?'일시정지':game.phase==='intermission'?`인터미션 ${Math.ceil(game.intermissionTime)}초`:`${seconds(game.time)} · ${game.wave===game.config.count?'남은 적 '+(game.enemies.length+game.queue.length-game.spawnIndex):'다음 '+Math.ceil(nextWaveIn())+'초'}`;$('#wave-progress').style.width=`${game.phase==='intermission'?(1-game.intermissionTime/ECONOMY.intermissionSeconds)*100:game.started?Math.min(100,game.waveTime/game.waveDuration*100):0}%`;$('#speed-button').textContent=`${game.started?game.playbackRate:game.speed}×`;for(const el of $('#battle-slots').querySelectorAll('[data-kind]')){const id=el.dataset.kind,d=TOWER[id],blocked=game.placementBlock(id);el.disabled=!!blocked||!game.canAfford(d.cost*100);el.setAttribute('aria-label',`${d.name} 배치 ${blocked||d.cost+'원'}`);const price=el.querySelector('[data-price]');if(price)price.textContent=blocked?'한도':money(d.cost*100);el.classList.toggle('active',placing?.kind===el.dataset.kind);}updateOffer();renderControls();}
// Top-of-map prompt: the start button before the battle, then the skip offer.
// The skip offer hides while paused, and a fresh one ignores presses for OFFER_ARM ms
// (the button fills up meanwhile) so rapid taps cannot skip a wave by accident.
const OFFER_ARM=1000;
function offerMode(){return game.ended?'':!game.started?'start':game.paused?'resume':game.canSkip()&&!(skipDismissed?.g===game&&skipDismissed.w===game.wave)?'skip':'';}
// Time until the next wave arrives on its own: what is left of this wave plus the intermission.
function nextWaveIn(){return game.phase==='intermission'?game.intermissionTime:Math.max(0,game.waveDuration-game.waveTime)+ECONOMY.intermissionSeconds;}
function updateOffer(){const el=$('#wave-offer');if(!el)return;const mode=offerMode(),key=mode&&`${mode}:${game.wave}`;
 if(el.dataset.key!==key){el.dataset.key=key;el.hidden=!mode;
  if(mode==='start')el.innerHTML=button('next-wave',`${icon('play')}<span>1 웨이브 시작</span>`,'primary','id="next-wave-button"');
  else if(mode==='resume')el.innerHTML=`<div class="skip-text"><strong>일시정지</strong></div>${button('run',`${icon('play')}<span>계속하기</span>`,'primary','id="resume-button"')}`;
  else if(mode==='skip'){offerArmedAt=performance.now()+OFFER_ARM;el.innerHTML=`<div class="skip-text"><strong>스킵할까요?</strong><span class="mono" id="skip-left"></span></div>${button('skip-wave',`${icon('next')}<span>스킵</span>`,'primary arming','id="skip-button"')}${button('skip-dismiss',icon('close'),'icon','aria-label="스킵 닫기"')}`;}
  else el.innerHTML='';}
 if(mode==='skip')$('#skip-left').textContent=`${Math.ceil(nextWaveIn())}초 남음`;}
function skipArmed(){return $('#wave-offer')?.dataset.key===`skip:${game.wave}`&&performance.now()>=offerArmedAt;}
// Pressing the button while it is still filling starts the fill over, so a burst of taps never gets through.
document.addEventListener('pointerdown',e=>{const b=e.target.closest?.('#skip-button');if(!b||performance.now()>=offerArmedAt)return;offerArmedAt=performance.now()+OFFER_ARM;b.classList.remove('arming');void b.offsetWidth;b.classList.add('arming');},true);
function drawBattle(){if(screen!=='battle'||!board||!game)return;const shown=placing&&(placing.mode==='pending'||placing.shown)?placing:null;board.draw(game,{selected,placing:shown,effects:profile.settings.effects,time:game.time});}
function mountBoard(){const cv=$('#board');board=createBoard(cv,game.map);boardObserver?.disconnect();boardObserver=new ResizeObserver(()=>{board.resize();drawBattle();});boardObserver.observe(cv);board.resize();bindBoard(cv);}
function boardPoint(e){const r=$('#board').getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top,e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom];}
// Clipping: a footprint that does not fit where it is aimed moves to the nearest spot that fits.
const CLIP=[];for(let dy=-9;dy<=9;dy++)for(let dx=-9;dx<=9;dx++){const d=Math.hypot(dx,dy);if(d<=9)CLIP.push([dx,dy,d]);}CLIP.sort((a,b)=>a[2]-b[2]);
function clipAt(kind,wx,wy,r,prev){const[w,h]=dims(kind,r),tx=Math.round(wx-w/2),ty=Math.round(wy-h/2);let best=null;for(const[dx,dy,d]of CLIP)if(game.canPlace(kind,tx+dx,ty+dy,r)){best={x:tx+dx,y:ty+dy,d};break;}
 // keep the previous spot when it is about as close, so the ghost does not flicker between two gaps
 if(best&&prev?.ok&&prev.kind===kind&&prev.r===r&&game.canPlace(kind,prev.x,prev.y,r)&&Math.hypot(prev.x-tx,prev.y-ty)<=best.d+.8)return{kind,r,x:prev.x,y:prev.y,ok:true};
 return best?{kind,r,x:best.x,y:best.y,ok:true}:{kind,r,x:tx,y:ty,ok:false};}
function placeAtCenter(kind,r=0){const v=board.view(),[wx,wy]=board.toWorld(v.W/2,v.H/2);return{...clipAt(kind,wx,wy,r,null),mode:'pending'};}
// Touch lifts the ghost above the finger so the finger never hides it.
const liftPx=e=>e.pointerType==='mouse'?0:Math.max(56,Math.min(84,board.view().H*.11));
function placementHint(){if(!placing)return '';const block=game.placementBlock(placing.kind);if(block)return block;if(!game.canAfford(TOWER[placing.kind].cost*100))return '전투 자금이 부족합니다';if(placing.mode==='drag')return '막힌 곳에서는 가까운 빈자리에 붙습니다';return placing.ok?'끌어서 옮기거나 지도를 눌러 옮깁니다':'놓을 자리가 없습니다 · 다른 곳을 누르세요';}
function towerAt(wx,wy){const x=Math.floor(wx),y=Math.floor(wy);if(x>=0&&y>=0&&x<COLS&&y<ROWS){const id=game.occ[y*COLS+x];if(id)return game.towers.find(t=>t.id===id);}
 const pad=14/board.view().scale;let best=null,bd=Infinity;for(const t of game.towers){const d=Math.hypot(Math.max(t.col-wx,0,wx-t.col-t.w),Math.max(t.row-wy,0,wy-t.row-t.h));if(d<=pad&&d<bd){bd=d;best=t;}}return best;}
function overGhost(wx,wy){if(placing?.mode!=='pending')return false;const[w,h]=dims(placing.kind,placing.r),pad=Math.max(1,22/board.view().scale);return wx>=placing.x-pad&&wx<=placing.x+w+pad&&wy>=placing.y-pad&&wy<=placing.y+h+pad;}
function tapBoard(wx,wy){if(!game||game.ended)return;if(placing?.mode==='pending'){placing={...clipAt(placing.kind,wx,wy,placing.r,null),mode:'pending'};sound();}else{const t=towerAt(wx,wy);selected=t?.id??null;if(t)sound();}renderControls(true);updateBattleUI();drawBattle();}
function rotatePlacing(){if(placing?.mode!=='pending'||!TOWER[placing.kind].turns)return false;const[w,h]=dims(placing.kind,placing.r);placing={...clipAt(placing.kind,placing.x+w/2,placing.y+h/2,(placing.r+1)%4,null),mode:'pending'};return true;}
function confirmPlacement(){if(!game||game.ended||placing?.mode!=='pending')return;const block=game.placementBlock(placing.kind);if(block){toast(block);updateBattleUI();return;}
 if(!placing.ok||!game.canPlace(placing.kind,placing.x,placing.y,placing.r)){toast('배치할 수 없는 구역입니다.');return;}const placed=game.place(placing.kind,placing.x,placing.y,placing.r);if(!placed){toast('전투 자금이 부족합니다.');updateBattleUI();return;}

function terrainGrid(map){let g=GRIDS.get(map);if(g)return g;g=new Uint8Array(COLS*ROWS);
 for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const cx=x+.5,cy=y+.5;let v=inPoly(cx,cy,map.ground)?0:1;if(!v)for(const f of map.features){if(f.circle?Math.hypot(cx-f.circle[0],cy-f.circle[1])<=f.circle[2]:inPoly(cx,cy,f.poly)){v=2;break;}}g[y*COLS+x]=v;}
 const P=map.points;for(let i=0;i<P.length-1;i++){const[a,b]=P[i],[c,d]=P[i+1];for(let x=Math.min(a,c)-1;x<=Math.max(a,c)+1;x++)for(let y=Math.min(b,d)-1;y<=Math.max(b,d)+1;y++)if(x>=0&&y>=0&&x<COLS&&y<ROWS)g[y*COLS+x]=3;}
 GRIDS.set(map,g);return g;}

// Starting cash, damage cash and the five-second intermission are user requirements.
// Wave reward amounts are tuning defaults.

const ECONOMY=Object.freeze({startingCash:350,damageCash:1,waveBase:90,waveStep:18,intermissionSeconds:5});
const waveCash=wave=>Math.round(ECONOMY.waveBase+wave*ECONOMY.waveStep);

"encounter-view.js":function(require,exports){
const {WAVES,ENEMIES}=require("data.js");
const {enemyIcon}=require("icons.js");
// Count scheduled + living enemies. Spawning moves one between the two sets;
// kills/leaks remove one, while summons and splits add their actual offspring.
function remainingEnemies(game){
 const counts=new Map(),add=(kind,n=1)=>counts.set(kind,(counts.get(kind)??0)+n);
 if(!game.started)for(const [kind,n] of WAVES[game.difficulty][0])add(kind,n);
 else {for(const e of game.queue.slice(game.spawnIndex))add(e.kind);for(const e of game.enemies)if(!e.dead&&e.hp>0)add(e.kind);}
 return Object.keys(ENEMIES).filter(k=>counts.get(k)>0).map(kind=>({kind,count:counts.get(kind)}));
}
function encounterHTML(game){return `<div class="enemy-strip">${remainingEnemies(game).map(({kind,count})=>`<span class="enemy-count" data-enemy="${kind}" title="${ENEMIES[kind].name}" aria-label="${ENEMIES[kind].name} 남은 ${count}">${enemyIcon(kind)}<b>${count}</b></span>`).join('')}</div>`;}
function bossStatusHTML(game){
 const boss=game.enemies.find(e=>!e.dead&&ENEMIES[e.kind].finalBoss);if(!boss)return '';
 const cast=boss.boss?.cast;return `<div class="boss-status"><div><strong>${ENEMIES[boss.kind].name}</strong><span>${cast?`${cast.type==='entry'?'충격파':'마비 공격'} ${Math.max(0,cast.remaining).toFixed(1)}초`:`${Math.ceil(boss.hp).toLocaleString()} / ${boss.maxHp.toLocaleString()}`}</span></div><div class="boss-health"><i style="width:${Math.max(0,boss.hp/boss.maxHp*100)}%"></i></div></div>`;
}
function bossWarnings(game,cell){
 return game.enemies.filter(e=>!e.dead&&e.boss?.cast).map(e=>{
  const targets=e.boss.cast.targets.map(id=>game.towers.find(t=>t.id===id)).filter(Boolean);
  return `<g stroke="#ff9b9f" fill="none" stroke-width="2"><circle cx="${e.x*cell}" cy="${e.y*cell}" r="27" stroke-dasharray="5 4"/>${targets.map(t=>`<rect x="${t.x*cell-22}" y="${t.y*cell-22}" width="44" height="44"/><path d="M${t.x*cell} ${t.y*cell-15}v17m0 5v3" stroke-width="3"/>`).join('')}</g>`;
 }).join('');
}

Object.defineProperty(exports,"bossStatusHTML",{enumerable:true,get:()=>bossStatusHTML});
Object.defineProperty(exports,"bossWarnings",{enumerable:true,get:()=>bossWarnings});
Object.defineProperty(exports,"encounterHTML",{enumerable:true,get:()=>encounterHTML});
Object.defineProperty(exports,"remainingEnemies",{enumerable:true,get:()=>remainingEnemies});
},
