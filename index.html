// ---- 4.3.20: gauss as an industrial machine, laser as a railgun ---------------------------
// Square-cut shapes only (no rounded corners): corners are cut at 45° like the people tokens.

// rectangle x0..x1 × y0..y1 with its corners cut by k (front = +x side, back = -x side)
const cut = (x0, y0, x1, y1, kf, kb = kf) => [x0 + kb, y0, x1 - kf, y0, x1, y0 + kf, x1, y1 - kf, x1 - kf, y1, x0 + kb, y1, x0, y1 - kb, x0, y0 + kb];
// warning stripes (45°) laid on the band x0..x1 × y0..y1, clipped to it
function stripes(x0, y0, x1, y1, step, fill) {
  const h = y1 - y0;
  let out = "";
  for (let s = x0 - h; s < x1; s += step * 2) {
    let poly = [[s, y1], [s + step, y1], [s + step + h, y0], [s + h, y0]];
    for (const [ax, sign] of [[x0, 1], [x1, -1]]) {
      const res = [];
      for (let i = 0; i < poly.length; i++) {
        const p = poly[i], q = poly[(i + 1) % poly.length], ip = (p[0] - ax) * sign >= 0, iq = (q[0] - ax) * sign >= 0;
        if (ip) res.push(p);
        if (ip !== iq) res.push([ax, p[1] + ((q[1] - p[1]) * (ax - p[0])) / (q[0] - p[0])]);
      }
      poly = res;
      if (!poly.length) break;
    }
    if (poly.length >= 3) out += P(poly.flat(), fill);
  }
  return out;
}

// Gauss 3x3: an industrial shaker. A heavy plate (진동판) on a bolted skid; on it a
// housing with two exciter motors and the electromagnet between them that throws
// the pulse. Lv2 확장 진동판: the plate grows out over the skid with bolted wings.
// Lv3 산업용 진동로: the housing becomes a furnace with glowing vents and two stacks.
TOWERS.gauss = (lv) => {
  let b = pad(3, 3) + P(cut(-23, -23, 23, 23, 3), "floor");
  // anchor feet at the corners
  for (const sx of [-1, 1]) for (const sy of [-1, 1]) b += R(sx * 19.4 - 3.6, sy * 19.4 - 3.6, 7.2, 7.2, "steel") + R(sx * 19.4 - 1.5, sy * 19.4 - 1.5, 3, 3, "plate");
  // the plate (Lv2 wider, with bolted wings left and right)
  const pw = lv >= 2 ? 19.4 : 17;
  if (lv >= 2) for (const s of [-1, 1]) b += R(s * 21.6 - 2.4, -10, 4.8, 20, "c-46") + R(s * 21.6 - 1, -7.4, 2, 2, "c-14") + R(s * 21.6 - 1, 5.4, 2, 2, "c-14");
  b += R(-pw, -pw, pw * 2, pw * 2, "c-62") + R(-pw + 1.2, -pw + 1.2, pw * 2 - 2.4, pw * 2 - 2.4, "none", 0, ' stroke="c-42" stroke-width="1.2"');
  // warning stripes along the open ends of the plate
  for (const s of [-1, 1]) {
    const y0 = s < 0 ? -pw + 2.6 : pw - 6.4;
    b += R(-pw + 2.6, y0, pw * 2 - 5.2, 3.8, "c-76") + stripes(-pw + 2.6, y0, pw - 2.6, y0 + 3.8, 2.4, "c+30");
  }
  // spring mounts at the plate corners: the machine floats on them
  for (const sx of [-1, 1]) for (const sy of [-1, 1]) {
    const x = sx * (pw - 2.6), y = sy * (pw - 2.6);
    b += R(x - 3, y - 3, 6, 6, "steelHi");
    for (const k of [-1.6, 0, 1.6]) b += R(x - 3, y + k - 0.35, 6, 0.7, "steel");
  }
  if (lv < 3) {
    // housing
    b += P(cut(-14.4, -9.6, 14.4, 9.6, 2.6), "c-34") + P(cut(-12.8, -8, 12.8, 8, 1.8), "c-8");
    // exciter motors: finned bodies with a flywheel at the outer end
    for (const s of [-1, 1]) {
      const x0 = s < 0 ? -11.2 : 4.4;
      b += R(x0, -5.8, 6.8, 11.6, "c+18");
      for (let k = 1; k < 5; k++) b += R(x0 + (6.8 * k) / 5 - 0.4, -5.8, 0.8, 11.6, "c-14");
      b += R(s < 0 ? -13.6 : 11.6, -7, 2, 14, "steelHi");
    }
    // the electromagnet: a winding block with the pole face in the middle
    b += R(-3.2, -6.4, 6.4, 12.8, "c-54");
    for (const y of [-5, -2.6, 1.8, 4.2]) b += R(-2.4, y, 4.8, 0.8, "c-12");
    b += R(-1.8, -1.4, 3.6, 2.8, "c!");
  } else {
    // furnace: thick walls, glowing vents, stacks on one side
    b += P(cut(-15.6, -11, 15.6, 11, 3), "c-40") + P(cut(-13.8, -9.2, 13.8, 9.2, 2), "c-10") + P(cut(-10.4, -6.4, 7, 6.4, 1.4), "c+16");
    for (const y of [-4.4, -1.1, 2.2]) b += R(-8, y, 13, 2.2, "c-60") + R(-7.2, y + 0.5, 11.4, 1.2, "c!");
    b += R(8.4, -8.6, 7.4, 7.4, "steelHi") + R(9.9, -7.1, 4.4, 4.4, "hole") + R(9.2, 2, 5.6, 5.6, "steelHi") + R(10.4, 3.2, 3.2, 3.2, "hole");
    // heavy coolers on the plate wings
    for (const s of [-1, 1]) {
      b += R(s * 18 - 2.4, -9, 4.8, 18, "steel");
      for (let k = 1; k < 6; k++) b += R(s * 18 - 2.4, -9 + 3 * k - 0.4, 4.8, 0.8, "plate");
    }
  }
  return { base: b };
};

// Laser 3x3: a railgun turret. Capacitor bars across the back, an armoured body cut at
// 45°, two rails held by braces. Lv2 과출력 축전지: a second capacitor bar, Lv3 집속 렌즈:
// a lens at the muzzle, Lv4 죽음의 광선: long heavy rails, three braces and side armour,
// and the whole gun goes dark so only its lights carry the tower color.
TOWERS.laser = (lv) => {
  const base = pad(3, 3) + P(cut(-22, -22, 22, 22, 7), "floor") + P(cut(-20.4, -20.4, 20.4, 20.4, 6.4), "none", ' stroke="steel" stroke-width="1.4"');
  const dark = lv >= 4;
  // tones: [outline, body, top, brace edge, brace face, capacitor, slot/bore, rail, rail edge]
  const [kO, kB, kT, bO, bF, kC, kS, kR, kRh] = dark
    ? ["rubber", "hull", "steel", "rubber", "hull", "rubber", "hole", "plate", "steelHi"]
    : ["c-44", "c-16", "c+8", "c-30", "c+14", "c-52", "c-72", "steelHi", "gunHi"];
  let t = "";
  // capacitor bars laid across the back: terminals at both ends on a shared strap,
  // a lit charge strip down the middle of each
  const bars = lv >= 2 ? 2 : 1, bw = 4.6, x0 = -11.4 - bars * (bw + 0.6);
  for (const y of [-13, 11.2]) t += R(x0 - 0.4, y, bars * (bw + 0.6) + 0.6, 1.8, "steel");
  for (let k = 0; k < bars; k++) {
    const x = x0 + k * (bw + 0.6);
    t += R(x, -11.4, bw, 22.8, kC) + R(x + 1.3, -8.6, 2, 17.2, kS) + R(x + 1.7, -7.8, 1.2, 15.6, "c!");
  }
  // hull: the turret core, a squat block with its corners cut, a hatch on top
  const hx = dark ? 6 : 5;
  if (dark) for (const s of [-1, 1]) t += P(s < 0 ? [-9.4, -12, 2, -12, 0, -14.6, -7.4, -14.6] : [-9.4, 12, 2, 12, 0, 14.6, -7.4, 14.6], "hull");
  t += P(cut(-11, -12, hx, 12, 3.4, 2), kO) + P(cut(-9.4, -10.4, hx - 1.6, 10.4, 2.6, 1.4), kB) + P(cut(-7.4, -7, 0.6, 7, 1.4), kT);
  t += R(-6, -5.6, 3.6, 3.6, dark ? "rubber" : "c-30") + R(-5.2, -4.8, 2, 2, dark ? "c!" : "c+30");
  // rails, tips cut like blades, the bore between them
  const end = dark ? 34 : 28, rw = dark ? 4.2 : 3.6, gap = 2.2;
  t += R(hx - 1, -gap, end - hx - 2, gap * 2, kS);
  for (const s of [-1, 1]) {
    const yi = s * gap, yo = s * (gap + rw);
    t += P([hx - 1, yi, end, yi, end - rw * 1.2, yo, hx - 1, yo], kR) + P([hx - 1, s * (gap + 0.5), end - 1.4, s * (gap + 0.5), end - 2.4, s * (gap + 1.5), hx - 1, s * (gap + 1.5)], kRh);
  }
  // braces over the rails: a big one at the root, smaller ones further out;
  // on the dark gun each carries two small lights where it grips the rails
  const brace = (x, w, out) => {
    const h = gap + rw + out;
    let r = R(x, -h, w, h * 2, bO) + R(x + 0.7, -h + 0.8, w - 1.4, (h - 0.8) * 2, bF);
    if (dark) for (const s of [-1, 1]) r += R(x + w / 2 - 0.7, s * (h - 1.9) - 0.7, 1.4, 1.4, "c!");
    return r;
  };
  if (!dark) t += brace(hx + 1.6, 4, 1.6) + brace(hx + 11, 2.6, 0.8);
  else t += brace(hx + 1.6, 4.4, 2.2) + brace(hx + 9.4, 3.6, 1.8) + brace(hx + 16.4, 3, 1.4);
  // Lv3: a focusing lens at the muzzle, a frame wider than the rails around a lit pane;
  // before that the slug glows in the bore
  if (lv >= 3) {
    const lx = end - 9.4, ly = gap + rw + 2.4;
    t += P(cut(lx, -ly, lx + 5.4, ly, 1.4), kO) + P(cut(lx + 0.9, -ly + 0.9, lx + 4.5, ly - 0.9, 1), dark ? "hull" : "plate") + P(cut(lx + 1.5, -gap - 0.4, lx + 3.9, gap + 0.4, 0.6), "c!");
  } else t += R(end - 7, -1, 4, 2, "c!");
  return { base, turret: t };
};

// ---- 플래티넘 미니건 (6×3): a round turntable between two power units, a huge mounted
// rotary cannon worked by a platinum gunner in a wraparound visor and finned headgear.
// Lv2 GRIP: spade grips in both hands, a rangefinder, struts. Lv3 BFG469: thick barrels,
// a muzzle brake, twin drums, lit coils. Lv4 승천: bright trim, heat-sink wings, a halo
// (the rotating ring aura around the pad is drawn by the board).
TOWERS.platinum = (lv) => {
  // base: a long slab, a power unit at each end with a cable into the turntable, the round pad on top
  let base = R(-58.8, -14.6, 117.6, 29.2, "pad", 5);
  for (const s of [-1, 1]) {
    const x0 = s > 0 ? 35 : -58;
    base += R(x0 + (s > 0 ? -9 : 21), -3, 11, 6, "rubber", 1.5);
    base += R(x0, -12.4, 23, 24.8, "hull", 3) + R(x0 + 1.6, -10.8, 19.8, 21.6, "steel", 2);
    for (let k = 0; k < 4; k++) base += R(x0 + 3.6 + k * 4.4, -8.4, 2.2, 10.8, "rubber", 0.6);
    for (let k = 0; k < 3; k++) base += R(x0 + 4 + k * 5.8, 5.4, 3.4, 2.4, "c!", 0.6);
  }
  base += C(0, 0, 29.2, "pad") + C(0, 0, 26.8, "none", ' stroke="c" stroke-width="2.4"') + C(0, 0, 24.4, "floor");
  for (let k = 0; k < 12; k++) {
    const a = (k / 12) * Math.PI * 2;
    base += C(Math.cos(a) * 21.6, Math.sin(a) * 21.6, 1, "steel");
  }
  const big = lv >= 3, top = lv >= 4;
  // turret: the turntable ring, then the gun, then the gunner over it
  let t = C(0, 0, 16.4, "c-62") + C(0, 0, 14.2, "c-38") + C(0, 0, 10.6, "c-52");
  // Lv4: heat-sink wings swept back from the receiver, lit at the tips
  if (top) for (const s of [-1, 1]) {
    t += P([-1, s * 10, 12, s * 10, 4, s * 25, -12, s * 28.6], "c-50") + P([1, s * 11.4, 9.6, s * 11.4, 2.6, s * 22.4, -8.4, s * 25.2], "c+14");
    for (const k of [0, 1, 2]) t += L(2.4 - k * 3.6, s * (13 + k * 1.2), -2.6 - k * 3.6, s * (21.4 + k * 1.4), "c-30", 1.1);
    t += P([-12, s * 28.6, -8.4, s * 25.2, -6.2, s * 27.2], "c!");
  }
  // Lv3+: twin ammo drums on the receiver's sides, a lit core in each
  if (big) for (const s of [-1, 1]) {
    t += R(0, s * 11 - (s > 0 ? 0 : 3), 6, 3, "c-50");
    t += C(3, s * 17, 7.4, "c-62") + C(3, s * 17, 6, "c-24") + C(3, s * 17, 3.4, "c-55") + C(3, s * 17, 1.8, "c!");
  }
  // barrels: five visible tubes of the six, light steel so the aim reads; held by shroud bands
  const end = lv >= 4 ? 58 : big ? 55 : lv >= 2 ? 50 : 46, bw = big ? 2 : 1.6, ys = big ? [-5.2, -2.6, 0, 2.6, 5.2] : [-4.4, -2.2, 0, 2.2, 4.4];
  const hy = big ? 11.4 : 9.8;
  t += R(17, -(ys[4] + 1.8), end - 17, (ys[4] + 1.8) * 2, "c-62", 1.6);
  ys.forEach((y, k) => (t += L(18, y, end - 1, y, k % 2 ? "gun" : "gunHi", bw, ROUND)));
  const bands = big ? [24, 33, 42] : [26, end - 9];
  for (const x of bands) t += R(x, -(ys[4] + 2.4), 2.4, (ys[4] + 2.4) * 2, top ? "c+30" : "c-18", 0.8);
  if (big) for (const x of [28.6, 37.6]) t += R(x, -(ys[4] + 1.6), 1.6, (ys[4] + 1.6) * 2, "c!");
  // muzzle: a cap, or at Lv3+ a slotted brake wider than the barrels
  if (big) t += P(cut(end - 3, -9.6, end + 4.6, 9.6, 2.4), "c-55") + P(cut(end - 2, -8.4, end + 3.4, 8.4, 1.8), top ? "c+22" : "c-22") + R(end - 0.6, -6.4, 1.2, 4.2, "hole") + R(end - 0.6, 2.2, 1.2, 4.2, "hole") + R(end + 1.6, -6.4, 1.2, 4.2, "hole") + R(end + 1.6, 2.2, 1.2, 4.2, "hole");
  else t += R(end - 2, -(ys[4] + 1.6), 3, (ys[4] + 1.6) * 2, "steel", 1);
  // receiver: a long cut block, lighter top plate, a lit sight window; Lv4 gets lit seams
  t += P(cut(-5, -hy, 19, hy, 3.6), "c-44") + P(cut(-3.4, -hy + 1.6, 17.4, hy - 1.6, 2.6), top ? "c+30" : "c+4") + P(cut(1, -hy + 4.4, 13, hy - 4.4, 1.6), top ? "c+46" : "c+20");
  t += R(9, -1.6, 5, 3.2, "c-62", 0.6) + R(10, -0.8, 3, 1.6, "c!");
  if (top) for (const s of [-1, 1]) t += L(-2.6, s * (hy - 0.9), 16.6, s * (hy - 0.9), "c!", 0.7);
  // Lv1: one ammo box on the left with its belt; Lv2+: the rangefinder on top instead
  if (!big) t += R(-4, -20.4, 13, 8, "c-55", 1.4) + R(-2.6, -19, 3, 5.2, "c-30", 0.5) + L(4, -12.4, 5.4, -hy, "c+28", 1.8, ' stroke-dasharray="1.2 0.8"');
  if (lv >= 2) t += R(4, -hy - 4.4, 15, 3.6, "c-62", 1) + R(5, -hy - 3.6, 11, 2, "c-30", 0.6) + R(18.2, -hy - 4, 2, 2.8, "c!", 0.5);
  // Lv2+: struts from the turntable to the receiver, and spade grips back to the hands
  for (const s of [-1, 1]) {
    if (lv >= 2) t += L(-9, s * 12, 2, s * (hy - 0.4), "steel", 2.2, ROUND) + L(-5, s * 6.6, -8.6, s * 6.6, "steelHi", 2.4) + R(-10.6, s * 6.6 - 2.8, 2.6, 5.6, "rubber", 0.8);
    else t += L(-5, s * 6.6, -8.4, s * 6.6, "steel", 1.6);
  }
  // gunner: an eraser token behind the gun, both hands forward on the grips
  const gx = -24;
  let p = body({ head: "c+46", torso: "c-6", legs: "c-40" });
  // shoulder plates
  for (const s of [-1, 1]) p += P([-6, s * 13, 3, s * 13, 2, s * 15.4, -5, s * 15.4], "c+18");
  // finned headgear: a ridge over the crown and two fins swept back past the shoulders
  for (const s of [-1, 1]) p += P([12, s * 12.4, 5, s * 13, -2, s * 18.6, 2.6, s * 13.2], top ? "c+40" : "c+20") + P([10.4, s * 12.6, 5.4, s * 13.1, 0.6, s * 16.6], "c-36");
  p += R(-1, -1.6, 13, 3.2, top ? "c+50" : "c+24", 1) + R(0, -0.6, 11, 1.2, "c-30");
  // wraparound visor across the face: dark shield, a lit slit
  p += P([8.8, -13, 12.4, -11.4, 13.4, -6, 13.4, 6, 12.4, 11.4, 8.8, 13, 7.6, 9, 7.6, -9], "c-76") + P([10.6, -10.6, 12.2, -9.4, 12.2, 9.4, 10.6, 10.6, 9.8, 7.6, 9.8, -7.6], "c!");
  // hands on the grips
  for (const s of [-1, 1]) p += R(13.2, s * 6.6 - 2.1, 4.2, 4.2, "c+46", 0, ' stroke="c+12" stroke-width="0.8"');
  // Lv4: the halo floating over the head, a soft glow under a bright core
  if (top) p += C(8.5, 0, 15.6, "none", ' stroke="c!" stroke-width="5" opacity="0.28"') + C(8.5, 0, 15.6, "none", ' stroke="c!" stroke-width="1.9"') + C(8.5, 0, 15.6, "none", ' stroke="#ffffff" stroke-width="0.6" opacity="0.85"');
  t += G("", p, ` transform="translate(${gx} 0)"`);
  return { base, turret: t };
};

// ---- the spawner's car ---------------------------------------------------------
// Lv1 jeep, Lv2 spiked bumper, Lv3 explosive crates in the back, Lv4 an armored
// car with six wheels and a machine-gun turret (turns to its target).
function carUnit(lv) {
  let p = "";
  if (lv < 4) {
    for (const x of [-13, 13]) for (const s of [-1, 1]) p += R(x - 5, s > 0 ? 9.4 : -15, 10, 5.6, "rubber", 1.6);
    p += C(-23.6, 0, 4.4, "rubber") + C(-23.6, 0, 2, "steel"); // spare tire
    p += R(-22, -11.4, 44, 22.8, "c-38", 4); // tub
    p += R(6, -10.4, 15, 20.8, "c", 3) + L(9, -6, 18, -6, "c-20", 0.9) + L(9, 6, 18, 6, "c-20", 0.9); // hood
    p += R(3, -10.6, 2.8, 21.2, "paint", 1); // windshield
    if (lv < 3) p += R(-7, -8.6, 7.4, 7.4, "c-62", 1.6) + R(-7, 1.2, 7.4, 7.4, "c-62", 1.6) + R(-14, -9, 3, 18, "c-55", 1); // seats
    p += R(-10.4, -11.4, 2, 22.8, "steel"); // roll bar
    if (lv >= 2) {
      p += R(21.6, -12.4, 3, 24.8, "steel", 1);
      for (const y of [-9, -3, 3, 9]) p += P([24.6, y - 2.2, 29.4, y, 24.6, y + 2.2], "gunHi");
    }
    if (lv >= 3) {
      // explosive crate with warning stripes, two drums
      p += R(-21, -9.6, 14, 19.2, "c-55", 1.4);
      for (let k = 0; k < 4; k++) p += R(-19.4 + k * 3.2, -8.2, 1.6, 16.4, "c+35");
      p += C(-3, -5.4, 3.4, "c-30") + C(-3, -5.4, 1.4, "c+20") + C(-3, 5.4, 3.4, "c-30") + C(-3, 5.4, 1.4, "c+20");
    }
    return p;
  }
  if (lv >= 5) {
    // Lv5 tank: tracks, sloped hull, engine deck, a wide turret with a long gun
    let ta = "", tb = "";
    for (const s of [-1, 1]) {
      const y0 = s > 0 ? 10.6 : -17.8;
      p += R(-27, y0, 54, 7.2, "rubber", 2.4);
      for (let x = -23; x <= 23.01; x += 4.6) ta += L(x, y0 + 1, x, y0 + 6.2, "steel", 1.2);
      for (let x = -20.7; x <= 20.71; x += 4.6) tb += L(x, y0 + 1, x, y0 + 6.2, "steel", 1.2);
    }
    p += G("treadA", ta) + G("treadB", tb, ' data-off="1"');
    p += P([-25, -11, 19, -11, 26, -5.4, 26, 5.4, 19, 11, -25, 11], "c-30");
    p += P([-21, -8, 15, -8, 20.4, -3.6, 20.4, 3.6, 15, 8, -21, 8], "c-12");
    for (const x of [-21.4, -18.6, -15.8]) p += L(x, -6, x, 6, "c-40", 1); // engine deck grille
    // side machine gun: a round sponson on the right edge of the hull, its own small turret (mg)
    p += C(12, 9.6, 4.6, "c-40");
    p += G("mg", C(12, 9.6, 3.4, "c-12") + R(12, 8.4, 12, 2.4, "hull", 0.5) + R(22.4, 7.9, 2.8, 3.4, "rubber", 0.6) + C(10.6, 9.6, 1.3, "c+40"), ' data-pivot="12,9.6"');
    p += G("turret", C(-2, 0, 9.4, "c-40") + P([-11, -7.4, 4, -8.4, 9.6, -4.4, 9.6, 4.4, 4, 8.4, -11, 7.4], "c") +
      R(9, -1.7, 26, 3.4, "gunHi", 0.6) + R(32, -2.5, 4, 5, "gun", 0.8) + C(-4.4, 0, 2.4, "c+40") + R(-9.6, -6.4, 3.2, 3.2, "plate", 0.6), ' data-pivot="-2,0"');
    return p;
  }
  // Lv4 armored car
  for (const x of [-16, 0, 16]) for (const s of [-1, 1]) p += R(x - 4.6, s > 0 ? 11 : -16.6, 9.2, 5.6, "rubber", 1.6);
  p += P([-24, -12, 18, -12, 26, -5, 26, 5, 18, 12, -24, 12], "c-30");
  p += P([-20, -9, 15, -9, 21, -4, 21, 4, 15, 9, -20, 9], "c-12");
  p += R(17, -6, 2, 4, "hole") + R(17, 2, 2, 4, "hole"); // vision slits
  for (const [x, y] of [[-20, -9], [-20, 9], [12, -9], [12, 9]]) p += C(x, y, 0.9, "c+20");
  p += G("turret", C(-3, 0, 7.6, "c-40") + C(-3, 0, 6, "c") + R(2, -1.3, 20, 2.6, "gunHi", 0.6) + R(14, -2, 2, 4, "gun") + C(-3, 0, 2.2, "c+40"));
  return p;
}

// Garage 3x5: same language as the robot factory; the car of the current
// level waits inside while none of this garage's cars are out.
TOWERS.spawner = (lv) => {
  let b = R(-30, -50, 60, 100, "hall") + R(-24, -26, 48, 70, "bay", 2);
  for (const x of [-12, 0, 12]) b += L(x, -23, x, 41, "bayLine", 1.4);
  for (const s of [-1, 1]) {
    const x = s * 26.6 - 1.6;
    b += R(x, -26, 3.2, 70, "rail");
    for (let y = -23; y < 42; y += 10) b += R(x, y, 3.2, 4.6, "c-35");
  }
  b += R(-22, -50, 44, 19, "c");
  for (const y of [-45.4, -41, -36.6]) b += L(-19.6, y, 19.6, y, "c-62", 1.8);
  b += R(-22, -29.6, 44, 2, "slot") + G("sortie", R(-22, -29.6, 44, 2, "c+25"), ' data-pivot="-22,0"');
  b += G("parked", carUnit(lv), ' transform="translate(0 9) rotate(-90)"');
  b += G("empty", R(-13, -14, 26, 46, "none", 0, ' stroke="c-30" stroke-width="1.8" stroke-dasharray="6 4"'), ' data-off="1"');
  b += R(-28.8, -48.8, 57.6, 97.6, "none", 2.4, ' stroke="c" stroke-width="2.4"');
  return { base: b };
};

// ---- 해골 공장's skeleton ------------------------------------------------------------
// A person token in bone: a skull for a head (blurred like the smiley), ribs over a dark
// chest sweeping back from the spine, longest and brightest in front, and a pelvis band
// for legs. Empty hands at the sides swap front and back with every step.
function skeletonUnit() {
  let p = band(-13, "c-30") + band(TX, "c-55");
  p += R(-7, -1.3, 11.2, 2.6, "c-12"); // spine
  for (const [x, w, t, tone] of [[2.4, 11, 2, "c"], [-0.8, 10.2, 1.8, "c-8"], [-4, 8.8, 1.6, "c-18"]]) {
    const sw = 1.8; // sweep toward the back at the sides
    p += P2([x + t / 2, 1.3, x - sw + t / 2, w, x - sw - t / 2, w, x - t / 2, 1.3], tone);
  }
  p += band(HX, "c") + G("", `<image href="skull" x="-11" y="-4.3" width="22" height="8.6"/>`, ` transform="translate(8.5 0) rotate(-90)"`);
  const hand = (x, side) => R(x, side > 0 ? 11.8 : -15.6, 3.8, 3.8, "c", 0, ' stroke="c-30" stroke-width="0.8"');
  p += G("handA", hand(3, 1) + hand(-5, -1)) + G("handB", hand(-5, 1) + hand(3, -1), ' data-off="1"');
  return p;
}
// The roster's last step, the skeleton knight: the same token in ghost teal under a steel
// breastplate and shoulder plates, the skeleton's face drawn bright, and a ghost sword in the right
// hand that turns to its target and swings through each cut.
function knightUnit() {
  let p = band(-13, "c-45") + band(TX, "c-62");
  // ghost armor: plates of the same teal, darker, a raised ridge and a glowing seam
  p += P([-6.6, -10.4, 3.6, -11.4, 3.6, 11.4, -6.6, 10.4], "c-58") + R(-6.6, -1.2, 10.2, 2.4, "c-30") + L(-4.8, -8.2, -4.8, 8.2, "c!", 0.9);
  for (const s of [-1, 1]) p += R(-4.8, s > 0 ? 9.4 : -14.6, 7.8, 5.2, "c-30", 1.6) + R(-3.6, s > 0 ? 10.6 : -13.4, 5.4, 2.8, "c-58", 1); // shoulder plates
  p += band(HX, "c") + G("", `<image href="skullB" x="-11" y="-4.3" width="22" height="8.6"/>`, ` transform="translate(8.5 0) rotate(-90)"`);
  const y = GY;
  const sword = R(-3.4, y - 0.9, 6.6, 1.8, "steel", 0.6) + R(2.6, y - 3.4, 1.8, 6.8, "steelHi", 0.6) +
    P([4.4, y - 1.7, 23, y - 1.2, 26.4, y, 23, y + 1.2, 4.4, y + 1.7], "c!") + L(5.2, y, 22.6, y, "c+75", 0.7);
  p += R(-1.4, -15.6, 3.8, 3.8, "c+42", 0, ' stroke="c+12" stroke-width="0.8"'); // empty left hand
  p += G("turret", sword + R(-1.6, 11.8, 3.8, 3.8, "c+42", 0, ' stroke="c+12" stroke-width="0.8"'));
  return p;
}

// ---- ICU 전선 (4.4): a silver-white forward base and its units ----------------------------------
// Everything is square-cut (45° corners), light silver steps of the tower color, and only the lights
// glow (c!). Units face +x like the other units; the base's gate is on the top edge like the garages.

// Chaos Trooper: an armored eraser token with a visored helmet; minigun in the right hand, grenade
// launcher in the left. Mk II (Lv.2) gets shoulder plates and a wide lit visor (it sees hidden
// enemies); from Lv.3 the armor turns dark.
function icuTrooper(lv) {
  const dark = lv >= 3, mk2 = lv >= 2, y = GY;
  const legs = dark ? "c-70" : "c-42", torso = dark ? "c-58" : "c-16", head = dark ? "c-40" : "c+22";
  // weapons sit outside the token and under it
  let p = R(-3.4, y - 2.6, 9.4, 5.2, "steelHi") + R(-1.6, y - 3.4, 3.6, 6.8, "steel");
  for (const d of [-1.4, 0, 1.4]) p += L(6, y + d, 19.6, y + d, "gunHi", 1);
  p += R(15.4, y - 2.4, 1.6, 4.8, "gun");
  p += R(-2.6, -y - 2.2, 7.4, 4.4, "steel") + R(4.8, -y - 2.9, 9.4, 5.8, "plate") + R(14.2, -y - 2.1, 1.4, 4.2, "hole");
  p += band(-13, legs) + band(TX, torso) + band(HX, head);
  // chest plate and belt
  p += P(cut(-5.6, -9.4, 2.4, 9.4, 1.8), dark ? "c-44" : "c+4") + R(-7.4, -11.6, 1.2, 23.2, dark ? "c-78" : "c-46");
  // helmet: a raised crest and the visor across the front
  p += R(4.8, -1, 3.6, 2, dark ? "c-28" : "c+46");
  p += P([8.4, -11.6, 10.6, -11.6, 12.4, -9.8, 12.4, 9.8, 10.6, 11.6, 8.4, 11.6], "c-76");
  p += mk2 ? R(9.6, -9, 1.8, 18, "c!") : R(9.8, -5.6, 1.2, 11.2, "c!");
  if (mk2) for (const s of [-1, 1]) p += P(cut(-4.8, s > 0 ? 9.8 : -14.6, 3.4, s > 0 ? 14.6 : -9.8, 1.4), dark ? "c-64" : "c-34");
  const hand = (x, s) => R(x, s > 0 ? 11.8 : -15.6, 3.8, 3.8, dark ? "c-30" : "c+22", 0, ' stroke="c-50" stroke-width="0.8"');
  return p + hand(4.6, 1) + hand(2.6, -1);
}

// Rocket truck: a six-wheeled carrier with a four-tube launcher that turns to its target.
// Mk II (Lv.3+): an armored wedge cab, side skirts, a radar panel and a heavier launcher.
function icuTruck(lv) {
  const mk2 = lv >= 3;
  let p = "";
  const axles = mk2 ? [-17, -6.4, 4.2, 15.6] : [-15, -3.4, 15];
  for (const x of axles) for (const s of [-1, 1]) p += R(x - 4.2, s > 0 ? 10.4 : -16, 8.4, 5.6, "rubber");
  if (!mk2) {
    p += R(-22, -11.6, 46, 23.2, "c-46");
    p += P(cut(11.6, -10.6, 24.4, 10.6, 3.6, 0.8), "c-10") + R(19.4, -8.4, 2.4, 16.8, "c-74") + R(13.4, -9, 4.8, 18, "c+16");
    p += R(-21, -10.6, 31, 21.2, "c-32");
    for (const yy of [-7.4, 7.4]) p += R(-19.6, yy - 0.6, 28, 1.2, "c-52");
  } else {
    p += P(cut(-25, -12.6, 28, 12.6, 2, 1), "c-50");
    for (const s of [-1, 1]) {
      const y0 = s > 0 ? 12.6 : -16.6;
      p += P(cut(-23, y0, 14, y0 + 4, 1.2), "c-30");
      for (const x of [-18, -4, 9]) p += R(x - 0.8, y0 + 1.2, 1.6, 1.6, "c+20");
    }
    p += P([12, -11.6, 22, -11.6, 30, -4, 30, 4, 22, 11.6, 12, 11.6], "c-14") + P([22.6, -8.4, 27.6, -3.4, 27.6, 3.4, 22.6, 8.4], "c-76") + R(13.6, -10, 5.6, 20, "c+18");
    p += R(14.6, -4, 3.6, 8, "steel") + R(15.4, -3.2, 2, 6.4, "c!"); // radar panel on the cab roof
    p += R(-24, -11.4, 34.6, 22.8, "c-34");
  }
  // launcher: a box of four tubes seen from above, a lit cap on each missile
  const w = mk2 ? 22 : 18, h = mk2 ? 19.6 : 16.8, x0 = -5 - w / 2, cell = mk2 ? 7.4 : 6.2, gap = mk2 ? 1.8 : 1.4;
  let t = P(cut(x0, -h / 2, x0 + w, h / 2, 2), "c-60") + P(cut(x0 + 1.2, -h / 2 + 1.2, x0 + w - 1.2, h / 2 - 1.2, 1.4), "c-6");
  for (const sx of [-1, 1]) for (const sy of [-1, 1]) {
    const cx = -5 + sx * (cell / 2 + gap / 2), cy = sy * (cell / 2 + gap / 2);

// Striker (after the reference): a dark, faceted heavy tank. Wide tracks with pale pads on the
// outer edge, a wedge glacis, louvers on the rear deck, a row of lights along each side skirt,
// a faceted turret with an octagonal hatch, three slats on its flank and a banded barrel.
// Dark steps of the tower color only; the lights and the outline are the neon.
const NEON = (w) => ` stroke="c!" stroke-width="${w}" stroke-linejoin="miter"`;
function icuTank() {
  let hull = "", a = "", b = "";
  for (const s of [-1, 1]) {
    const y0 = s > 0 ? 13 : -25, edge = s > 0 ? y0 + 9 : y0 + .4;
    hull += P(cut(-29, y0, 29, y0 + 12, 3.4), "c-86");
    for (let x = -22; x <= 22.01; x += 8.8) a += P(cut(x - 3, edge, x + 3, edge + 2.6, 1), "c-46");
    for (let x = -17.6; x <= 17.61; x += 8.8) b += P(cut(x - 3, edge, x + 3, edge + 2.6, 1), "c-46");
  }

  low += P([12, -13.6, 26.4, -6, 26.4, 6, 12, 13.6], "c-68"); // glacis
  for (let k = 0; k < 6; k++) low += R(-25 + k * 2.6, -7.6, 1.2, 15.2, "c-46"); // rear louvers
  for (const s of [-1, 1]) {

  let t = R(6, -2.2, 34, 4.4, "c-54", 0, NEON(.6));
  for (const x of [14, 20, 26]) t += R(x, -2.7, 2.2, 5.4, "c-86");
  t += R(37, -2.8, 4, 5.6, "c-62", 0, NEON(.5));
  t += P([-19, -8.4, -13.4, -12.4, 3, -12.4, 9, -6.6, 9, 6.6, 3, 12.4, -13.4, 12.4, -19, 8.4], "c-70", NEON(.7));

  t += R(-16.6, 7.4, 6, 1, "c!") + R(-1, 9, 5, 1, "c!");

  low += P(cut(-30, -26, 30, 26, 4), "none", NEON(1.1));
  return hull + G("treadA", a) + G("treadB", b, ' data-off="1"') + low + G("turret", t, ' data-pivot="-4,0"');
}

// 리콘 정비선 (after Bliss of Finality, seen from above), built the way this game builds things:
// a white body, brighter raised plates on it, black seams on the plates and neon running between
// the black seams. A wide stern with three thrusters and two pairs of swept wings; the hull
// narrows into a long spine with prongs at the nose. Its weapons are turrets that turn to what
// they shoot: two heavy machine guns on the waist, the flash cannon on the stern, the railgun on
// the spine (groups mgL, mgR, flash, rail; o gives their angles relative to the hull).
// About 130 units long; the board draws it 6.8× (about 44 cells).
function icuShip() {
  const N = NEON(.7);
  let p = "";
  // black seam pair with a neon line between them, along a straight run
  const seam = (x1, y1, x2, y2, gap, w = .8) => {
    const dx = x2 - x1, dy = y2 - y1, l = Math.hypot(dx, dy), nx = -dy / l * gap, ny = dx / l * gap;
    return L(x1 + nx, y1 + ny, x2 + nx, y2 + ny, "c-86", w) + L(x1 - nx, y1 - ny, x2 - nx, y2 - ny, "c-86", w) + L(x1, y1, x2, y2, "c!", w * .8);
  };
  for (const s of [-1, 1]) {
    const W = (pts) => pts.map((v, i) => (i % 2 ? v * s : v)), y = (v) => v * s;
    // big rear wings: body, a raised plate, a black panel split by a neon line, the lit tip
    p += P(W([-32.6, 14, -42.6, 39, -51.4, 39, -47.6, 14]), "c+12", N);
    p += P(W([-35.4, 16, -43.4, 36, -49, 36, -45.8, 16]), "c+36");
    p += P(W([-38.6, 20.4, -42.8, 31, -46.2, 31, -44.6, 20.4]), "c-86") + L(-41.6, y(20.4), -44.5, y(31), "c!", .8);
    p += R(-50.8, s > 0 ? 36.8 : -38.4, 8, 1.6, "c!") + L(-50.4, y(35.4), -43, y(35.4), "c-86", .7);
    // small forward wings
    p += P(W([-19.4, 14, -23.6, 26, -29.6, 26, -28.6, 14]), "c+12", N);
    p += P(W([-21.4, 15.6, -24.4, 23.8, -28.2, 23.8, -27.4, 15.6]), "c+36");
    p += P(W([-23, 17.4, -24.8, 22, -26.8, 22, -26.2, 17.4]), "c-86") + R(-29, s > 0 ? 24.6 : -26, 5.6, 1.4, "c!");
    // engine housings at the stern corners
    p += P(W([-64, 7, -52, 7, -50, 9, -50, 16, -64, 16]), "c+12", N) + P(W([-62.4, 8.6, -53, 8.6, -51.6, 10, -51.6, 14.4, -62.4, 14.4]), "c+36");
    p += L(-60, y(11.5), -54, y(11.5), "c-86", .8) + R(-66, s > 0 ? 9 : -15, 2, 6, "c!");
  }
  // stern block: two raised plates with seams, a black channel with a neon core between them
  p += P(cut(-62, -15.6, -26, 15.6, 2, 3), "c+12", N);
  for (const s of [-1, 1]) {
    p += P(cut(-59.4, s > 0 ? 4 : -13.4, -29, s > 0 ? 13.4 : -4, 1.6), "c+36");
    for (const x of [-52, -43, -34]) p += L(x, s * 5, x, s * 12.4, "c-86", .8);
    for (const x of [-57.6, -55.2]) p += R(x, s > 0 ? 6 : -11.4, 1.2, 5.4, "c-86");
  }
  p += R(-61, -2.8, 32, 5.6, "c-86") + R(-59, -.5, 28, 1, "c!");
  for (const y of [-9, 0, 9]) p += R(-64.4, y - 2, 2.4, 4, "c-60") + R(-65.6, y - 1.4, 1.2, 2.8, "c!"); // thrusters
  // waist: narrows into the spine; seams follow both slopes
  p += P([-27, -15.6, -14, -15.6, -3.6, -5, -3.6, 5, -14, 15.6, -27, 15.6], "c+12", N) + P([-25, -13.4, -15, -13.4, -6.6, -5, -6.6, 5, -15, 13.4, -25, 13.4], "c+36");
  for (const s of [-1, 1]) p += seam(-14.6, s * 11.6, -8, s * 5, 1);
  p += R(-24.6, -.4, 14, .8, "c-86");
  // spine: a raised plate, the long black channel with its neon core, a black keel at the nose
  p += P([-8, -4.6, 54, -4.6, 57, -1.8, 57, 2.2, 54, 5, -8, 5], "c+12", N) + P(cut(-5.6, -3.4, 52, 3.6, 1.6), "c+36");
  p += seam(-4, .1, 50, .1, 1.5, .9);
  for (const x of [8, 26, 44]) p += L(x, -3.4, x, -2.2, "c-86", .8) + L(x, 2.4, x, 3.6, "c-86", .8);
  for (const [yy, len] of [[-2.4, 12], [-.8, 16.5], [.8, 16.5], [2.4, 12]]) p += R(57, yy - .3, len, .6, "c+40") + R(57 + len - 1.6, yy - .3, 1.6, .6, "c!");
  // turrets: dark so the weapons stand out on the white hull, a neon rim on each
  const mg = (side) => G(side > 0 ? "mgR" : "mgL", P(cut(-3.4, -3, 3.4, 3, 1.2), "c-80", NEON(.5)) + R(2.4, -1.6, 9, .9, "c-86") + R(2.4, .7, 9, .9, "c-86") + R(10.4, -.5, 1.2, 1, "c!"),
    ` transform="translate(-16.4 ${side * 9.4})" data-pivot="0,0"`);
  p += mg(-1) + mg(1);
  p += G("flash", P(cut(-6.6, -6.6, 6.6, 6.6, 2.2), "c-80", NEON(.6)) + P(cut(-4.6, -4.6, 3, 4.6, 1.4), "c-66") + R(4, -4.4, 5, 8.8, "c-86") + R(7.6, -3.4, 1.4, 6.8, "c!") + R(-3, -.5, 5, 1, "c!"),
    ' transform="translate(-44 0)" data-pivot="0,0"');
  p += G("rail", P(cut(-6, -4.6, 6, 4.6, 1.6), "c-80", NEON(.6)) + R(4, -2.6, 27, 1.6, "c-70") + R(4, 1, 27, 1.6, "c-70") + R(6, -.5, 23, 1, "c!") + R(29.6, -3.2, 2, 6.4, "c-86"),
    ' transform="translate(20 0)" data-pivot="0,0"');
  return p;
}

// The base, 10×10: one big command building in the middle, a parking lot all around it where the
// units of the current level stand (troopers, then the rocket truck, then the Striker). The gate is
// on the building's top face; the bar above it fills toward the next trooper.
TOWERS.icu = (lv) => {
  let b = R(-100, -100, 200, 200, "hall") + R(-93, -93, 186, 186, "bay");
  // painted stalls on the four sides
  let m = "";
  for (let y = -78; y <= 78; y += 17.3) m += L(-91, y, -64, y, "paint", 1.2) + L(64, y, 91, y, "paint", 1.2);
  for (let x = -40; x <= 40; x += 20) m += L(x, -91, x, -78, "paint", 1.2) + L(x, 78, x, 91, "paint", 1.2);
  b += G("", m, ' opacity="0.3"');
  // the building
  b += P(cut(-58, -58, 58, 58, 10), "c-46", NEON(1.6)) + P(cut(-52, -52, 52, 52, 8), "c-10") + P(cut(-36, -36, 36, 36, 6), "c+14");
  b += P(cut(-16, -16, 16, 16, 4), "c-40") + P(cut(-10, -10, 10, 10, 2.6), lv >= 5 ? "c!" : "c-14");
  for (const s of [-1, 1]) b += R(s > 0 ? 40 : -46, -24, 6, 48, "c-28") + R(-24, s > 0 ? 40 : -46, 48, 6, "c-28");
  b += R(-26, -60, 52, 12, "c") ;
  for (const y of [-57, -53.6]) b += R(-24, y, 48, 1.2, "c-46");
  b += R(-26, -66, 52, 2.4, "slot") + G("sortie", R(-26, -66, 52, 2.4, "c!"), ' data-pivot="-26,0"');
  // parked units
  const park = (x, y, rot, k, body) => G("", body, ` transform="translate(${x} ${y}) rotate(${rot}) scale(${k})"`);
  for (const x of [-40, 0, 40]) b += park(x, 76, -90, .8, icuTrooper(lv));
  if (lv >= 2) b += park(-77, 0, -90, .82, icuTruck(lv));
  if (lv >= 4) b += park(77, 0, -90, .7, icuTank());
  b += R(-97.6, -97.6, 195.2, 195.2, "none", 0, NEON(2.8));
  return { base: b };
};

// ---- compile SVG into canvas draw lists ------------------------------------------
const listCache = new Map();
function parseTransform(s) {
  const ops = [];
  if (!s) return ops;
  for (const m of s.matchAll(/(translate|rotate|scale)\(([^)]*)\)/g)) ops.push([m[1], m[2].trim().split(/[\s,]+/).map(Number)]);
  return ops;
}
function roundRectPath(x, y, w, h, r) {
  const p = new Path2D();
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  p.moveTo(x + r, y);
  p.arcTo(x + w, y, x + w, y + h, r);
  p.arcTo(x + w, y + h, x, y + h, r);
  p.arcTo(x, y + h, x, y, r);
  p.arcTo(x, y, x + w, y, r);
  p.closePath();
  return p;
}
function compileNode(el, c, inherit) {
  const out = [];
  for (const n of el.children) {
    const a = (k, d) => n.getAttribute(k) ?? d;
    const style = {
      fill: color(a("fill", inherit.fill), c),
      stroke: color(a("stroke", inherit.stroke), c),
      sw: +a("stroke-width", inherit.sw),
      cap: a("stroke-linecap", inherit.cap),
      dash: a("stroke-dasharray", inherit.dash)
    };
    if (n.tagName === "g") {
      out.push({
        group: true,
        id: n.getAttribute("id") || "",
        off: n.hasAttribute("data-off"),
        pivot: (n.getAttribute("data-pivot") || "0,0").split(",").map(Number),
        tf: parseTransform(n.getAttribute("transform")),
        opacity: n.hasAttribute("opacity") ? +n.getAttribute("opacity") : null,
        kids: compileNode(n, c, style)
      });
      continue;
    }
    const num = (k) => +a(k, 0);
    if (n.tagName === "image") {
      out.push({ img: a("href", ""), x: num("x"), y: num("y"), w: num("width"), h: num("height") });
      continue;
    }
    let p = new Path2D(), open = false;
    switch (n.tagName) {
      case "rect":
        p = roundRectPath(num("x"), num("y"), num("width"), num("height"), num("rx"));
        break;
      case "circle":
        p.arc(num("cx"), num("cy"), num("r"), 0, Math.PI * 2);
        break;
      case "ellipse":
        p.ellipse(num("cx"), num("cy"), num("rx"), num("ry"), 0, 0, Math.PI * 2);
        break;
      case "line":
        p.moveTo(num("x1"), num("y1"));
        p.lineTo(num("x2"), num("y2"));
        open = true;
        break;
      case "polygon":
      case "polyline": {
        const v = a("points", "").trim().split(/[\s,]+/).map(Number);
        p.moveTo(v[0], v[1]);
        for (let i = 2; i < v.length; i += 2) p.lineTo(v[i], v[i + 1]);
        if (n.tagName === "polygon") p.closePath();
        else open = true;
        break;
      }
      case "path":
        p = new Path2D(a("d", ""));
        break;
      default:
        continue;
    }
    out.push({
      p,
      fill: open ? null : style.fill && style.fill !== "none" ? style.fill : null,
      stroke: style.stroke && style.stroke !== "none" ? style.stroke : null,
      sw: style.sw || 1,
      cap: style.cap || "butt",
      dash: style.dash ? style.dash.split(/[\s,]+/).map(Number) : null,
      opacity: n.hasAttribute("opacity") ? +n.getAttribute("opacity") : null
    });
  }
  return out;
}
function compile(markup, c) {
  const doc = new DOMParser().parseFromString(`<svg xmlns="http://www.w3.org/2000/svg">${markup}</svg>`, "image/svg+xml");
  return compileNode(doc.documentElement, c, { fill: "none", stroke: "none", sw: 1, cap: "butt", dash: null });
}
function list(key, c, make) {
  let v = listCache.get(key);
  if (!v) listCache.set(key, (v = compile(make(), c)));
  return v;
}
// Raster textures referenced by <image href="name">; loaded once, drawn when ready.
const textures = {};
function texture(name) {
  let im = textures[name];
  if (!im) {
    im = textures[name] = new Image();
    im.src = name === "face" ? FACE : name === "skull" ? SKULL : name === "skullB" ? SKULLB : name;
  }
  return im.complete && im.naturalWidth ? im : null;
}
// dyn[id]: false hides the group; true shows a data-off group;
// { rotate, scale: [sx, sy], translate: [dx, dy] } moves it around its pivot.
function run(g, items, dyn) {
  for (const it of items) {
    if (it.group) {
      const d = dyn[it.id];
      if (d === false || (it.off && !d)) continue;
      g.save();
      for (const [op, v] of it.tf) {
        if (op === "translate") g.translate(v[0], v[1] ?? 0);
        else if (op === "rotate") g.rotate((v[0] * Math.PI) / 180);
        else g.scale(v[0], v[1] ?? v[0]);
      }
      if (d && typeof d === "object") {
        const [px, py] = it.pivot;
        g.translate(px, py);
        if (d.translate) g.translate(d.translate[0], d.translate[1]);
        if (d.rotate) g.rotate(d.rotate);
        if (d.scale) g.scale(d.scale[0], d.scale[1]);
        g.translate(-px, -py);
      }
      if (it.opacity != null) g.globalAlpha *= it.opacity;
      run(g, it.kids, dyn);
      g.restore();
      continue;
    }
    if (it.img) {
      const im = texture(it.img);
      if (im) {
        g.imageSmoothingEnabled = true;
        g.drawImage(im, it.x, it.y, it.w, it.h);
      }
      continue;
    }
    const a = g.globalAlpha;
    if (it.opacity != null) g.globalAlpha *= it.opacity;
    if (it.fill) {
      g.fillStyle = it.fill;
      g.fill(it.p);
    }
    if (it.stroke) {
      g.strokeStyle = it.stroke;
      g.lineWidth = it.sw;
      g.lineCap = it.cap;
      if (it.dash) g.setLineDash(it.dash);
      g.stroke(it.p);
      if (it.dash) g.setLineDash([]);
    }
    g.globalAlpha = a;
  }
}

// ---- public API -------------------------------------------------------------------
const hasArt = (kind) => !!TOWERS[kind];
// Placed tower around its center, in cells. Returns false when the kind still
// uses the old art (the board falls back to it).
function drawTower(g, kind, level, o = {}) {
  if (!TOWERS[kind]) return false;
  const c = TOWER[kind].color;
  const parts = list(`${kind}:${level}`, c, () => {
    const m = TOWERS[kind](level);
    return G("base", m.base) + (m.turret ? G("turret", m.turret) : "");
  });
  const dyn = { turret: { rotate: o.aim ?? 0 } };
  // the unit always stands in its building: several can be out on the road at once
  if (kind === "icu") dyn.sortie = { scale: [Math.max(0, Math.min(1, o.ready ?? 1)), 1] };
  if (kind === "robot" || kind === "spawner") Object.assign(dyn, { turret: undefined, parked: true, empty: false, sortie: { scale: [Math.max(0, Math.min(1, o.ready ?? 1)), 1] }, treadB: false });
  if (kind === "plane") Object.assign(dyn, { parked: !!o.parked, exhaust: false });
  g.save();
  g.scale(0.05, 0.05);
  if (o.under) {
    let done = false;
    for (const it of parts) {
      if (!done && it.id === "turret") { done = true; g.save(); g.scale(20, 20); o.under(); g.restore(); }
      run(g, [it], dyn);
    }
    if (!done) { g.scale(20, 20); o.under(); }
  } else run(g, parts, dyn);
  g.restore();
  return true;
}
const UNITS = { robot: robotUnit, spawner: carUnit, skeleton: skeletonUnit, knight: knightUnit, icuTrooper: icuTrooper, icuTruck: icuTruck, icuTank: icuTank };
function drawShip(g, o = {}) {
  const parts = list('icu:ship', TOWER.icu.color, icuShip);
  g.save();
  g.scale(0.05, 0.05);
  run(g, parts, { mgL: { rotate: o.mgL ?? 0 }, mgR: { rotate: o.mgR ?? 0 }, flash: { rotate: o.flash ?? 0 }, rail: { rotate: o.rail ?? 0 } });
  g.restore();
}
function drawUnit(g, kind, level, o = {}) {
  if (!UNITS[kind]) return false;
  const parts = list(`unit:${kind}:${level}`, o.color ?? TOWER[kind].color, () => UNITS[kind](level));
  const frame = Math.floor((o.travel ?? 0) * (o.step ?? 6)) % 2 === 0;
  g.save();
  g.scale(0.05, 0.05);
  run(g, parts, { turret: { rotate: o.gunAngle ?? 0 }, mg: { rotate: o.mgAngle ?? 0 }, treadA: frame, treadB: !frame, handA: frame, handB: !frame });
  g.restore();
  return true;
}
function drawPlane(g, level, o = {}) {
  const parts = list(`air:${level}`, TOWER.plane.color, () => planeUnit(level));
  g.save();
  g.scale(0.05, 0.05);
  run(g, parts, { exhaust: true });
  g.restore();
}
// Standalone SVG (colors resolved) for icons and for opening in a vector tool.
function towerSVG(kind, level, part = "tower") {
  const c = TOWER[kind].color;
  let body, w, h;
  if (part === "unit") {
    body = UNITS[kind](level);
    w = h = 3.6;
  } else if (part === "air") {
    body = planeUnit(level);
    w = h = 3.4;
  } else {
    const m = TOWERS[kind](level);
    body = m.base + (m.turret ? G("turret", m.turret, ' transform="rotate(-90)"') : "");
    [w, h] = TOWER[kind].size;
  }
  body = body.replace(/<g id="(treadB|empty)"[^>]*data-off="1"[^>]*>.*?<\/g>/g, "").replace(/href="face"/g, `href="${FACE}"`);
  body = body.replace(/(fill|stroke)="([^"]+)"/g, (_, k, v) => `${k}="${color(v, c)}"`);
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${-w * 10} ${-h * 10} ${w * 20} ${h * 20}">${body}</svg>`;
}

// Guard entries in this page's own history turn browser Back into an app action.
